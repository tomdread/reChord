<script>
// chord-name-detector.js
"use strict";

const NOTE_TO_SEMITONE = {
    'C': 0,  'C#': 1, 'Db': 1,
    'D': 2,  'D#': 3, 'Eb': 3,
    'E': 4,  'Fb': 4, 'E#': 5,
    'F': 5,  'F#': 6, 'Gb': 6,
    'G': 7,  'G#': 8, 'Ab': 8,
    'A': 9,  'A#': 10, 'Bb': 10,
    'B': 11, 'Cb': 11, 'B#': 0
};

const CHORD_PATTERNS = {
    'Major':            [0, 4, 7],
    'Minor':            [0, 3, 7],
    'Diminished':       [0, 3, 6],
    'Augmented':        [0, 4, 8],
    'Sus2':             [0, 2, 7],
    'Sus4':             [0, 5, 7],
    'Major 7th':        [0, 4, 7, 11],
    'Minor 7th':        [0, 3, 7, 10],
    'Dominant 7th':     [0, 4, 7, 10],
    'Half-Diminished':  [0, 3, 6, 10],
    'Diminished 7th':   [0, 3, 6, 9],
    'Minor-Major 7th':  [0, 3, 7, 11],
    'Aug-Major 7th':    [0, 4, 8, 11]
};

const OCTAVE_SEMITONES = 12;

function normalizeNotes(notes) {
    const getPitchClass = note => note.replace(/[0-9]/g, '').toUpperCase();
    const semitones = notes.map(n => NOTE_TO_SEMITONE[getPitchClass(n)]);
    return [...new Set(semitones)];
}

function getIntervals(root, semitones) {
    return semitones.map(p => (p - root + OCTAVE_SEMITONES) % OCTAVE_SEMITONES).sort((a, b) => a - b);
}

function matchChord(intervals) {
    for (const [name, pattern] of Object.entries(CHORD_PATTERNS)) {
    if (pattern.length !== intervals.length) continue;
    if (pattern.every((val, i) => val === intervals[i])) return name;
    }
    return null;
}

function detectChord(notes) {
    const uniqueSemitones = normalizeNotes(notes);
    if (uniqueSemitones.length < 2) return null;

    for (let root of uniqueSemitones) {
    const intervals = getIntervals(root, uniqueSemitones);
    const chordName = matchChord(intervals);
    if (chordName) {
        const rootNote = Object.keys(NOTE_TO_SEMITONE)
        .find(k => NOTE_TO_SEMITONE[k] === root && !k.includes('b') && k.length <= 2); // Prefer non-flat, simple names
        return `${rootNote} ${chordName}`;
    }
    }
    return 'Unknown Chord';
}

if (typeof window !== 'undefined') {
    window.detectChord = detectChord;
} else {
    module.exports = { detectChord };
}
</script>

function invertChord(notes, inversion) {
    if (!notes || notes.length === 0) return notes;
    
    const numNotes = notes.length;
    const maxInversion = Math.max(0, numNotes - 1);
    // Cycle inversion: ((value % divisor) + divisor) % divisor handles negative mods
    inversion = ((inversion % (maxInversion + 1)) + (maxInversion + 1)) % (maxInversion + 1);
    
    const result = [...notes];
    for (let i = 0; i < inversion; i++) {
        if (result.length > 0) {
            const firstNote = result.shift();
            result.push(firstNote + OCTAVE_SEMITONES); 
        }
    }
    return result;
}

function updateTiltDisplay() {
    const tiltAmountEl = document.getElementById('tilt-amount');
    const tiltPivotEl = document.getElementById('tilt-pivot');
    if (tiltAmountEl) tiltAmountEl.textContent = tiltAmount.toFixed(2);
    if (tiltPivotEl) tiltPivotEl.textContent = tiltPivot.toFixed(2);
}

function applyVelocityTilt(chordNotes, ccVelocityTiltValue) {
    if (!chordNotes || chordNotes.length === 0) return chordNotes;
    
    if (ccVelocityTiltValue !== 0) { // Only update tiltAmount if CC value is explicitly provided (non-zero)
        if (ccVelocityTiltValue === TILT_CC_VAL_MAX) tiltCounter++;
        else if (ccVelocityTiltValue === TILT_CC_VAL_MIN) tiltCounter--;
        else { tiltCounter = 0; } // Reset counter for other values, effectively needing sustained min/max

        if (Math.abs(tiltCounter) >= TILT_CC_THRESHOLD) {
            if (tiltCounter > 0) {
                tiltAmount = Math.max(TILT_AMOUNT_MIN, tiltAmount - TILT_AMOUNT_STEP);
            } else { // tiltCounter < 0
                tiltAmount = Math.min(TILT_AMOUNT_MAX, tiltAmount + TILT_AMOUNT_STEP);
            }
            tiltCounter = 0; // Reset after change
        }
        if (ccVelocityTiltValue === TILT_CC_VAL_CENTER) {
            tiltAmount = 0.0;
            tiltCounter = 0;
        }
    }
    
    // Always apply current tilt, even if ccVelocityTiltValue was 0 (which means "don't change tiltAmount")
    const sortedNotes = [...chordNotes].sort((a, b) => a.pitch - b.pitch);
    const pivotShift = tiltAmount * TILT_PIVOT_SHIFT_FACTOR;
    // Calculate pivot point: center of the chord, shifted by tilt
    const centerPivot = (sortedNotes.length - 1) / 2.0;
    const currentPivot = Math.max(0, Math.min(sortedNotes.length - 1, centerPivot + pivotShift));
    
    tiltPivot = currentPivot; // Update global state for display
    updateTiltDisplay(); // Update display after pivot is calculated or tiltAmount changed
    
    return sortedNotes.map((note, index) => {
        const velocityDelta = (index - currentPivot) * tiltAmount * TILT_VELOCITY_MULTIPLIER;
        const newVelocity = Math.max(MIN_VELOCITY, Math.min(MAX_VELOCITY, note.velocity + velocityDelta));
        return { ...note, velocity: Math.round(newVelocity) };
    });
}

    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const octave = Math.floor(midiNote / OCTAVE_SEMITONES) - 1; // C4=60 -> Octave 4
    const noteName = notes[midiNote % OCTAVE_SEMITONES];
    return `${noteName}${octave}`;
}

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => {
            showNotification('Failed to initialize storage: ' + request.error.message, 'warning');
            reject(request.error);
        };
        request.onsuccess = () => {
            db = request.result;
            resolve();
        };
        request.onupgradeneeded = (event) => {
            const currentDb = event.target.result; // Use event.target.result
            if (!currentDb.objectStoreNames.contains(STORE_NAME_SONGS)) {
                currentDb.createObjectStore(STORE_NAME_SONGS);
            }
            if (!currentDb.objectStoreNames.contains(STORE_NAME_PORTS)) {
                currentDb.createObjectStore(STORE_NAME_PORTS);
            }
        };
    });
}

async function savePortSelections() {
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME_PORTS, 'readwrite');
        const store = tx.objectStore(STORE_NAME_PORTS);
        const portSelections = {
            input: currentInput ? currentInput.id : null,
            outputs: {
                main: currentOutputs.main ? currentOutputs.main.id : null,
                bass: currentOutputs.bass ? currentOutputs.bass.id : null,
                chord: currentOutputs.chord ? currentOutputs.chord.id : null,
                string: currentOutputs.string ? currentOutputs.string.id : null
            }
        };
        const request = store.put(portSelections, 'current'); // Use a fixed key 'current'
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
}

async function loadPortSelections() {
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME_PORTS, 'readonly');
        const store = tx.objectStore(STORE_NAME_PORTS);
        const request = store.get('current'); // Use a fixed key 'current'
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

async function refreshPortLists() {
    const inputsSel = document.getElementById('inputs');
    const mainOutputsSel = document.getElementById('outputs'); // For main output
    
    if (!inputsSel || !mainOutputsSel ) {
        showNotification('Core MIDI selectors not found in DOM', 'warning');
        return;
    }

    inputsSel.innerHTML = '<option value="">Select MIDI Input</option>';
    mainOutputsSel.innerHTML = '<option value="">Select Main MIDI Output</option>';
    ['bass', 'chord', 'string'].forEach(type => {
        const selector = document.getElementById(`${type}-outputs`);
        if (selector) selector.innerHTML = `<option value="">Select ${type.charAt(0).toUpperCase() + type.slice(1)} Output</option>`;
    });
    
    let hasInputs = false;
    let hasOutputs = false;

    if (!midiAccess) {
        showNotification('MIDI Access not available for refreshing ports.', 'warning');
        return;
    }

    midiAccess.inputs.forEach(inp => { // Use forEach for brevity
        hasInputs = true;
        const opt = new Option(inp.name, inp.id);
        if (currentInput && inp.id === currentInput.id) opt.selected = true;
        inputsSel.add(opt);
    });

    midiAccess.outputs.forEach(outp => {
        hasOutputs = true;
        const optBase = new Option(outp.name, outp.id);
        mainOutputsSel.add(optBase.cloneNode(true));
        ['bass', 'chord', 'string'].forEach(type => {
            const selector = document.getElementById(`${type}-outputs`);
            if (selector) selector.add(optBase.cloneNode(true));
        });
    });

    inputsSel.disabled = !hasInputs;
    mainOutputsSel.disabled = !hasOutputs;
    ['bass', 'chord', 'string'].forEach(type => {
        const selector = document.getElementById(`${type}-outputs`);
        if (selector) selector.disabled = !hasOutputs;
    });

    updateMIDIStatus();

    try {
        const savedPorts = await loadPortSelections();
        if (savedPorts) {
            if (savedPorts.input && midiAccess.inputs.has(savedPorts.input)) {
                selectInput(savedPorts.input); inputsSel.value = savedPorts.input;
            }
            if (savedPorts.outputs) {
                Object.entries(savedPorts.outputs).forEach(([type, id]) => {
                    if (id && midiAccess.outputs.has(id)) {
                        selectOutput(type, id);
                        const selector = document.getElementById(type === 'main' ? 'outputs' : `${type}-outputs`);
                        if (selector) selector.value = id;
                    }
                });
            }
        } else { // First run or no saved ports - use defaults
            if (hasInputs) {
                for (let inp of midiAccess.inputs.values()) { // Need .values() for iterator
                    if (inp.name === DEFAULT_INPUT_NAME) {
                        selectInput(inp.id); inputsSel.value = inp.id; break;
                    }
                }
            }
            if (hasOutputs) {
                 Object.entries(DEFAULT_OUTPUT_NAMES).forEach(([type, name]) => {
                    for (let outp of midiAccess.outputs.values()) { // Need .values() for iterator
                        if (outp.name === name) {
                            selectOutput(type, outp.id);
                            const selector = document.getElementById(type === 'main' ? 'outputs' : `${type}-outputs`);
                            if (selector) selector.value = outp.id;
                            break; 
                        }
                    }
                });
            }
        }
    } catch (error) {
        console.error('Error loading port selections:', error);
        showNotification('Error loading saved port selections', 'warning');
    }

    inputsSel.onchange = () => {
        selectInput(inputsSel.value); savePortSelections();
        showNotification(`Input: ${inputsSel.value ? inputsSel.options[inputsSel.selectedIndex].text : 'None'}`, 'info');
        updateMIDIStatus();
    };
    mainOutputsSel.onchange = () => {
        selectOutput('main', mainOutputsSel.value); savePortSelections();
        showNotification(`Main Out: ${mainOutputsSel.value ? mainOutputsSel.options[mainOutputsSel.selectedIndex].text : 'None'}`, 'info');
        updateMIDIStatus();
    };
    ['bass', 'chord', 'string'].forEach(type => {
        const selector = document.getElementById(`${type}-outputs`);
        if (selector) {
            selector.onchange = () => {
                selectOutput(type, selector.value); savePortSelections();
                showNotification(`${type.charAt(0).toUpperCase() + type.slice(1)} Out: ${selector.value ? selector.options[selector.selectedIndex].text : 'None'}`, 'info');
                updateMIDIStatus();
            };
        }
    });
}

function trackPortState(port) {
    lastPortStates.set(port.id, port.state);
}

function selectInput(id) {
    if (currentInput && currentInput.id === id && currentInput.state === 'connected') return; // Avoid re-selecting if already connected
    if (currentInput) {
        currentInput.onmidimessage = null;
        currentInput.close && currentInput.close(); // Close if possible, good practice
    }
    
    currentInput = id ? midiAccess.inputs.get(id) : null;
    if (currentInput) {
        currentInput.onmidimessage = handleMIDIMessage;
        // For Web MIDI API v1, port.open() might be needed explicitly or implicitly.
        // However, modern browsers usually handle this. If issues, add: currentInput.open();
        trackPortState(currentInput);
        const mainPianoSection = document.querySelector('#main-piano')?.parentElement;
        if (mainPianoSection) {
            const titleEl = mainPianoSection.querySelector('h3');
            if (titleEl) titleEl.textContent = 'Controller: ' + currentInput.name;
        }
    } else {
         const mainPianoSection = document.querySelector('#main-piano')?.parentElement;
        if (mainPianoSection) {
            const titleEl = mainPianoSection.querySelector('h3');
            if (titleEl) titleEl.textContent = 'Controller: MIDI Input';
        }
    }
    updateMIDIStatus();
}

function selectOutput(type, id) {
    if (currentOutputs[type] && currentOutputs[type].id === id && currentOutputs[type].state === 'connected') return;
    // Unlike inputs, outputs don't have onmidimessage. Closing previous not strictly necessary unless managing resources tightly.
    // if (currentOutputs[type]) { currentOutputs[type].close && currentOutputs[type].close(); }

    currentOutputs[type] = id ? midiAccess.outputs.get(id) : null;
    // if (currentOutputs[type]) { currentOutputs[type].open && currentOutputs[type].open(); }
    if (currentOutputs[type]) trackPortState(currentOutputs[type]);
    updateMIDIStatus();
}

function onMIDISuccess(access) {
    midiAccess = access;
    midiAccess.inputs.forEach(trackPortState);
    midiAccess.outputs.forEach(trackPortState);
    
    refreshPortLists();
    showNotification('MIDI system initialized', 'success');

    midiAccess.onstatechange = (e) => {
        const port = e.port;
        const portType = port.type.charAt(0).toUpperCase() + port.type.slice(1);
        if (portChangeTimeout) clearTimeout(portChangeTimeout);
        portChangeTimeout = setTimeout(() => {
            showNotification(`${portType} port '${port.name}' ${port.state}`, port.state === 'connected' ? 'info' : 'warning');
            // Check if state actually changed from last known, as onstatechange can fire for other reasons
            if (port.state !== lastPortStates.get(port.id)) {
                trackPortState(port); // Update our tracked state
                refreshPortLists(); // Refresh lists to reflect new state and re-select if necessary
            } else if (port.type === "input" && currentInput && port.id === currentInput.id && port.state === "disconnected") {
                // Handle current input becoming disconnected
                selectInput(null); // Deselect it
                refreshPortLists();
            } else if (port.type === "output") {
                let changed = false;
                for (const type in currentOutputs) {
                    if (currentOutputs[type] && port.id === currentOutputs[type].id && port.state === "disconnected") {
                        selectOutput(type, null); // Deselect it
                        changed = true;
                    }
                }
                if (changed) refreshPortLists();
            }
        }, PORT_CHANGE_DELAY);
    };
}

class ButtonManager {
    constructor() {
        this.buttons = new Map(); 
        this.pressTimes = new Map(); 
        this.holdIntervals = new Map();
        this.simultaneousGroups = new Map();
        // Using global constants now
        // this.HOLD_THRESHOLD = RECORD_HOLD_THRESHOLD; 
        // this.SIMULTANEOUS_WINDOW = SIMULTANEOUS_PRESS_WINDOW;
        // this.PRESS_THRESHOLD = VELOCITY_THRESHOLD;
    }
    registerButton(cc, config) {
        this.buttons.set(cc, {
            onPress: config.onPress || (() => {}), 
            onRelease: config.onRelease || (() => {}),
            onHold: config.onHold || (() => {}), 
            holdThreshold: config.holdThreshold || RECORD_HOLD_THRESHOLD, // Use global
            simultaneousGroup: config.simultaneousGroup || null
        });
    }
    registerSimultaneousGroup(groupId, buttons, handler) {
        this.simultaneousGroups.set(groupId, { buttons: new Set(buttons), handler: handler });
    }
    handleMessage(status, data1, data2) {
        const type = status & 0xF0; 
        const channel = (status & 0x0F) + 1;
        const pitch = data1; // CC number
        const value = data2; // CC value

        if (type !== MIDI_CONTROL_CHANGE || channel !== MIDI_CHANNEL_MAIN) return; 
        
        const button = this.buttons.get(pitch); 
        if (!button) return;

        if (value >= VELOCITY_THRESHOLD) this.handlePress(pitch, button); // Use global
        else this.handleRelease(pitch, button);
    }
    handlePress(pitch, button) {
        const now = Date.now(); 
        this.pressTimes.set(pitch, now);

        if (button.simultaneousGroup) this.checkSimultaneousPress(button.simultaneousGroup);
        
        if (button.onHold) {
            if (this.holdIntervals.has(pitch)) clearInterval(this.holdIntervals.get(pitch));
            const interval = setInterval(() => {
                const pressDuration = Date.now() - (this.pressTimes.get(pitch) || now);
                if (pressDuration >= button.holdThreshold) {
                    button.onHold(); 
                    clearInterval(interval); 
                    this.holdIntervals.delete(pitch);
                }
            }, 100); // Check interval, could be a constant e.g. HOLD_CHECK_INTERVAL = 100
            this.holdIntervals.set(pitch, interval);
        }
        button.onPress();
    }
    handleRelease(pitch, button) {
        if (this.holdIntervals.has(pitch)) {
            clearInterval(this.holdIntervals.get(pitch)); 
            this.holdIntervals.delete(pitch);
        }
        const pressTime = this.pressTimes.get(pitch);
        const pressDuration = pressTime ? Date.now() - pressTime : 0;
        this.pressTimes.delete(pitch);
        button.onRelease(pressDuration);
    }
    checkSimultaneousPress(groupId) {
        const group = this.simultaneousGroups.get(groupId); if (!group) return;
        const now = Date.now();
        const pressedButtons = Array.from(group.buttons)
            .filter(cc => this.pressTimes.has(cc) && (now - this.pressTimes.get(cc) < SIMULTANEOUS_PRESS_WINDOW)); // Use global
        if (pressedButtons.length === group.buttons.size) group.handler();
    }
}

function handleMIDIMessage(ev) {
    try {
        if (!ev.data || ev.data.length < 2) { showNotification('Invalid MIDI message', 'warning'); return; }
        logMIDIMessage(ev); 
        // Moved flashActivity('input') to specific Note ON/OFF handlers for better context

        const [status, data1, data2] = ev.data;

        buttonManager.handleMessage(status, data1, data2);

        // Explicit STOP mode handling: passthrough all MIDI and return
        if (mode === MODE_STOP) {
            send(ev.data, 'main');
            if ((status & 0xF0) === MIDI_NOTE_ON || (status & 0xF0) === MIDI_NOTE_OFF) {
                 flashActivity('input'); updateKeyboard(data1, (status & 0xF0) === MIDI_NOTE_ON && data2 > 0);
            }
            return;
        }
        
        const type = status & 0xF0; 
        const channel = (status & 0x0F) + 1;
        const pitch = data1; 
        const value = data2;

        // Global controls (not mode-dependent after STOP check)
        if (type === MIDI_CONTROL_CHANGE && channel === MIDI_CHANNEL_MAIN) {
            if (pitch === CC_INVERSION) {
                const maxInv = getMaxInversion();
                if (value === MAX_VELOCITY) inversionCounter++; 
                else if (value === MIN_VELOCITY) inversionCounter--; 
                else inversionCounter = 0;

                if (Math.abs(inversionCounter) >= INVERSION_CC_THRESHOLD) {
                    currentInversion = (currentInversion + (inversionCounter > 0 ? 1 : -1) + maxInv + 1) % (maxInv + 1);
                    inversionCounter = 0; 
                    clearAllChordNotes(); 
                    updateInversionDisplay();
                    if (isPadTriggerMode && Chords.string.length > 0) { // Retrigger current chord with new inversion
                        const chordNotes = Chords.string.map(n => ({ pitch: n + transposeOffset + (fullChordOctaveOffset * OCTAVE_SEMITONES), velocity: DEFAULT_TRIGGER_VELOCITY }));
                        // Apply tilt, but don't change tiltAmount itself (pass 0 for ccVelocityTiltValue)
                        const tiltedNotes = applyVelocityTilt(chordNotes, 0); 
                        Chords.triggers[NOTE_FULL_CHORD_TRIGGER] = tiltedNotes.map(n => n.pitch); // Assuming it behaves like full chord trigger
                        sendChord(tiltedNotes.map(n => n.pitch), tiltedNotes[0]?.velocity || DEFAULT_TRIGGER_VELOCITY, MIDI_CHANNEL_MAIN, 'chord');
                    }
                }
                return;
            }
            if (pitch === CC_VELOCITY_TILT) {
                if (Chords.string.length > 0) { // Only makes sense if a chord is loaded
                    const testChord = Chords.string.map(n => ({ pitch: n + transposeOffset + (fullChordOctaveOffset * OCTAVE_SEMITONES), velocity: DEFAULT_TRIGGER_VELOCITY }));
                    applyVelocityTilt(testChord, value); // Pass CC value to update tiltAmount
                }
                return;
            }
        }
        
        if (type === MIDI_PITCH_BEND || (type === MIDI_CONTROL_CHANGE && data1 === MIDI_MODULATION_WHEEL)) {
            ['main', 'bass', 'chord', 'string'].forEach(portType => send(ev.data, portType));
            return;
        }
        
        // Drum channel passthrough (if not handled by pad logic in PLAY mode later)
        if (channel === MIDI_CHANNEL_DRUMS && mode !== MODE_PLAY) { // In PLAY mode, drum channel might be pads
            send(ev.data, 'main'); 
            if (type === MIDI_NOTE_ON || type === MIDI_NOTE_OFF) {
                flashActivity('input'); updateKeyboard(pitch, type === MIDI_NOTE_ON && value > 0);
            }
            return;
        }


        // Sequence recording: Pad input (mapped keys on CH_MAIN)
        // This must come BEFORE MODE_RECORD general note handling to intercept pad presses for sequence.
        if (isRecordingSequence && type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && value > 0 && PAD_MAP_1[pitch]) {
            flashActivity('input'); updateKeyboard(pitch, true);
            const padNumber = PAD_MAP_1[pitch];
            const padData = Chords.pads[padNumber];

            if (padData && padData.chord && padData.chord.length > 0) {
                if (Chords.sequence.length < MAX_SEQUENCE_LENGTH) {
                    Chords.sequence.push(padNumber);
                    showNotification(`Seq Add Pad: ${padNumber} (${Chords.sequence.length}/${MAX_SEQUENCE_LENGTH})`, 'info');
                    updateStatus(); // Update sequence display
                } else {
                    showNotification(`Max sequence length (${MAX_SEQUENCE_LENGTH}) reached.`, 'warning');
                }
            } else {
                showNotification(`Pad ${padNumber} is empty or not defined, cannot add to sequence.`, 'warning');
            }
            return; // Consume this pad press
        }


        if (mode === MODE_RECORD) {
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && value > 0) {
                flashActivity('input'); updateKeyboard(pitch, true);
                const potentialPadKey = PAD_MAP_1[pitch] || pitch; 

                if (isArmingSave) {
                    selectedStoragePad = potentialPadKey; // Any note can be a storage pad if armed
                    showNotification(`Pad ${selectedStoragePad} selected for save. Release Record to confirm.`, 'info');
                    return; 
                } else { // Not arming save, so treat as musical note input
                    send(ev.data, 'main'); // Passthrough to main output
                    const noteIndex = Chords.record.indexOf(pitch);
                    if (noteIndex === -1) { // Add note
                        if (Chords.record.length < MAX_CHORD_NOTES) {
                            Chords.record.push(pitch);
                            Chords.record.sort((a, b) => a - b);
                        }
                    } else { // Remove note
                        Chords.record.splice(noteIndex, 1);
                    }
                    // updateStatus(); // Called below
                    showNotification(`${noteIndex === -1 ? 'Added' : 'Removed'} ${getNoteNameFromMIDI(pitch)} to current chord.`, 'info');

                    if (isRecordingSequence) { // And it wasn't a PAD_MAP_1[pitch] handled above
                        pendingSequenceChord = [...Chords.record];
                        isWaitingForSequenceStepConfirmation = true;
                        let chordNotesText = pendingSequenceChord.length > 0 
                            ? pendingSequenceChord.map(note => getNoteNameFromMIDI(note)).join(' ') : 'No Chord';
                        let chordName = pendingSequenceChord.length > 0 
                            ? (detectChord(pendingSequenceChord.map(note => getNoteNameFromMIDI(note))) || 'Unknown Chord') : '-';
                        const nextStepNumber = Chords.sequence.length + 1;
                        showNotification(`Step ${nextStepNumber} pending: ${chordName} (${chordNotesText}). Press Next Step (Data1+Data2) to record.`, 'info', 4000);
                    }
                    updateStatus(); // Update UI including any pending sequence chord info potentially
                    return;
                }
            } else if (type === MIDI_NOTE_OFF && channel === MIDI_CHANNEL_MAIN) {
                flashActivity('input'); updateKeyboard(pitch, false);
                if (isArmingSave) {
                    return; // Ignore note-offs for pads if arming save
                } else {
                    send(ev.data, 'main'); // Passthrough musical note-offs
                    return;
                }
            } else if (channel === MIDI_CHANNEL_MAIN) { // Other CCs or messages on main channel
                if (!isArmingSave) {
                     send(ev.data, 'main'); // General passthrough
                }
                return;
            }
            return; 
        }

        if (mode === MODE_PLAY) {
            // --- Note ON specific logic for PLAY mode ---
            if (type === MIDI_NOTE_ON && value > 0) {
                flashActivity('input'); updateKeyboard(pitch, true, 'main'); // Update main keyboard for all inputs

                if (channel === MIDI_CHANNEL_MAIN) {
                    // Add chord trigger toggle handling
                    if (pitch === NOTE_CHORD_TRIGGER_TOGGLE) {
                        isPadTriggerMode = !isPadTriggerMode;
                        showNotification(`Chord trigger ${isPadTriggerMode ? 'ON' : 'OFF'}`, 'info');
                        if (isPadTriggerMode && Chords.string.length > 0) {
                            // If turning on trigger mode and we have a chord loaded, trigger it
                            const chordNotes = Chords.string.map(n => ({ 
                                pitch: n + transposeOffset + (fullChordOctaveOffset * OCTAVE_SEMITONES), 
                                velocity: DEFAULT_TRIGGER_VELOCITY 
                            }));
                            const tiltedNotes = applyVelocityTilt(chordNotes, 0);
                            Chords.triggers[NOTE_FULL_CHORD_TRIGGER] = tiltedNotes.map(n => n.pitch);
                            sendChord(tiltedNotes.map(n => n.pitch), tiltedNotes[0]?.velocity || DEFAULT_TRIGGER_VELOCITY, MIDI_CHANNEL_MAIN, 'chord');
                        }
                        return;
                    }

                    // Octave controls
                    if ([NOTE_CHORD_OCTAVE_UP, NOTE_CHORD_OCTAVE_DOWN, NOTE_STRING_OCTAVE_UP, NOTE_STRING_OCTAVE_DOWN].includes(pitch)) {
                        const now = Date.now(); keyPressTimes.set(pitch, now);
                        const chUpTime = keyPressTimes.get(NOTE_CHORD_OCTAVE_UP), chDownTime = keyPressTimes.get(NOTE_CHORD_OCTAVE_DOWN);
                        const strUpTime = keyPressTimes.get(NOTE_STRING_OCTAVE_UP), strDownTime = keyPressTimes.get(NOTE_STRING_OCTAVE_DOWN);

                        if (chUpTime && chDownTime && Math.abs(chUpTime - chDownTime) < SIMULTANEOUS_PRESS_WINDOW) {
                            fullChordOctaveOffset = 0; showNotification('Chord octave reset', 'info');
                            keyPressTimes.delete(NOTE_CHORD_OCTAVE_UP); keyPressTimes.delete(NOTE_CHORD_OCTAVE_DOWN); return;
                        }
                        if (strUpTime && strDownTime && Math.abs(strUpTime - strDownTime) < SIMULTANEOUS_PRESS_WINDOW) {
                            stringOctaveOffset = 0; showNotification('String octave reset', 'info');
                            keyPressTimes.delete(NOTE_STRING_OCTAVE_UP); keyPressTimes.delete(NOTE_STRING_OCTAVE_DOWN); return;
                        }
                        if (pitch === NOTE_CHORD_OCTAVE_UP) { fullChordOctaveOffset++; showNotification(`Chord Oct: ${fullChordOctaveOffset > 0 ? '+' : ''}${fullChordOctaveOffset}`, 'info'); return; }
                        if (pitch === NOTE_CHORD_OCTAVE_DOWN) { fullChordOctaveOffset--; showNotification(`Chord Oct: ${fullChordOctaveOffset > 0 ? '+' : ''}${fullChordOctaveOffset}`, 'info'); return; }
                        if (pitch === NOTE_STRING_OCTAVE_UP) { stringOctaveOffset++; showNotification(`String Oct: ${stringOctaveOffset > 0 ? '+' : ''}${stringOctaveOffset}`, 'info'); return; }
                        if (pitch === NOTE_STRING_OCTAVE_DOWN) { stringOctaveOffset--; showNotification(`String Oct: ${stringOctaveOffset > 0 ? '+' : ''}${stringOctaveOffset}`, 'info'); return; }
                    }
                    // Chord Trigger Toggle (using a NOTE, not CC as per original CC_CHORD_TRIGGER_TOGGLE = 48)
                    // Assuming original intent might have been a note for this, if CC_CHORD_TRIGGER_TOGGLE is not used by ButtonManager.
                    // For now, sticking to original constant (48) which is a CC. ButtonManager should handle it.
                    // If NOTE_CHORD_TRIGGER_TOGGLE was intended, it should be defined and used here.

                    // Transpose keys
                    if (pitch >= MIDI_NOTE_C3 && pitch <= MIDI_NOTE_B3) {
                        transposeOffset = pitch - MIDI_NOTE_C3; showNotification(`Transpose: ${transposeOffset}`, 'info');
                        if (isPadTriggerMode && Chords.string.length > 0 && !isSequenceMode) {
                            const baseNotes = Chords.string.map(n => n + transposeOffset + (fullChordOctaveOffset * OCTAVE_SEMITONES));
                            const notesToPlayObjects = baseNotes.map(p => ({ pitch: p, velocity: value }));
                            Chords.triggers[pitch] = notesToPlayObjects.map(n => n.pitch);
                            sendChord(notesToPlayObjects.map(n => n.pitch), value, MIDI_CHANNEL_MAIN, 'chord'); // sendChord handles tilt/inversion
                        }
                        return;
                    }
                    
                    // String/Bass/Full Chord Triggers
                    let targetOutput = null, notesToPlay = [], triggerKey = pitch;
                    if (STRING_TRIGGER_NOTES.includes(pitch) && Chords.string.length) {
                        let idx = STRING_TRIGGER_NOTES.indexOf(pitch);
                        if (idx >= Chords.string.length) idx = Chords.string.length - 1;
                        notesToPlay = [Chords.string[idx] + transposeOffset + (stringOctaveOffset * OCTAVE_SEMITONES)];
                        targetOutput = 'string';
                    } else if (BASS_TRIGGER_NOTES.includes(pitch) && Chords.string.length) {
                        let idx = BASS_TRIGGER_NOTES.indexOf(pitch);
                        if (idx < Chords.string.length) {
                             notesToPlay = [Chords.string[idx] + transposeOffset + (stringOctaveOffset * OCTAVE_SEMITONES) - OCTAVE_SEMITONES]; // Bass is octave down
                             targetOutput = 'bass';
                        }
                    } else if (pitch === NOTE_FULL_CHORD_TRIGGER && Chords.string.length) {
                        notesToPlay = Chords.string.map(n => n + transposeOffset + (fullChordOctaveOffset * OCTAVE_SEMITONES));
                        targetOutput = 'chord';
                    } else if (pitch === NOTE_FULL_STRING_TRIGGER && Chords.string.length) {
                        notesToPlay = Chords.string.map(n => n + transposeOffset + (stringOctaveOffset * OCTAVE_SEMITONES));
                        targetOutput = 'string';
                    }

                    if (targetOutput && notesToPlay.length > 0) {
                        Chords.triggers[triggerKey] = notesToPlay; // Store raw pitches
                        sendChord(notesToPlay, value, MIDI_CHANNEL_MAIN, targetOutput); // sendChord takes array of pitches or objects
                        return;
                    }
                } // End channel === MIDI_CHANNEL_MAIN for Note ON

                // Pad handling (Note ON) - CH_DRUMS or mapped CH_MAIN keys
                if (channel === MIDI_CHANNEL_DRUMS || (channel === MIDI_CHANNEL_MAIN && PAD_MAP_1[pitch])) {
                    const padNumber = channel === MIDI_CHANNEL_DRUMS ? pitch : PAD_MAP_1[pitch];
                    const padData = Chords.pads[padNumber];
                    if (!padData || !padData.chord || padData.chord.length === 0) {
                        showNotification(`Pad ${padNumber} empty`, 'warning'); return;
                    }

                    Chords.string = [...(padData.bass || []), ...padData.chord]; // Load chord into string
                    if (isRecordingSequence) { // If somehow in sequence recording (e.g. mode changed without full reset)
                        pendingSequenceChord = [...Chords.string]; // This interaction might need review depending on desired flow
                    }
                    if (isPadTriggerMode) {
                        const transposedChord = Chords.string.map(n => n + transposeOffset + (fullChordOctaveOffset * OCTAVE_SEMITONES));
                        const notesToPlayObjects = transposedChord.map(p => ({ pitch: p, velocity: value }));
                        Chords.triggers[padNumber] = notesToPlayObjects.map(n => n.pitch);
                        sendChord(notesToPlayObjects.map(n => n.pitch), value, MIDI_CHANNEL_MAIN, 'chord');
                    }
                    updateStatus(); 
                    showNotification(`Loaded pad ${padNumber}${isPadTriggerMode ? ' (triggered)' : ''}`, 'info');
                    return;
                }
                // If Note ON in PLAY mode is not handled by specific logic, it's currently dropped.
                // To passthrough unhandled notes: send(ev.data, 'main');
                return;

            // --- Note OFF specific logic for PLAY mode ---
            } else if (type === MIDI_NOTE_OFF || (type === MIDI_NOTE_ON && value === 0)) { // Note OFF or Note ON with velocity 0
                flashActivity('input'); updateKeyboard(pitch, false, 'main');

                if (channel === MIDI_CHANNEL_MAIN) {
                    // Transpose keys Note OFF
                    if (pitch >= MIDI_NOTE_C3 && pitch <= MIDI_NOTE_B3) {
                        if (isPadTriggerMode && Chords.triggers[pitch] && !isSequenceMode) {
                            sendNoteOffs(Chords.triggers[pitch], MIDI_CHANNEL_MAIN, 'chord');
                            delete Chords.triggers[pitch];
                        }
                        // Falls through to general passthrough
                    }

                    // String/Bass/Full Chord Triggers Note OFF
                    let targetOutput = null;
                    if (STRING_TRIGGER_NOTES.includes(pitch)) targetOutput = 'string';
                    else if (BASS_TRIGGER_NOTES.includes(pitch)) targetOutput = 'bass';
                    else if (pitch === NOTE_FULL_CHORD_TRIGGER) targetOutput = 'chord';
                    else if (pitch === NOTE_FULL_STRING_TRIGGER) targetOutput = 'string';

                    if (targetOutput && Chords.triggers[pitch]) {
                        sendNoteOffs(Chords.triggers[pitch], MIDI_CHANNEL_MAIN, targetOutput);
                        delete Chords.triggers[pitch];
                        // Falls through to general passthrough
                    }
                } // End channel === MIDI_CHANNEL_MAIN for Note OFF

                // Pad handling (Note OFF) - CH_DRUMS or mapped CH_MAIN keys
                if (channel === MIDI_CHANNEL_DRUMS || (channel === MIDI_CHANNEL_MAIN && PAD_MAP_1[pitch])) {
                    const padNumber = channel === MIDI_CHANNEL_DRUMS ? pitch : PAD_MAP_1[pitch];
                    if (isPadTriggerMode && Chords.triggers[padNumber]) {
                        sendNoteOffs(Chords.triggers[padNumber], MIDI_CHANNEL_MAIN, 'chord'); // Assuming 'chord' output for pads
                        delete Chords.triggers[padNumber];
                    }
                    // Falls through to general passthrough
                }
                
                send(ev.data, 'main'); // General passthrough for ALL Note OFF messages in PLAY mode
                return;
            }
            // Other message types in PLAY mode (like unhandled CCs) are dropped if not handled by ButtonManager or specific handlers earlier.
        }

    } catch (error) {
        showNotification('MIDI processing error: ' + error.message, 'error');
        console.error("MIDI Processing Error: ", error);
    }
}

function send(data, outputType = 'main') {
    const output = currentOutputs[outputType];
    if (!output) return;
    if (outputType === 'main' && mode === MODE_PLAY && isMainOutputMuted) return; 
    
    try {
        // Ensure Note OFF uses velocity 0 for broader compatibility, though data[2] should already be 0 for true Note OFF.
        const statusByte = data[0] & 0xF0;
        if (statusByte === MIDI_NOTE_OFF) data[2] = VELOCITY_NOTE_OFF;
        if (statusByte === MIDI_NOTE_ON && data[2] === 0) { /* This is a Note OFF too */ }

        output.send(data);
        flashActivity(`${outputType}-output`); // e.g. main-output, chord-output
        
        const [status, pitch, velocity] = data; // Re-destructure after potential modification
        const type = status & 0xF0;
        if (type === MIDI_NOTE_ON || type === MIDI_NOTE_OFF) {
            updateKeyboard(pitch, type === MIDI_NOTE_ON && velocity > 0, outputType);
        }
    } catch (error) {
        showNotification(`MIDI ${outputType} out err: ${error.message.substring(0,30)}`, 'warning');
        console.error(`Error sending MIDI to ${outputType}:`, error, data);
    }
}

function sendChord(notes, vel, ch, outputType = 'chord') {
    const notesArray = Array.isArray(notes) ? notes : [notes];
    if (notesArray.length === 0) return;

    if (outputType === 'chord') {
        clearAllChordNotes(); // Clear previous chord notes from 'chord' output

        const notesWithVelocity = notesArray.map(noteOrObj => 
            (typeof noteOrObj === 'object' && 'pitch' in noteOrObj) ? noteOrObj : { pitch: noteOrObj, velocity: vel }
        );
        
        let processedNotes = notesWithVelocity;
        if (currentInversion > 0) {
            const invertedPitches = invertChord(notesWithVelocity.map(n => n.pitch), currentInversion);
            // Re-associate velocities (or default if structure changed unexpectedly)
            processedNotes = invertedPitches.map((p, index) => ({ 
                pitch: p, 
                velocity: notesWithVelocity[index]?.velocity || vel 
            }));
        }
        
        const tiltedNotes = applyVelocityTilt(processedNotes, 0); // Apply current tilt, 0 means don't change tiltAmount

        tiltedNotes.forEach(note => {
            send([MIDI_NOTE_ON | ((ch - 1) & 0x0F), note.pitch, note.velocity], outputType);
        });
        currentPlayingChordNotes = tiltedNotes.map(n => n.pitch); // Track notes sent to chord output
    } else { // For 'string', 'bass' outputs (no inversion/tilt applied here by default)
        notesArray.forEach(noteOrObj => {
            const pitch = (typeof noteOrObj === 'object' && 'pitch' in noteOrObj) ? noteOrObj.pitch : noteOrObj;
            const velocity = (typeof noteOrObj === 'object' && 'velocity' in noteOrObj) ? noteOrObj.velocity : vel;
            send([MIDI_NOTE_ON | ((ch - 1) & 0x0F), pitch, velocity], outputType);
        });
    }
}

function sendNoteOffs(notes, ch, outputType = 'chord') {
    const notesArray = Array.isArray(notes) ? notes : [notes];
    if (!notesArray.length) return;

    if (outputType === 'chord') {
        // For chord output, clear all notes that were part of the last chord sent on this output
        currentPlayingChordNotes.forEach(notePitch => {
            send([MIDI_NOTE_OFF | ((ch - 1) & 0x0F), notePitch, VELOCITY_NOTE_OFF], outputType);
        });
        currentPlayingChordNotes = []; // Clear tracker
    } else {
        // For other outputs (string, bass), send note-offs for the specific notes provided
        notesArray.forEach(noteOrObj => {
            const pitch = (typeof noteOrObj === 'object' && 'pitch' in noteOrObj) ? noteOrObj.pitch : noteOrObj;
            send([MIDI_NOTE_OFF | ((ch - 1) & 0x0F), pitch, VELOCITY_NOTE_OFF], outputType);
        });
    }
}

function updateKeyboard(note, isNoteOn, outputType = 'main') { // outputType can be 'main', 'chord', 'bass', 'string'
    const pianoId = `${outputType}-piano`; 
    const keyElement = pianoKeyElements[pianoId]?.[note];
    if (keyElement) {
        if (isNoteOn) keyElement.classList.add('active');
        else keyElement.classList.remove('active');
    }
}

const pianoKeyElements = {}; // Stores references to SVG key elements: pianoKeyElements[pianoId][noteNumber]
function createPianoKeyboard() {
    const whiteKeyBorderOffset = SVG_KEY_STROKE_WIDTH; // For crisp borders
    
    ['current-piano', 'main-piano', 'bass-piano', 'chord-piano', 'string-piano'].forEach(pianoId => {
        const pianoContainer = document.getElementById(pianoId);
        if (!pianoContainer) { console.warn(`Piano container ${pianoId} not found`); return; }

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const totalWhiteKeys = countWhiteKeys(PIANO_START_NOTE, PIANO_END_NOTE);
        svg.setAttribute('width', totalWhiteKeys * WHITE_KEY_WIDTH + (2 * whiteKeyBorderOffset));
        svg.setAttribute('height', WHITE_KEY_HEIGHT + (2 * whiteKeyBorderOffset));
        pianoKeyElements[pianoId] = {};
        
        const whiteKeysGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const blackKeysGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        let whiteKeyIndex = 0;

        for (let note = PIANO_START_NOTE; note <= PIANO_END_NOTE; note++) {
            const noteName = getNoteNameFromMIDI(note); 
            const isBlackKey = noteName.includes('#');
            
            const keyRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            keyRect.dataset.note = note;
            keyRect.setAttribute('tabindex', '0'); // Make each key focusable
            keyRect.setAttribute('role', 'button'); // Accessibility
            keyRect.setAttribute('aria-label', `Piano key ${noteName}`);
            pianoKeyElements[pianoId][note] = keyRect;
            
            const keyText = document.createElementNS("http://www.w3.org/2000/svg", "text");
            keyText.setAttribute('class', 'key-text'); 
            keyText.textContent = noteName;
            keyText.style.fontSize = SVG_KEY_TEXT_FONT_SIZE;

            if (!isBlackKey) {
                keyRect.setAttribute('x', whiteKeyIndex * WHITE_KEY_WIDTH + whiteKeyBorderOffset); 
                keyRect.setAttribute('y', whiteKeyBorderOffset);
                keyRect.setAttribute('width', WHITE_KEY_WIDTH - whiteKeyBorderOffset); // Avoid overlap
                keyRect.setAttribute('height', WHITE_KEY_HEIGHT);
                keyRect.setAttribute('class', 'piano-key white');
                
                keyText.setAttribute('x', whiteKeyIndex * WHITE_KEY_WIDTH + WHITE_KEY_WIDTH/2 + whiteKeyBorderOffset);
                keyText.setAttribute('y', WHITE_KEY_HEIGHT - KEY_TEXT_Y_OFFSET + whiteKeyBorderOffset); 
                keyText.setAttribute('text-anchor', 'middle');
                whiteKeysGroup.appendChild(keyRect);
                whiteKeysGroup.appendChild(keyText);
                whiteKeyIndex++;
            } else {
                const prevWhiteKeyX = (whiteKeyIndex - 1) * WHITE_KEY_WIDTH; // X of the white key to its left
                keyRect.setAttribute('x', prevWhiteKeyX + WHITE_KEY_WIDTH - BLACK_KEY_WIDTH/2 + whiteKeyBorderOffset); 
                keyRect.setAttribute('y', whiteKeyBorderOffset);
                keyRect.setAttribute('width', BLACK_KEY_WIDTH); 
                keyRect.setAttribute('height', BLACK_KEY_HEIGHT);
                keyRect.setAttribute('class', 'piano-key black');

                keyText.setAttribute('x', prevWhiteKeyX + WHITE_KEY_WIDTH + whiteKeyBorderOffset);
                keyText.setAttribute('y', BLACK_KEY_HEIGHT - KEY_TEXT_Y_OFFSET + whiteKeyBorderOffset); 
                keyText.setAttribute('text-anchor', 'middle');
                keyText.setAttribute('fill', '#fff'); // Ensure black key text is visible
                blackKeysGroup.appendChild(keyRect); // Add black keys after white for correct layering
                blackKeysGroup.appendChild(keyText);
            }
        }
        svg.appendChild(whiteKeysGroup); 
        svg.appendChild(blackKeysGroup); // Draw black keys on top of white keys
        pianoContainer.appendChild(svg);
    });
}

// --- MIDI handling for piano keys ---
function getOutputTypeForPianoId(pianoId) {
    // Map pianoId to outputType for send()
    if (pianoId === 'main-piano') return 'main';
    if (pianoId === 'chord-piano') return 'chord';
    if (pianoId === 'bass-piano') return 'bass';
    if (pianoId === 'string-piano') return 'string';
    // 'current-piano' is display only, no output
    return null;
}

function sendPianoKeyMIDI(pianoId, note, isNoteOn) {
    const outputType = getOutputTypeForPianoId(pianoId);
    if (!outputType) return;
    const velocity = isNoteOn ? 100 : 0; // Or use a config/default
    const channel = MIDI_CHANNEL_MAIN; // Use main channel, or customize per section if needed
    const status = isNoteOn ? MIDI_NOTE_ON : MIDI_NOTE_OFF;
    send([status, note, velocity], outputType);
}

// Track state to avoid duplicate note-ons/offs
const pianoKeyState = {}; // { [pianoId_note]: { isDown: bool, timeoutId: number|null } }

// --- Keyboard navigation for piano keys ---
function initializePianoKeyboardNavigation() {
    const pianoIds = ['current-piano', 'main-piano', 'bass-piano', 'chord-piano', 'string-piano'];
    pianoIds.forEach(pianoId => {
        const pianoContainer = document.getElementById(pianoId);
        if (!pianoContainer) return;
        const svg = pianoContainer.querySelector('svg');
        if (!svg) return;
        const keys = Array.from(svg.querySelectorAll('.piano-key'));
        // Focus management
        keys.forEach((key, idx) => {
            const note = parseInt(key.dataset.note, 10);
            const keyId = `${pianoId}_${note}`;
            pianoKeyState[keyId] = { isDown: false, timeoutId: null };

            // --- Mouse/touch events ---
            const handleDown = (e) => {
                if (pianoKeyState[keyId].isDown) return;
                pianoKeyState[keyId].isDown = true;
                sendPianoKeyMIDI(pianoId, note, true);
            };
            const handleUp = (e) => {
                if (!pianoKeyState[keyId].isDown) return;
                pianoKeyState[keyId].isDown = false;
                sendPianoKeyMIDI(pianoId, note, false);
            };
            key.addEventListener('mousedown', handleDown);
            key.addEventListener('touchstart', handleDown);
            // Listen for mouseup/touchend on window to ensure note-off even if mouse leaves key
            window.addEventListener('mouseup', handleUp);
            window.addEventListener('touchend', handleUp);

            // --- Keyboard events ---
            key.addEventListener('keydown', (e) => {
                let handled = false;
                let nextIdx = idx;
                if (e.key === 'ArrowRight') {
                    nextIdx = (idx + 1) % keys.length;
                    handled = true;
                } else if (e.key === 'ArrowLeft') {
                    nextIdx = (idx - 1 + keys.length) % keys.length;
                    handled = true;
                } else if (e.key === 'Home') {
                    nextIdx = 0;
                    handled = true;
                } else if (e.key === 'End') {
                    nextIdx = keys.length - 1;
                    handled = true;
                } else if (e.key === 'Tab') {
                    // Allow tab to move out of the grid
                    return;
                } else if (e.key === 'Enter' || e.key === ' ') {
                    // Only trigger if not already down
                    if (!pianoKeyState[keyId].isDown) {
                        pianoKeyState[keyId].isDown = true;
                        sendPianoKeyMIDI(pianoId, note, true);
                        // Schedule note-off after 250ms
                        if (pianoKeyState[keyId].timeoutId) clearTimeout(pianoKeyState[keyId].timeoutId);
                        pianoKeyState[keyId].timeoutId = setTimeout(() => {
                            pianoKeyState[keyId].isDown = false;
                            sendPianoKeyMIDI(pianoId, note, false);
                        }, 250);
                    }
                    handled = true;
                }
                if (handled) {
                    e.preventDefault();
                    keys[nextIdx].focus();
                }
            });
        });
        // Optional: Focus first key on container focus
        pianoContainer.addEventListener('focus', (e) => {
            if (e.target === pianoContainer) {
                const firstKey = keys[0];
                if (firstKey) firstKey.focus();
            }
        });
        pianoContainer.setAttribute('tabindex', '-1'); // Container can be focused programmatically
        pianoContainer.setAttribute('role', 'group');
        pianoContainer.setAttribute('aria-label', `${pianoId.replace('-',' ')} keyboard`);
    });
}

function countWhiteKeys(startNote, endNote) {
    let count = 0; 
    for (let note = startNote; note <= endNote; note++) {
        if (!getNoteNameFromMIDI(note).includes('#')) count++; 
    }
    return count;
}

function getSongNameFromHash() {
    const hash = window.location.hash.substring(1); // Remove #
    return hash ? decodeURIComponent(hash.startsWith('song=') ? hash.split('=')[1] : hash) : 'default';
}

    notesLabel.style.display = 'block'; // Make label take full width
    notesLabel.style.marginBottom = '5px';

    const notesTextarea = document.createElement('textarea');
    notesTextarea.id = 'song-notes'; 
    notesTextarea.rows = 4; 
    notesTextarea.placeholder = 'Write your notes, lyrics, or ideas...';
    notesTextarea.addEventListener('input', debounceSave);
    
    controlsDiv.appendChild(notesLabel); 
    controlsDiv.appendChild(notesTextarea);
    
    const pianoSections = document.getElementById('piano-sections');
    if (pianoSections && pianoSections.parentNode) {
        pianoSections.parentNode.insertBefore(controlsDiv, pianoSections.nextSibling);
    } else { // Fallback if piano-sections isn't there for some reason
        document.body.appendChild(controlsDiv);
    }
    
    function updateSongNameDisplay() {
        const songName = getSongNameFromHash();
        const songNameDiv = document.getElementById('song-name');
        if (songNameDiv) songNameDiv.textContent = `Song: ${songName || 'default'}`;
    }
    window.addEventListener('hashchange', updateSongNameDisplay);
    updateSongNameDisplay(); // Initial call
}

function setupAutoLoadOnSongChange() {
    window.addEventListener('hashchange', () => { 
        loadChordsFromDB(); 
        // Potentially reset sequence state or other song-specific states here
        resetSequenceState();
        Chords.string = []; // Clear current loaded chord from previous song
        updateStatus();
    });
}

async function saveChordsToDB() {
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const songName = getSongNameFromHash();
        const tx = db.transaction(STORE_NAME_SONGS, 'readwrite');
        const store = tx.objectStore(STORE_NAME_SONGS);
        const notesArea = document.getElementById('song-notes');
        const notes = notesArea ? notesArea.value : '';
        const data = { chords: Chords.pads, notes, sequence: Chords.sequence };
        const request = store.put(data, songName);
        
        request.onsuccess = () => {
            const saveIndicator = document.createElement('div');
            saveIndicator.className = 'save-indicator';
            saveIndicator.style.cssText = `position: fixed; bottom: 20px; left: 20px; background: rgba(76, 175, 80, 0.1); color: #4CAF50; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; opacity: 0; transition: opacity 0.3s; z-index: 1001;`;
            saveIndicator.textContent = '✓ Saved'; 
            document.body.appendChild(saveIndicator);
            requestAnimationFrame(() => { saveIndicator.style.opacity = '1'; });
            setTimeout(() => { 
                saveIndicator.style.opacity = '0'; 
                setTimeout(() => saveIndicator.remove(), 300); 
            }, SAVE_INDICATOR_DURATION);
            resolve();
        };
        request.onerror = () => { 
            showNotification('Error saving data for ' + songName, 'error'); 
            reject(request.error); 
        };
    });
}
async function loadChordsFromDB() {
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const songName = getSongNameFromHash();
        const tx = db.transaction(STORE_NAME_SONGS, 'readonly');
        const store = tx.objectStore(STORE_NAME_SONGS);
        const request = store.get(songName);
        
        request.onsuccess = () => {
            Chords.pads = {}; Chords.sequence = []; Chords.string = []; // Clear existing song data
            const notesTextarea = document.getElementById('song-notes');
            if (request.result) {
                if (request.result.chords) Object.assign(Chords.pads, request.result.chords);
                if (request.result.sequence) Chords.sequence = request.result.sequence;
                if (notesTextarea) notesTextarea.value = request.result.notes || '';
                showNotification(`Loaded: ${songName}`, 'success');
            } else {
                showNotification(`No saved data for: ${songName}. Started new song.`, 'info');
                if (notesTextarea) notesTextarea.value = ''; // Clear notes for new song
            }
            resetSequenceState(); // Reset sequence player/recorder state
            updateStatus();       // Update UI reflecting loaded/cleared data
            resolve(request.result);
        };
        request.onerror = () => { 
            showNotification('Error loading data for ' + songName, 'error'); 
            reject(request.error); 
        };
    });
}

function loadChordFromSequence(index) {
    if (index < 0 || index >= Chords.sequence.length) {
        showNotification(`Invalid sequence step: ${index + 1}`, 'warning');
        return;
    }
    const step = Chords.sequence[index];
    let loadedSuccessfully = false;

    if (step !== undefined) { // Check if step exists
        if (Array.isArray(step)) { // Step is an array of notes
            Chords.string = [...step];
            loadedSuccessfully = true;
        } else if (Chords.pads[step] && Chords.pads[step].chord) { // Step is a pad number
            const pad = Chords.pads[step];
            Chords.string = [...(pad.bass || []), ...pad.chord];
            loadedSuccessfully = true;
        } else {
             showNotification(`Sequence step ${index + 1} (Pad ${step}) is empty or invalid.`, 'warning');
             Chords.string = []; // Clear current string if step is invalid
        }
        
        updateStatus(); // Update current chord display, piano, etc.
        // updateSequenceDisplay(); // updateStatus calls this already
        
        if (loadedSuccessfully) {
            showNotification(`Loaded step ${index + 1}/${Chords.sequence.length}`, 'info');
            if (isPadTriggerMode) { // If in chord trigger mode, also play the loaded chord
                const chordNotes = Chords.string.map(n => ({ pitch: n + transposeOffset + (fullChordOctaveOffset * OCTAVE_SEMITONES), velocity: DEFAULT_TRIGGER_VELOCITY }));
                const tiltedNotes = applyVelocityTilt(chordNotes, 0);
                Chords.triggers[NOTE_FULL_CHORD_TRIGGER] = tiltedNotes.map(n => n.pitch); // Use a consistent trigger key or manage differently
                sendChord(tiltedNotes.map(n => n.pitch), tiltedNotes[0]?.velocity || DEFAULT_TRIGGER_VELOCITY, MIDI_CHANNEL_MAIN, 'chord');
            }
        }
    } else {
        showNotification(`Sequence step ${index + 1} is undefined.`, 'warning');
        Chords.string = [];
        updateStatus();
    }
}

function clearAllChordNotes() {
    if (currentOutputs.chord && currentPlayingChordNotes.length > 0) {
        currentPlayingChordNotes.forEach(notePitch => {
            send([MIDI_NOTE_OFF | ((MIDI_CHANNEL_MAIN - 1) & 0x0F), notePitch, VELOCITY_NOTE_OFF], 'chord');
        });
        currentPlayingChordNotes = [];
    }
}
function getMaxInversion() {
    // Base inversion on the currently "active" chord concept: Chords.string if loaded, else Chords.record
    const currentChordBase = (mode === MODE_PLAY && Chords.string.length > 0) ? Chords.string : Chords.record;
    return Math.max(0, currentChordBase.length - 1);
}

// Add sequence display functions
function updateSequenceDisplay() {
    const display = document.getElementById('sequence-display');
    const modeIndicator = document.getElementById('sequence-mode-indicator');
    const stepIndicator = document.getElementById('current-step-indicator');
    
    if (!display || !modeIndicator || !stepIndicator) return;
    
    display.innerHTML = Chords.sequence.map((step, index) => {
        let chordNameText;
        let stepNotes = [];
        if (Array.isArray(step)) {
            stepNotes = step;
        } else if (Chords.pads[step] && Chords.pads[step].chord) {
            stepNotes = Chords.pads[step].chord;
        }
        
        if (stepNotes.length > 0) {
            chordNameText = detectChord(stepNotes.map(n => getNoteNameFromMIDI(n))) || 'Chord';
        } else {
            chordNameText = `Pad ${step}` || 'Empty Step';
        }
        return `<div class="sequence-step ${index === Chords.sequenceIndex && isSequenceMode ? 'active' : ''}">
            ${index + 1}: ${chordNameText}
        </div>`;
    }).join('');
    
    modeIndicator.textContent = isRecordingSequence ? 'REC Sequence' : (isSequenceMode ? '▶ Sequence Play' : '⏸ Sequence Idle');
    if (Chords.sequence.length > 0) {
        stepIndicator.textContent = `Step: ${Chords.sequenceIndex + 1}/${Chords.sequence.length}`;
    } else {
        stepIndicator.textContent = 'No Sequence';
    }
}

function resetSequenceState() {
    isRecordingSequence = false;
    isSequenceMode = false;
    pendingSequenceChord = null;
    isWaitingForSequenceStepConfirmation = false;
    Chords.sequenceIndex = 0;
    // Chords.sequence = []; // Do not clear sequence data on reset, only player/recorder state
    updateSequenceDisplay();
    showNotification('Sequence player/recorder reset', 'info');
}

function enterSequenceMode() {
    if (Chords.sequence.length === 0) {
        showNotification('No sequence to play', 'warning');
        return;
    }
    isSequenceMode = true;
    isRecordingSequence = false; // Ensure not in recording mode
    Chords.sequenceIndex = 0;
    loadChordFromSequence(0); // Loads and updates display via updateStatus
    showNotification('Sequence mode active. Use Prev/Next.', 'info');
}

function exitSequenceMode() {
    isSequenceMode = false;
    // Chords.sequenceIndex = 0; // Keep index or reset, depends on desired behavior
    updateSequenceDisplay();
    showNotification('Exited sequence mode', 'info');
    // Optionally clear Chords.string or send note offs for the last played sequence chord
    // clearAllChordNotes(); // If exiting sequence mode should stop sound
    // Chords.string = []; updateStatus();
}

// This is the more complete version of updateStatus
function updateStatus() {
    const modeDisplayEl = document.getElementById("mode"); 
    if (modeDisplayEl) {
       modeDisplayEl.textContent = mode === MODE_STOP ? "STOP" : mode === MODE_RECORD ? "RECORD" : "PLAY";
    } else {
       console.warn("updateStatus: modeDisplay element not found!");
    }
    
    if (mode === MODE_STOP) {
        clearAllChordNotes(); // Stop any sounding chord notes
        if (isSequenceMode) exitSequenceMode(); // Exit sequence mode on stop
    }
    
    // Determine which chord to display as "current"
    const currentChordForDisplay = (mode === MODE_RECORD) ? Chords.record : Chords.string;
    const chordNotesText = currentChordForDisplay.length > 0 
        ? currentChordForDisplay.map(note => getNoteNameFromMIDI(note)).join(' ')
        : 'No Chord';
    
    const chordDisplayEl = document.getElementById('currentChord');
    if (chordDisplayEl) chordDisplayEl.textContent = chordNotesText;
    
    const chordNameElement = document.getElementById('chordName');
    if (chordNameElement) {
        if (currentChordForDisplay.length > 0) {
            const chordName = detectChord(currentChordForDisplay.map(note => getNoteNameFromMIDI(note)));
            chordNameElement.textContent = chordName || 'Unknown Chord';
        } else {
            chordNameElement.textContent = '-';
        }
    }

    // Update the "current-piano" display
    const currentPianoContainer = document.getElementById('current-piano');
    if (currentPianoContainer) {
        const pianoKeys = currentPianoContainer.querySelectorAll('.piano-key');
        pianoKeys.forEach(key => key.classList.remove('active')); // Clear all first
        currentChordForDisplay.forEach(note => {
            const key = currentPianoContainer.querySelector(`.piano-key[data-note="${note}"]`);
            if (key) key.classList.add('active');
        });
    }
    
    updateInversionDisplay(); // Update inversion display based on current chord context
    updateTiltDisplay();      // Update tilt display
    updateSequenceDisplay();  // Update sequence UI
    
    debounceSave(); // Save any changes to song data (pads, sequence, notes)
}


// ————— Kick things off (Revised Order) —————
document.addEventListener('DOMContentLoaded', () => {
    createPianoSections();
    createPianoKeyboard();
    addSongControls();
    initializePianoKeyboardNavigation(); // <-- Add keyboard navigation for piano keys

    updateStatus(); // Initial UI state before MIDI/DB

    if (navigator.requestMIDIAccess) {
        navigator.requestMIDIAccess({ sysex: false }) // sysex: false is often a good default
            .then(onMIDISuccess, () => {
                showNotification('Failed to get MIDI access. Check browser permissions.', 'error', 5000);
                alert("Failed to get MIDI access. Please ensure you are using a compatible browser (like Chrome or Edge) and have granted MIDI permissions.");
            });
    } else {
        showNotification('Web MIDI API not supported. Use Chrome or Edge.', 'error', 5000);
        alert("Web MIDI API not supported in this browser. Please use Chrome or Edge.");
    }

    initDB().then(() => {
        setupAutoLoadOnSongChange();
        loadChordsFromDB(); // Initial load, which will also call updateStatus
    }).catch(error => {
        console.error('Failed to initialize IndexedDB:', error);
        showNotification('Failed to initialize storage system. Saved data may not be available.', 'error');
    });
});
