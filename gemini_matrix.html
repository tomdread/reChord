<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reChord37.com Matrix (Reviewed)</title>
    <style>
        :root {
            --cell-padding: 8px;
            --header-bg: #f2f2f2;
            --row-hover: #f5f5f5;
            --highlight: #d1ffd1;
            --border: #ddd;
            --radius: 4px;
            --loopback-bg: #ffe6e6;
        }
        body {
            background: #f9f9f9;
            font-family: 'Courier New', Courier, monospace;
            color: #222;
            margin: 0;
        }
        #main {
            padding: 20px;
        }
        .port-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .port-list {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.08);
        }
        .port-list h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
        }
        ul {
            list-style: none;
            padding: 0;
            max-height: 150px;
            overflow-y: auto;
            width: 240px;
            border: 1px solid var(--border);
            margin: 0;
        }
        ul li {
            margin: 4px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 4px; /* Added for better hover indication */
        }
        ul li:hover {
            background: var(--row-hover);
        }
        .midi-activity {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            transition: background-color 0.1s;
        }
        .midi-activity.active {
            background: #4CAF50;
            box-shadow: 0 0 4px rgba(76,175,80,0.8);
        }
        .routing-table {
            border-collapse: collapse;
            width: 100%;
            background: white;
            border-radius: var(--radius);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.08);
            overflow: hidden; /* To respect border-radius on table */
        }
        .routing-table th,
        .routing-table td {
            border: 1px solid var(--border);
            padding: var(--cell-padding);
            text-align: center;
            min-width: 120px; /* Give header cells some minimum width */
        }
        .routing-table th:first-child, /* Output name column */
        .routing-table td:first-child {
             text-align: left;
             min-width: 150px;
        }
        .routing-table th {
            background: var(--header-bg);
            font-weight: bold;
            position: sticky; /* Keep headers visible on scroll if table is wide */
            top: 0;
            z-index: 1;
        }
        .routing-table tr:hover td {
            background: var(--row-hover);
        }
        .routing-table td.highlight { /* This is for active routing, not saved state */
            background: var(--highlight) !important;
        }
        .connection-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #notification-area {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .notification {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            margin: 8px;
            border-radius: 4px;
            opacity: 1;
            transition: opacity 0.5s;
        }
        .notification.success { border-left: 4px solid #4CAF50; }
        .notification.info { border-left: 4px solid #2196F3; }
        .notification.warning { border-left: 4px solid #FFC107; }
        .notification.error { border-left: 4px solid #f44336; }
        .loopback-cell {
            background: var(--loopback-bg) !important;
            opacity: 0.7;
            border: 1px dashed #f44336; /* Make loopback border more distinct */
        }
    </style>
</head>

<body>
    <div id="main">
        <h1>rechord37.com Matrix</h1>
        <p>Actual Intelagence</p>
        <section class="port-selection">
            <div class="port-list">
                <h3>MIDI Inputs</h3>
                <ul id="midiInputsList" role="listbox" aria-label="MIDI Input Devices"></ul>
            </div>
            <div class="port-list">
                <h3>MIDI Outputs</h3>
                <ul id="midiOutputsList" role="listbox" aria-label="MIDI Output Devices"></ul>
            </div>
        </section>
        <div style="overflow-x:auto;"> <!-- Wrapper for horizontal scroll -->
            <table id="midiMatrix" class="routing-table">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="notification-area"></div>

    <script>
        const CONFIG = {
            DEBOUNCE_DELAY: 250, // Slightly increased for less frequent saves
            ACTIVITY_TIMEOUT: 100,
            HIGHLIGHT_DURATION: 150, // Slightly shorter highlight
            NOTIFICATION_DURATION: 3000,
            STORAGE: {
                INPUTS: 'matrixSelectedMidiInputIds_v1', // Added versioning/prefix
                OUTPUTS: 'matrixSelectedMidiOutputIds_v1',
                CONNECTIONS: 'matrixMidiConnections_v1'
            },
            PORT_FILTER: 'network' // e.g., 'rtp', 'network', or specific device name part to exclude
        };

        let midiAccessGlobal = null;
        let allMidiInputs = [], allMidiOutputs = [];
        let midiInputsById = {}, midiOutputsById = {};
        let activityTimers = new Map(), debounceTimer = null;

        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess({ sysex: true }) // sysex: true is good practice if ever needed
                .then(initMidi)
                .catch(err => {
                    console.error("MIDI Access Failed:", err);
                    showNotification('Failed to access MIDI devices. Please ensure permissions are granted.', 'error');
                });
        } else {
            showNotification('Web MIDI API is not supported in this browser. Please use Chrome or Edge.', 'error');
        }

        function initMidi(midiAccess) {
            midiAccessGlobal = midiAccess;
            midiAccessGlobal.onstatechange = onStateChange; // Handle device connection/disconnection
            
            clearCorruptedStorage(); // Good to have
            
            // Initial setup sequence
            refreshPortListsAndUI();
            showNotification('MIDI system initialized.', 'success');
        }

        function onStateChange(event) {
            showNotification(`MIDI device state changed: ${event.port.name} (${event.port.state})`, 'info');
            refreshPortListsAndUI();
        }
        
        // Combined function to refresh data and update all relevant UI parts
        function refreshPortListsAndUI() {
            refreshPortData();
            populatePortSelectionLists();
            restorePortSelectionsFromStorage(); // This checks/unchecks list items
            buildRoutingMatrixUI(); // This builds matrix based on checked list items
            setupMidiInputListeners(); // Attaches listeners to selected inputs
            loadConnectionsFromStorage(); // This checks checkboxes within the matrix
        }


        function refreshPortData() {
            const filterText = (CONFIG.PORT_FILTER || "").trim().toLowerCase();

            allMidiInputs = Array.from(midiAccessGlobal.inputs.values())
                .filter(i => filterText ? !i.name.toLowerCase().includes(filterText) : true);
            allMidiOutputs = Array.from(midiAccessGlobal.outputs.values())
                .filter(o => filterText ? !o.name.toLowerCase().includes(filterText) : true);
            
            midiInputsById = Object.fromEntries(allMidiInputs.map(i => [i.id, i]));
            midiOutputsById = Object.fromEntries(allMidiOutputs.map(o => [o.id, o]));
        }

        function clearCorruptedStorage() {
            try {
                const data = localStorage.getItem(CONFIG.STORAGE.CONNECTIONS);
                if (data) {
                    const parsed = JSON.parse(data);
                    // Basic check: is it an array? More specific checks could be added.
                    if (!Array.isArray(parsed)) {
                        localStorage.removeItem(CONFIG.STORAGE.CONNECTIONS);
                        showNotification('Cleared potentially corrupted connection storage.', 'warning');
                    }
                }
            } catch (e) { // If JSON.parse fails
                localStorage.removeItem(CONFIG.STORAGE.CONNECTIONS);
                showNotification('Cleared corrupted connection storage.', 'warning');
            }
        }

        function populatePortSelectionLists() {
            const inputsListUI = document.getElementById('midiInputsList');
            const outputsListUI = document.getElementById('midiOutputsList');
            inputsListUI.innerHTML = '';
            outputsListUI.innerHTML = '';

            allMidiInputs.forEach(inputPort => {
                const li = document.createElement('li');
                li.setAttribute('role', 'option'); // Accessibility
                const checkbox = document.createElement('input');
                const activityIndicator = document.createElement('span');
                const label = document.createElement('label');
                
                checkbox.type = 'checkbox';
                checkbox.id = `in_sel_${inputPort.id}`; // Unique ID for label linking
                checkbox.value = inputPort.id;
                
                activityIndicator.className = 'midi-activity';
                activityIndicator.id = `act_in_${inputPort.id}`;
                
                label.htmlFor = checkbox.id;
                label.textContent = inputPort.name;
                
                checkbox.addEventListener('change', () => {
                    li.setAttribute('aria-selected', checkbox.checked.toString()); // Update aria state
                    handlePortSelectionChange();
                });
                
                li.append(checkbox, activityIndicator, label);
                inputsListUI.append(li);
            });

            allMidiOutputs.forEach(outputPort => {
                const li = document.createElement('li');
                li.setAttribute('role', 'option');
                const checkbox = document.createElement('input');
                const activityIndicator = document.createElement('span');
                const label = document.createElement('label');

                checkbox.type = 'checkbox';
                checkbox.id = `out_sel_${outputPort.id}`;
                checkbox.value = outputPort.id;

                activityIndicator.className = 'midi-activity';
                activityIndicator.id = `act_out_${outputPort.id}`;
                
                label.htmlFor = checkbox.id;
                label.textContent = outputPort.name;
                
                checkbox.addEventListener('change', () => {
                    li.setAttribute('aria-selected', checkbox.checked.toString());
                    handlePortSelectionChange();
                });

                li.append(checkbox, activityIndicator, label);
                outputsListUI.append(li);
            });
        }

        function restorePortSelectionsFromStorage() {
            const selectedInputIds = JSON.parse(localStorage.getItem(CONFIG.STORAGE.INPUTS) || 'null');
            const selectedOutputIds = JSON.parse(localStorage.getItem(CONFIG.STORAGE.OUTPUTS) || 'null');
            const inputsListUI = document.getElementById('midiInputsList');
            const outputsListUI = document.getElementById('midiOutputsList');

            if (Array.isArray(selectedInputIds)) {
                inputsListUI.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = selectedInputIds.includes(cb.value);
                    cb.closest('li').setAttribute('aria-selected', cb.checked.toString());
                });
            } else {
                selectAllPortsInList(inputsListUI); // Default to all selected if no storage
            }

            if (Array.isArray(selectedOutputIds)) {
                outputsListUI.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                    cb.checked = selectedOutputIds.includes(cb.value);
                    cb.closest('li').setAttribute('aria-selected', cb.checked.toString());
                });
            } else {
                selectAllPortsInList(outputsListUI);
            }
        }

        function selectAllPortsInList(listContainerElement) {
            listContainerElement.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.checked = true;
                cb.closest('li').setAttribute('aria-selected', 'true');
            });
        }

        function handlePortSelectionChange() {
            // Save current port selections
            const inputsListUI = document.getElementById('midiInputsList');
            const outputsListUI = document.getElementById('midiOutputsList');
            const selectedInputIds = Array.from(inputsListUI.querySelectorAll('input:checked')).map(cb => cb.value);
            const selectedOutputIds = Array.from(outputsListUI.querySelectorAll('input:checked')).map(cb => cb.value);
            localStorage.setItem(CONFIG.STORAGE.INPUTS, JSON.stringify(selectedInputIds));
            localStorage.setItem(CONFIG.STORAGE.OUTPUTS, JSON.stringify(selectedOutputIds));

            // Rebuild matrix and connections based on new selections
            buildRoutingMatrixUI();
            setupMidiInputListeners();
            loadConnectionsFromStorage(); // Reload connections for the new matrix
        }

        function buildRoutingMatrixUI() {
            // Detach old listeners
            allMidiInputs.forEach(input => { if (input) input.onmidimessage = null; });

            const selectedInputIds = Array.from(document.querySelectorAll('#midiInputsList input:checked')).map(cb => cb.value);
            const selectedOutputIds = Array.from(document.querySelectorAll('#midiOutputsList input:checked')).map(cb => cb.value);
            
            const table = document.getElementById('midiMatrix');
            const thead = table.querySelector('thead');
            const tbody = table.querySelector('tbody');
            thead.innerHTML = '';
            tbody.innerHTML = '';

            const headerRow = document.createElement('tr');
            headerRow.appendChild(document.createElement('th')); // Empty top-left cell
            selectedInputIds.forEach(inputId => {
                const inputPort = midiInputsById[inputId];
                if (inputPort) {
                    const th = document.createElement('th');
                    th.textContent = inputPort.name;
                    headerRow.append(th);
                }
            });
            thead.append(headerRow);

            selectedOutputIds.forEach(outputId => {
                const outputPort = midiOutputsById[outputId];
                if (outputPort) {
                    const tr = document.createElement('tr');
                    const th = document.createElement('th'); // Output name cell
                    th.textContent = outputPort.name;
                    tr.append(th);

                    selectedInputIds.forEach(inputId => {
                        const inputPort = midiInputsById[inputId];
                        if (inputPort) {
                            const td = document.createElement('td');
                            const checkbox = document.createElement('input');
                            checkbox.type = 'checkbox';
                            checkbox.className = 'connection-checkbox';
                            checkbox.dataset.in = inputId;
                            checkbox.dataset.out = outputId;
                            
                            // Check for loopback
                            if (inputPort.name === outputPort.name) { // Simple name check for loopback
                                td.classList.add('loopback-cell');
                                td.title = 'Loopback routing is disabled.';
                                checkbox.disabled = true;
                            }
                            
                            checkbox.addEventListener('change', saveConnectionsWithDebounce);
                            td.append(checkbox);
                            tr.append(td);
                        }
                    });
                    tbody.append(tr);
                }
            });
        }

        function setupMidiInputListeners() {
            const selectedInputIds = Array.from(document.querySelectorAll('#midiInputsList input:checked')).map(cb => cb.value);
            selectedInputIds.forEach(inputId => {
                const inputPort = midiInputsById[inputId];
                if (inputPort) {
                    inputPort.onmidimessage = event => handleMidiMessage(event, inputId);
                }
            });
        }

        function handleMidiMessage(event, inputPortId) {
            const midiData = event.data;
            flashActivityIndicator(inputPortId, 'in');
            
            document.querySelectorAll('#midiMatrix input.connection-checkbox:checked').forEach(connectionCheckbox => {
                if (connectionCheckbox.dataset.in === inputPortId) {
                    const outputPortId = connectionCheckbox.dataset.out;
                    const outputPort = midiOutputsById[outputPortId];
                    if (outputPort) {
                        try {
                            outputPort.send(midiData);
                            flashActivityIndicator(outputPortId, 'out');
                            const cell = connectionCheckbox.closest('td');
                            if (cell) { // Cell might not exist if matrix is rebuilding
                                cell.classList.add('highlight');
                                setTimeout(() => cell.classList.remove('highlight'), CONFIG.HIGHLIGHT_DURATION);
                            }
                        } catch (e) {
                            console.error(`Failed to send MIDI to ${outputPort.name}:`, e);
                            showNotification(`Error sending to ${outputPort.name}`, 'error');
                        }
                    }
                }
            });
        }
        
        function saveConnectionsWithDebounce() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(saveConnectionsToStorage, CONFIG.DEBOUNCE_DELAY);
        }

        function saveConnectionsToStorage() {
            const connections = [];
            document.querySelectorAll('#midiMatrix input.connection-checkbox:checked').forEach(cb => {
                // Only save non-disabled (non-loopback) connections
                if (!cb.disabled) {
                    connections.push({ in: cb.dataset.in, out: cb.dataset.out });
                }
            });
            localStorage.setItem(CONFIG.STORAGE.CONNECTIONS, JSON.stringify(connections));
            showNotification('Connections saved.', 'success');
        }


        function loadConnectionsFromStorage() {
            const savedConnections = JSON.parse(localStorage.getItem(CONFIG.STORAGE.CONNECTIONS) || '[]');
            // Uncheck all matrix checkboxes first
            document.querySelectorAll('#midiMatrix input.connection-checkbox').forEach(cb => cb.checked = false);
            
            savedConnections.forEach(conn => {
                const selector = `#midiMatrix input.connection-checkbox[data-in="${conn.in}"][data-out="${conn.out}"]`;
                const checkbox = document.querySelector(selector);
                if (checkbox && !checkbox.disabled) { // Ensure checkbox exists and is not a disabled loopback
                    checkbox.checked = true;
                    // FIX: Do not highlight on load. Highlight is for live activity.
                    // checkbox.closest('td').classList.add('highlight'); 
                }
            });
            // showNotification('Connections loaded.', 'info'); // Can be a bit noisy on every refresh
        }

        function showNotification(message, type = 'info') {
            const notificationArea = document.getElementById('notification-area');
            const notificationElement = document.createElement('div');
            notificationElement.className = `notification ${type}`;
            notificationElement.textContent = message;
            notificationArea.append(notificationElement);
            setTimeout(() => { 
                notificationElement.style.opacity = '0'; 
                setTimeout(() => notificationElement.remove(), 500); 
            }, CONFIG.NOTIFICATION_DURATION);
        }

        function flashActivityIndicator(portId, directionPrefix) { // 'in' or 'out'
            const indicatorElement = document.getElementById(`act_${directionPrefix}_${portId}`);
            if (!indicatorElement) return;
            
            if (activityTimers.has(indicatorElement)) clearTimeout(activityTimers.get(indicatorElement));
            
            indicatorElement.classList.add('active');
            const timerId = setTimeout(() => {
                indicatorElement.classList.remove('active');
                activityTimers.delete(indicatorElement);
            }, CONFIG.ACTIVITY_TIMEOUT);
            activityTimers.set(indicatorElement, timerId);
        }
    </script>
</body>

</html>
