<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switch Combinations Viewer</title>
<!--
  Switch Combinations Viewer
  - Visualizes all 8-switch (4x4) binary patterns as cards in a 16x16 grid.
  - Each card shows a pattern and its decimal value.
  - Tweak visual layout in the CARD_CONFIG object in the script below.
  - Accessibility and keyboard navigation supported.
-->
<style>
  :root {
    --card-width: 28px;
    --card-padding: 2px;
    --card-radius: 3px;
    --card-font-size: 0.44rem;
    --grid-cell-size: 4px;
    --grid-cell-radius: 1px;
    --grid-gap: 0.5px;
    --grid-cols: 16;
    --grid-gap-outer: 2px;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: sans-serif;
    background: #f9f9f9;
    color: #222;
    line-height: 1.4;
  }
  #main {
    padding: 20px;
    box-sizing: border-box;
  }
  .grid-wrap {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    grid-template-rows: repeat(16, 1fr);
    gap: 0;
    width: min(90vw, 90vh);
    height: min(90vw, 90vh);
    margin: 0 auto;
    padding: 0;
    box-sizing: border-box;
  }
  .combo {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    background: white;
    border: 1px solid #ccc;
    border-radius: var(--card-radius);
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    text-align: center;
    box-shadow: 1px 1px 2px rgba(0,0,0,0.08);
    transition: all 0.2s;
    font-size: var(--card-font-size);
    margin: 0;
    box-sizing: border-box;
    padding: 0;
    outline: none;
    cursor: pointer;
  }
  .combo:hover, .highlight {
    transform: scale(1.08);
    box-shadow: 0 0 6px yellow;
    border: 2px solid yellow;
  }
  .combo:focus {
    outline: 2px solid #2196f3;
    z-index: 2;
  }
  .combo-svg {
    flex: 1 1 auto;
    width: 100%;
    height: 70%;
    display: block;
    margin: 0 auto;
  }
  .combo-num {
    flex: 0 0 auto;
    width: 100%;
    text-align: center;
    font-size: 0.75rem;
    font-weight: bold;
    margin-top: 2px;
    margin-bottom: 0;
    line-height: 1.1;
    letter-spacing: 1px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, var(--grid-cell-size));
    grid-gap: var(--grid-gap);
    justify-content: center;
    margin-bottom: 3px;
  }
  .cell {
    width: var(--grid-cell-size);
    height: var(--grid-cell-size);
    border-radius: var(--grid-cell-radius);
  }
  .black { background: black; }
  .red { background: red; }
  .green { background: green; }
  .blue { background: blue; }
  .orange { background: orange; }
  .dimmed { opacity: 0.3; }
  .default-pattern {
    position: relative;
  }
  .default-pattern::before {
    content: 'Default';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    background: #666;
    color: white;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
  }
  .combo .description {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div id="main">
  <div id="full" class="grid-wrap"></div>
</div>

<script>
// === CARD & SVG LAYOUT TWEAKS ===
// Change these values to adjust card/grid/pattern sizing:
const CARD_CONFIG = {
  gridSize: 4,         // Number of switches per row/col
  cardSize: 28,        // Card width/height in px (matches --card-width)
  svgWidth: 28,        // SVG width (should match cardSize)
  svgHeight: 18,       // SVG height (area above the number)
  cellSize: 5,         // Size of each switch cell in SVG
  topPadding: 2        // <--- Increase for more space above pattern
};

// --- Constants ---
const NUM_SWITCHES = 8;
const GRID_COLS = 16;
const SWITCH_NAMES = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
const NOTE_TO_SWITCH = {
  49: 0, // A
  51: 1, // B
  54: 2, // C
  56: 3, // D
  50: 4, // E
  52: 5, // F
  53: 6, // G
  55: 7  // H
};
const DEFAULT_INPUT_NAME = "MPK mini Plus Port 1";

// --- State ---
let switchStates = Array(NUM_SWITCHES).fill(false);
let fadeTimeout = null;

// --- Grid Drawing ---
function createCombo(bin, dec, target) {
  const div = document.createElement('div');
  div.className = 'combo';
  div.dataset.pattern = bin;
  // Accessibility: add title and aria-label
  div.setAttribute('title', `Pattern ${dec.toString().padStart(3, '0')}: ${bin}`);
  div.setAttribute('aria-label', `Pattern ${dec.toString().padStart(3, '0')}: ${bin}`);
  // Keyboard navigation
  div.setAttribute('tabindex', '0');

  // Use config object for layout tweaks
  const gridSize = CARD_CONFIG.gridSize;
  const cardSize = CARD_CONFIG.cardSize;
  const svgWidth = CARD_CONFIG.svgWidth;
  const svgHeight = CARD_CONFIG.svgHeight;
  const cellSize = CARD_CONFIG.cellSize;
  const topPadding = CARD_CONFIG.topPadding;

  // Center the grid in the SVG, with extra top padding
  const gridPixelSize = cellSize * gridSize;
  const offsetX = (svgWidth - gridPixelSize) / 2;
  const offsetY = topPadding;

  // Create SVG for grid
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.classList.add('combo-svg');
  svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
  svg.setAttribute('width', svgWidth);
  svg.setAttribute('height', svgHeight);

  // Create grid cells
  bin.split('').forEach((state, idx) => {
    const row = Math.floor(idx / gridSize);
    const col = idx % gridSize;
    const cell = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    cell.setAttribute('x', offsetX + (col * cellSize));
    cell.setAttribute('y', offsetY + (row * cellSize));
    cell.setAttribute('width', cellSize - 0.5);
    cell.setAttribute('height', cellSize - 0.5);
    cell.setAttribute('rx', '1');
    cell.setAttribute('ry', '1');
    if (state === '1') {
      cell.setAttribute('fill', idx < 4 ? 'red' : 'black');
      cell.setAttribute('opacity', '1');
    } else {
      if (idx < 4) {
        cell.setAttribute('fill', 'red');
        cell.setAttribute('opacity', '0.18');
      } else {
        cell.setAttribute('fill', 'black');
        cell.setAttribute('opacity', '0.10');
      }
    }
    svg.appendChild(cell);
  });

  div.appendChild(svg);

  // Decimal value
  const info = document.createElement('div');
  info.className = 'combo-num';
  info.textContent = dec.toString().padStart(3, '0');
  div.appendChild(info);

  target.appendChild(div);
}

function generateGrids() {
  const full = document.getElementById('full');
  full.innerHTML = '';
  for (let i = 0; i < (1 << NUM_SWITCHES); i++) {
    const bin = i.toString(2).padStart(NUM_SWITCHES, '0');
    createCombo(bin, i, full);
  }
}

// --- MIDI Matching & Highlighting ---
function updatePattern() {
  const pattern = switchStates.map(s => (s ? '1' : '0')).join('');
  highlightPattern(pattern);
}

function highlightPattern(pattern) {
  if (fadeTimeout) clearTimeout(fadeTimeout);
  document.querySelectorAll('.combo').forEach(combo => {
    if (combo.dataset.pattern === pattern) {
      combo.classList.add('highlight');
    } else {
      combo.classList.remove('highlight');
    }
  });
  if (pattern === '00000000') {
    fadeTimeout = setTimeout(() => {
      document.querySelectorAll('.combo').forEach(combo => {
        combo.classList.remove('highlight');
      });
    }, 300);
  }
}

function onMIDIMessage(event) {
  const [type, note, velocity] = event.data;
  if (type === 144 && velocity > 0) {
    const idx = NOTE_TO_SWITCH[note];
    if (idx !== undefined) {
      switchStates[idx] = true;
      updatePattern();
    }
  } else if (type === 128 || (type === 144 && velocity === 0)) {
    const idx = NOTE_TO_SWITCH[note];
    if (idx !== undefined) {
      switchStates[idx] = false;
      updatePattern();
    }
  }
}

async function initMIDI() {
  try {
    const midiAccess = await navigator.requestMIDIAccess();
    const inputs = Array.from(midiAccess.inputs.values());
    const defaultInput = inputs.find(input => input.name === DEFAULT_INPUT_NAME);
    if (defaultInput) {
      defaultInput.onmidimessage = onMIDIMessage;
    } else if (inputs.length > 0) {
      inputs[0].onmidimessage = onMIDIMessage;
    }
  } catch (error) {
    console.error('Web MIDI API not supported:', error);
  }
}

generateGrids();
initMIDI();
</script>

</body>
</html>
