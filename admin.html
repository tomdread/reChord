<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>reChord Admin Editor</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        h1, h2 {
            margin-top: 0;
            color: #333;
        }
        select, button, input, textarea {
            font-size: 16px;
            padding: 8px 12px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease-in-out;
        }
        button:hover {
            background: #0056b3;
        }
        .pad-list button {
            margin: 2px;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .pad-list button.active {
            background: #0056b3;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }
        .piano-container {
            display: flex;
            overflow-x: auto; /* Allow scrolling for wide pianos */
            border: 1px solid #ddd;
            padding: 10px;
            background-color: #fff;
            margin-top: 10px;
            position: relative;
            min-height: 150px; /* Ensure visibility even when empty */
        }
        .piano-key {
            position: absolute;
            border: 1px solid #333;
            cursor: pointer;
            box-sizing: border-box;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            font-size: 10px;
            padding-bottom: 5px;
            z-index: 1; /* White keys behind black keys */
        }
        .white-key {
            background: white;
            width: 40px;
            height: 120px;
            margin-left: -1px; /* Overlap borders */
            z-index: 0;
        }
        .black-key {
            background: #333;
            color: white;
            width: 25px;
            height: 80px;
            margin-left: -12.5px; /* Position half its width over the previous white key */
            z-index: 1;
        }
        .key-text {
            position: absolute;
            bottom: 5px; /* Adjust as needed */
            text-align: center;
            width: 100%;
            pointer-events: none; /* Allow clicks to pass through text to the key */
        }
        .piano-key.active {
            background: #4caf50; /* Green for selected */
            color: white;
        }
        .piano-key.active.black-key {
            background: #2e7d32; /* Darker green for active black key */
        }
        .notes-area {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            font-family: monospace;
        }
        #chordNameDisplay {
            margin-left: 10px;
            font-weight: bold;
            color: #0056b3;
        }
        .song-management {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>🎼 reChord Admin Editor</h1>

    <div class="song-management">
        <h2>Choose a Song</h2>
        <select id="songSelector"></select>
        <input type="text" id="newSongName" placeholder="New song name">
        <button id="createNewSong">➕ New Song</button>
    </div>

    <h2>Notes / Ideas</h2>
    <textarea id="songNotes" class="notes-area" placeholder="Write your song ideas here..."></textarea>

    <h2>Pad Chords</h2>
    <div class="pad-list" id="padList"></div>

    <h2>Chord Editor <span id="chordNameDisplay"></span></h2>
    <div class="piano-container" id="pianoContainer"></div>
    <button id="savePad">💾 Save Pad</button>

    <br><br>
    <button id="exportJSON">⬇ Export Song</button>
    <input type="file" id="importJSON" accept=".json">

    <script>
        // === Constants ===
        const OCTAVE_SEMITONES = 12;
        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // From chord-name-detector.js
        const NOTE_TO_SEMITONE = {
            'C': 0, 'C#': 1, 'Db': 1,
            'D': 2, 'D#': 3, 'Eb': 3,
            'E': 4, 'Fb': 4, 'E#': 5,
            'F': 5, 'F#': 6, 'Gb': 6,
            'G': 7, 'G#': 8, 'Ab': 8,
            'A': 9, 'A#': 10, 'Bb': 10,
            'B': 11, 'Cb': 11, 'B#': 0
        };

        const CHORD_PATTERNS = {
            'Major': [0, 4, 7],
            'Minor': [0, 3, 7],
            'Diminished': [0, 3, 6],
            'Augmented': [0, 4, 8],
            'Sus2': [0, 2, 7],
            'Sus4': [0, 5, 7],
            'Major 7th': [0, 4, 7, 11],
            'Minor 7th': [0, 3, 7, 10],
            'Dominant 7th': [0, 4, 7, 10],
            'Half-Diminished': [0, 3, 6, 10],
            'Diminished 7th': [0, 3, 6, 9],
            'Minor-Major 7th': [0, 3, 7, 11],
            'Aug-Major 7th': [0, 4, 8, 11]
        };

        function normalizeNotesForDetection(notes) {
            const getPitchClass = note => {
                // Handle MIDI note numbers directly if passed
                if (typeof note === 'number') {
                    return NOTE_NAMES[note % OCTAVE_SEMITONES];
                }
                // Otherwise assume string format like 'C3' or 'C#'
                return note.replace(/[0-9]/g, '').toUpperCase();
            };
            const semitones = notes.map(n => NOTE_TO_SEMITONE[getPitchClass(n)]);
            return [...new Set(semitones)];
        }

        function getIntervals(root, semitones) {
            return semitones.map(p => (p - root + OCTAVE_SEMITONES) % OCTAVE_SEMITONES).sort((a, b) => a - b);
        }

        function matchChord(intervals) {
            for (const [name, pattern] of Object.entries(CHORD_PATTERNS)) {
                if (pattern.length !== intervals.length) continue;
                if (pattern.every((val, i) => val === intervals[i])) return name;
            }
            return null;
        }

        function detectChord(notes) {
            if (!notes || notes.length === 0) return null;
            const uniqueSemitones = normalizeNotesForDetection(notes);
            if (uniqueSemitones.length < 2) return null;

            for (let root of uniqueSemitones) {
                const intervals = getIntervals(root, uniqueSemitones);
                const chordName = matchChord(intervals);
                if (chordName) {
                    const rootNote = Object.keys(NOTE_TO_SEMITONE)
                        .find(k => NOTE_TO_SEMITONE[k] === root && !k.includes('b') && k.length <= 2); // Prefer non-flat, simple names
                    return `${rootNote} ${chordName}`;
                }
            }
            return 'Unknown Chord';
        }
        // End of chord-name-detector.js

        function getNoteNameFromMIDI(midiNote) {
            const octave = Math.floor(midiNote / OCTAVE_SEMITONES) - 1;
            const noteName = NOTE_NAMES[midiNote % OCTAVE_SEMITONES];
            return `${noteName}${octave}`;
        }

        // Database constants
        const DB_NAME = 'ChordDB';
        const DB_VERSION = 2; // Keep consistent with main app
        let db;
        let currentSong = null;
        let currentPad = null;
        let selectedNotes = [];

        // Piano key range (e.g., C3 to C5, matching your original noteRange)
        // You can adjust this range if you need more keys in the editor
        const PIANO_START_MIDI = 48; // C3
        const PIANO_END_MIDI = 72;   // C5 (inclusive)

        const WHITE_KEY_WIDTH = 40;
        const BLACK_KEY_WIDTH = 25;
        const BLACK_KEY_OFFSET_X = -12.5; // Half of black key width to center it over the split

        const blackKeys = [1, 3, 6, 8, 10]; // Semitone positions (C# D# F# G# A#)

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => {
                    console.error('Failed to open DB:', request.error);
                    reject('Failed to open DB');
                };
                request.onsuccess = () => {
                    db = request.result;
                    resolve();
                };
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('songs')) {
                        db.createObjectStore('songs');
                    }
                };
            });
        }

        async function listSongs() {
            return new Promise((resolve, reject) => {
                const tx = db.transaction('songs', 'readonly');
                const store = tx.objectStore('songs');
                const req = store.getAll();
                req.onsuccess = () => {
                    const songs = req.result;
                    $('#songSelector').empty();
                    if (songs.length === 0) {
                        $('#songSelector').append('<option value="">No songs found</option>');
                        currentSong = null;
                        $('#songNotes').val('');
                        $('#padList').empty();
                        clearPiano();
                        resolve(false); // Indicate no songs found
                        return;
                    }

                    songs.forEach(song => {
                        $('#songSelector').append(`<option value="${song.id}">${song.name || song.id}</option>`);
                    });

                    // Load the first song by default or keep current selection if it exists
                    const selectedId = $('#songSelector').val();
                    if (selectedId) {
                        loadSong(selectedId);
                    } else if (songs.length > 0) {
                        loadSong(songs[0].id);
                        $('#songSelector').val(songs[0].id);
                    }
                    resolve(true); // Indicate songs were loaded
                };
                req.onerror = () => {
                    console.error('Error listing songs:', req.error);
                    reject(req.error);
                };
            });
        }

        async function loadSong(id) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction('songs', 'readonly');
                const store = tx.objectStore('songs');
                const req = store.get(id);
                req.onsuccess = () => {
                    currentSong = req.result;
                    if (currentSong) {
                        $('#songNotes').val(currentSong.notes || '');
                        renderPadList();
                        clearPiano();
                        $('#chordNameDisplay').text(''); // Clear chord name
                        resolve();
                    } else {
                        console.warn(`Song with ID ${id} not found.`);
                        reject(`Song with ID ${id} not found.`);
                    }
                };
                req.onerror = () => {
                    console.error('Error loading song:', req.error);
                    reject(req.error);
                };
            });
        }

        async function createNewSong() {
            const newName = $('#newSongName').val().trim();
            if (!newName) {
                alert('Please enter a name for the new song.');
                return;
            }

            const newSongId = `song-${Date.now()}`;
            const newSongData = {
                id: newSongId,
                name: newName,
                notes: '',
                pads: {}
            };

            const tx = db.transaction('songs', 'readwrite');
            const store = tx.objectStore('songs');
            const req = store.put(newSongData, newSongId);

            req.onsuccess = async () => {
                alert(`Song "${newName}" created!`);
                $('#newSongName').val('');
                await listSongs(); // Refresh song list
                $('#songSelector').val(newSongId); // Select the new song
                loadSong(newSongId); // Load it into the editor
            };
            req.onerror = () => {
                console.error('Error creating new song:', req.error);
                alert('Failed to create new song.');
            };
        }

        function renderPadList() {
            $('#padList').empty();
            const pads = currentSong?.pads || {};
            for (let i = 36; i <= 43; i++) { // Pads 36 to 43 (MIDI drum notes)
                const label = `Pad ${i}`;
                const btn = $(`<button>${label}</button>`);
                btn.on('click', () => selectPad(i));
                $('#padList').append(btn);
            }
        }

        function selectPad(padNum) {
            currentPad = padNum;
            $('.pad-list button').removeClass('active');
            $(`.pad-list button:contains(Pad ${padNum})`).addClass('active');

            const chordNotes = (currentSong?.pads?.[padNum]?.chord || []);
            selectedNotes = [...chordNotes]; // Copy array
            renderPiano();
            updateChordNameDisplay();
        }

        function renderPiano() {
            $('#pianoContainer').empty();
            let currentX = 0;

            for (let midiNote = PIANO_START_MIDI; midiNote <= PIANO_END_MIDI; midiNote++) {
                const noteValue = midiNote % OCTAVE_SEMITONES;
                const isBlackKey = blackKeys.includes(noteValue);
                const noteName = getNoteNameFromMIDI(midiNote);

                let keyElement;
                if (isBlackKey) {
                    keyElement = $(`<div class="piano-key black-key" data-note="${midiNote}" style="left: ${currentX + BLACK_KEY_OFFSET_X}px;"></div>`);
                } else {
                    keyElement = $(`<div class="piano-key white-key" data-note="${midiNote}" style="left: ${currentX}px;"></div>`);
                    currentX += WHITE_KEY_WIDTH; // Advance X for white keys
                }

                // Add note name to the key
                keyElement.append(`<div class="key-text">${noteName}</div>`);

                if (selectedNotes.includes(midiNote)) {
                    keyElement.addClass('active');
                }

                keyElement.on('click', () => toggleNote(midiNote, keyElement));
                $('#pianoContainer').append(keyElement);
            }
        }

        function toggleNote(note, keyEl) {
            const index = selectedNotes.indexOf(note);
            if (index > -1) {
                selectedNotes.splice(index, 1);
                keyEl.removeClass('active');
            } else {
                selectedNotes.push(note);
                selectedNotes.sort((a, b) => a - b); // Keep notes sorted
                keyEl.addClass('active');
            }
            updateChordNameDisplay();
        }

        function clearPiano() {
            selectedNotes = [];
            $('#pianoContainer .piano-key').removeClass('active');
            $('#chordNameDisplay').text('');
        }

        function updateChordNameDisplay() {
            if (selectedNotes.length > 0) {
                const chordName = detectChord(selectedNotes);
                $('#chordNameDisplay').text(`: ${chordName}`);
            } else {
                $('#chordNameDisplay').text('');
            }
        }

        function savePad() {
            if (!currentSong) {
                alert('No song selected. Please choose or create a song first.');
                return;
            }
            if (currentPad === null) {
                alert('No pad selected. Please select a pad to save the chord.');
                return;
            }

            if (!currentSong.pads) currentSong.pads = {};
            currentSong.pads[currentPad] = { chord: [...selectedNotes] };
            currentSong.notes = $('#songNotes').val(); // Save notes too

            const tx = db.transaction('songs', 'readwrite');
            const store = tx.objectStore('songs');
            const req = store.put(currentSong, currentSong.id);

            req.onsuccess = () => {
                alert(`Pad ${currentPad} saved for song "${currentSong.name || currentSong.id}"!`);
                // No need to clear piano after save, keep current selection
                // clearPiano();
            };
            req.onerror = () => {
                console.error('Error saving pad:', req.error);
                alert('Failed to save pad.');
            };
        }

        function exportJSON() {
            if (!currentSong) {
                alert('No song selected to export.');
                return;
            }
            const json = JSON.stringify(currentSong, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${currentSong.name || currentSong.id}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function importJSONFile(file) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data || !data.id || !data.name) {
                        throw new Error("Invalid JSON structure. Missing 'id' or 'name'.");
                    }

                    const tx = db.transaction('songs', 'readwrite');
                    const store = tx.objectStore('songs');
                    const req = store.put(data, data.id); // Use put to add or update

                    req.onsuccess = () => {
                        alert(`Song "${data.name}" imported successfully!`);
                        listSongs(); // Refresh song list to show the new/updated song
                    };
                    req.onerror = () => {
                        console.error('Error importing song into DB:', req.error);
                        alert(`Failed to import song "${data.name}".`);
                    };
                } catch (error) {
                    console.error('Error parsing or importing JSON:', error);
                    alert(`Error importing file: ${error.message}. Please ensure it's a valid song JSON.`);
                }
            };
            reader.readAsText(file);
        }

        $(async () => {
            await openDB();
            await listSongs(); // Load songs on startup

            $('#songSelector').on('change', function() {
                const id = $(this).val();
                if (id) {
                    loadSong(id);
                } else {
                    currentSong = null;
                    $('#songNotes').val('');
                    $('#padList').empty();
                    clearPiano();
                    $('#chordNameDisplay').text('');
                }
            });

            $('#createNewSong').on('click', createNewSong);
            $('#savePad').on('click', savePad);
            $('#exportJSON').on('click', exportJSON);
            $('#importJSON').on('change', function(e) {
                const file = e.target.files[0];
                if (file) importJSONFile(file);
            });

            // If no songs exist after initial load, prompt to create one
            if (!currentSong) {
                alert("Welcome to the reChord Admin Editor! No songs found. Please create a new song to get started.");
            }
        });
    </script>
</body>
</html>
