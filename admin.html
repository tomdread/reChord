<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>reChord Admin Editor</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        h1, h2 {
            margin-top: 0;
        }
        select, button, input, textarea {
            font-size: 16px;
            padding: 6px;
            margin: 5px 0;
        }
        .pad-list button {
            margin: 2px;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        .pad-list button.active {
            background: #0056b3;
        }
        .piano {
            display: flex;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .key {
            width: 40px;
            height: 120px;
            margin: 1px;
            border: 1px solid #333;
            background: white;
            text-align: center;
            line-height: 120px;
            user-select: none;
            cursor: pointer;
        }
        .key.active {
            background: #4caf50;
            color: white;
        }
        .notes-area {
            width: 100%;
            height: 100px;
        }
    </style>
</head>
<body>
<h1>🎼 reChord Admin Editor</h1>

<h2>Choose a Song</h2>
<select id="songSelector"></select>

<h2>Notes / Ideas</h2>
<textarea id="songNotes" class="notes-area" placeholder="Write your song ideas here..."></textarea>

<h2>Pad Chords</h2>
<div class="pad-list" id="padList"></div>

<h2>Chord Editor</h2>
<div class="piano" id="piano"></div>
<button id="savePad">💾 Save Pad</button>

<br><br>
<button id="exportJSON">⬇ Export Song</button>
<input type="file" id="importJSON" accept=".json">

<script>
const DB_NAME = 'ChordDB';
const DB_VERSION = 2;
let db;
let currentSong = null;
let currentPad = null;
let selectedNotes = [];
const noteRange = [...Array(25).keys()].map(i => i + 48); // C3 to C5

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onerror = () => reject('Failed to open DB');
        request.onsuccess = () => {
            db = request.result;
            resolve();
        };
        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('songs')) db.createObjectStore('songs');
        };
    });
}

function listSongs() {
    const tx = db.transaction('songs', 'readonly');
    const store = tx.objectStore('songs');
    const req = store.getAll();
    req.onsuccess = () => {
        const songs = req.result;
        $('#songSelector').empty();
        songs.forEach(song => {
            $('#songSelector').append(`<option value="${song.id}">${song.name || song.id}</option>`);
        });
        if (songs.length) loadSong(songs[0].id);
    };
}

function loadSong(id) {
    const tx = db.transaction('songs', 'readonly');
    const store = tx.objectStore('songs');
    const req = store.get(id);
    req.onsuccess = () => {
        currentSong = req.result;
        $('#songNotes').val(currentSong.notes || '');
        renderPadList();
        clearPiano();
    };
}

function renderPadList() {
    $('#padList').empty();
    const pads = currentSong.pads || {};
    for (let i = 36; i <= 43; i++) {
        const label = `Pad ${i}`;
        const btn = $(`<button>${label}</button>`);
        btn.on('click', () => selectPad(i));
        $('#padList').append(btn);
    }
}

function selectPad(padNum) {
    currentPad = padNum;
    $('.pad-list button').removeClass('active');
    $(`.pad-list button:contains(Pad ${padNum})`).addClass('active');
    const chord = (currentSong.pads?.[padNum]?.chord || []);
    selectedNotes = [...chord];
    renderPiano();
}

function renderPiano() {
    $('#piano').empty();
    noteRange.forEach(note => {
        const key = $(`<div class="key">${note}</div>`);
        if (selectedNotes.includes(note)) key.addClass('active');
        key.on('click', () => toggleNote(note, key));
        $('#piano').append(key);
    });
}

function toggleNote(note, keyEl) {
    if (selectedNotes.includes(note)) {
        selectedNotes = selectedNotes.filter(n => n !== note);
        keyEl.removeClass('active');
    } else {
        selectedNotes.push(note);
        keyEl.addClass('active');
    }
}

function clearPiano() {
    selectedNotes = [];
    $('#piano .key').removeClass('active');
}

function savePad() {
    if (!currentSong.pads) currentSong.pads = {};
    currentSong.pads[currentPad] = { chord: [...selectedNotes] };
    currentSong.notes = $('#songNotes').val();
    const tx = db.transaction('songs', 'readwrite');
    const store = tx.objectStore('songs');
    store.put(currentSong, currentSong.id);
    clearPiano();
}

function exportJSON() {
    const json = JSON.stringify(currentSong, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${currentSong.name || currentSong.id}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
}

function importJSONFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
        const data = JSON.parse(e.target.result);
        const tx = db.transaction('songs', 'readwrite');
        const store = tx.objectStore('songs');
        store.put(data, data.id);
        tx.oncomplete = () => listSongs();
    };
    reader.readAsText(file);
}

$(async () => {
    await openDB();
    listSongs();

    $('#songSelector').on('change', function() {
        const id = $(this).val();
        loadSong(id);
    });

    $('#savePad').on('click', savePad);
    $('#exportJSON').on('click', exportJSON);
    $('#importJSON').on('change', function(e) {
        const file = e.target.files[0];
        if (file) importJSONFile(file);
    });
});
</script>
</body>
</html>
