<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>reChord Mini Admin</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 2em; background: #f9f9f9; }
    input[type="text"] { width: 100%; padding: 6px; margin-bottom: 8px; }
    button { margin-right: 8px; padding: 6px 12px; }
    .song-box { border: 1px solid #ccc; padding: 1em; margin-top: 1em; background: #fff; }
    .pad { margin-bottom: 1em; }
    label { display: block; margin-top: 0.5em; font-weight: bold; }
  </style>
</head>
<body>

<h2>🎵 reChord Simplified Admin</h2>

<input id="searchInput" placeholder="Search by song name..." />
<button id="loadBtn">Load</button>
<button id="saveBtn">Save</button>
<button id="exportBtn">Export</button>
<input type="file" id="importFile" style="display:none;" />
<button id="importBtn">Import</button>

<div id="songForm" class="song-box" style="display:none;">
  <label>Song Name: <input type="text" id="songName" /></label>
  <div id="padsContainer"></div>
</div>

<script>
const DB_NAME = "ChordDB", DB_VERSION = 2;
let db, currentKey = null, currentData = null;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onsuccess = () => { db = req.result; res(); };
    req.onerror = () => rej(req.error);
    req.onupgradeneeded = e => {
      const upgradeDb = e.target.result;
      if (!upgradeDb.objectStoreNames.contains('songs')) upgradeDb.createObjectStore('songs');
    };
  });
}

function getAllSongs() {
  return new Promise((res, rej) => {
    const tx = db.transaction('songs', 'readonly');
    const store = tx.objectStore('songs');
    const req = store.getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}

function getSongByName(name) {
  return new Promise((res, rej) => {
    const tx = db.transaction('songs', 'readonly');
    const store = tx.objectStore('songs');
    const cursor = store.openCursor();
    cursor.onsuccess = e => {
      const cur = e.target.result;
      if (cur) {
        if (cur.value.name && cur.value.name.toLowerCase().includes(name.toLowerCase())) {
          res({ key: cur.key, data: cur.value });
          return;
        }
        cur.continue();
      } else {
        res(null);
      }
    };
    cursor.onerror = () => rej(cursor.error);
  });
}

function renderSong(song) {
  $("#songForm").show();
  $("#songName").val(song.name);
  $("#padsContainer").empty();
  for (const [pad, obj] of Object.entries(song.pads || {})) {
    const chord = (obj.chord || []).join(", ");
    const bass = (obj.bass || []).join(", ");
    $("#padsContainer").append(`
      <div class="pad">
        <label>Pad ${pad}</label>
        <input class="padChord" data-pad="${pad}" placeholder="Chord notes" value="${chord}" />
        <input class="padBass" data-pad="${pad}" placeholder="Bass notes" value="${bass}" />
      </div>
    `);
  }
}

function saveCurrent() {
  if (!currentKey) return;
  const updatedPads = {};
  $(".padChord").each(function() {
    const pad = $(this).data("pad");
    const chord = $(this).val().split(",").map(n => parseInt(n.trim())).filter(n => !isNaN(n));
    const bass = $(`.padBass[data-pad=${pad}]`).val().split(",").map(n => parseInt(n.trim())).filter(n => !isNaN(n));
    updatedPads[pad] = { chord, bass };
  });
  const updated = {
    ...currentData,
    name: $("#songName").val(),
    pads: updatedPads
  };
  const tx = db.transaction('songs', 'readwrite');
  const store = tx.objectStore('songs');
  store.put(updated, currentKey);
  alert("Saved");
}

function exportSong() {
  if (!currentData) return;
  const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = (currentData.name || "song") + ".json";
  a.click();
  URL.revokeObjectURL(url);
}

function importSong(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj.id) obj.id = crypto.randomUUID();
      const tx = db.transaction('songs', 'readwrite');
      const store = tx.objectStore('songs');
      store.put(obj, obj.id);
      alert("Imported");
    } catch (e) {
      alert("Failed to import: " + e.message);
    }
  };
  reader.readAsText(file);
}

$(async function() {
  await openDB();

  $("#loadBtn").click(async () => {
    const result = await getSongByName($("#searchInput").val());
    if (result) {
      currentKey = result.key;
      currentData = result.data;
      renderSong(currentData);
    } else {
      alert("Not found");
    }
  });

  $("#saveBtn").click(saveCurrent);
  $("#exportBtn").click(exportSong);
  $("#importBtn").click(() => $("#importFile").click());
  $("#importFile").change(e => importSong(e.target.files[0]));
});
</script>

</body>
</html>
