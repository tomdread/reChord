<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>reChord Admin Editor</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="notification-area"></div>
    <div id="main">
        <h1 class="page-title">reChord Admin Editor</h1>
        <p class="tagline">Actual Intelligence In Harmony</p>
    </div>

    <div class="top-card">
        <div class="song-management">
            <h2>Choose a Song</h2>
            <select id="songSelector"></select>
            <input type="text" id="newSongName" placeholder="New song name">
            <button id="createNewSong">➕ New Song</button>
        </div>
    </div>

    <div class="piano-section">
        <h2>Pad Chords</h2>
        <div class="pad-chords-grid" id="padList"></div>
    </div>

    <div class="piano-section">
        <h2>Chord Editor <span id="chordNameDisplay"></span></h2>
        <div class="piano-container" id="pianoContainer"></div>
    </div>

    <div class="piano-section">
        <h2>Notes / Ideas</h2>
        <textarea id="songNotes" class="notes-area" placeholder="Write your song ideas here..."></textarea>
    </div>

    <div class="controls">
        <button id="exportJSON">⬇ Export Song</button>
        <input type="file" id="importJSON" accept=".json">
    </div>

    <script>
        // === Constants ===
        const OCTAVE_SEMITONES = 12;
        const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // From chord-name-detector.js
        const NOTE_TO_SEMITONE = {
            'C': 0, 'C#': 1, 'Db': 1,
            'D': 2, 'D#': 3, 'Eb': 3,
            'E': 4, 'Fb': 4, 'E#': 5,
            'F': 5, 'F#': 6, 'Gb': 6,
            'G': 7, 'G#': 8, 'Ab': 8,
            'A': 9, 'A#': 10, 'Bb': 10,
            'B': 11, 'Cb': 11, 'B#': 0
        };

        const CHORD_PATTERNS = {
            'Major': [0, 4, 7],
            'Minor': [0, 3, 7],
            'Diminished': [0, 3, 6],
            'Augmented': [0, 4, 8],
            'Sus2': [0, 2, 7],
            'Sus4': [0, 5, 7],
            'Major 7th': [0, 4, 7, 11],
            'Minor 7th': [0, 3, 7, 10],
            'Dominant 7th': [0, 4, 7, 10],
            'Half-Diminished': [0, 3, 6, 10],
            'Diminished 7th': [0, 3, 6, 9],
            'Minor-Major 7th': [0, 3, 7, 11],
            'Aug-Major 7th': [0, 4, 8, 11]
        };

        function normalizeNotesForDetection(notes) {
            const getPitchClass = note => {
                if (typeof note === 'number') {
                    return NOTE_NAMES[note % OCTAVE_SEMITONES];
                }
                return note.replace(/[0-9]/g, '').toUpperCase();
            };
            const semitones = notes.map(n => NOTE_TO_SEMITONE[getPitchClass(n)]);
            return [...new Set(semitones)];
        }

        function getIntervals(root, semitones) {
            return semitones.map(p => (p - root + OCTAVE_SEMITONES) % OCTAVE_SEMITONES).sort((a, b) => a - b);
        }

        function matchChord(intervals) {
            for (const [name, pattern] of Object.entries(CHORD_PATTERNS)) {
                if (pattern.length !== intervals.length) continue;
                if (pattern.every((val, i) => val === intervals[i])) return name;
            }
            return null;
        }

        function detectChord(notes) {
            if (!notes || notes.length === 0) return null;
            const uniqueSemitones = normalizeNotesForDetection(notes);
            if (uniqueSemitones.length < 2) return null;

            for (let root of uniqueSemitones) {
                const intervals = getIntervals(root, uniqueSemitones);
                const chordName = matchChord(intervals);
                if (chordName) {
                    const rootNote = Object.keys(NOTE_TO_SEMITONE)
                        .find(k => NOTE_TO_SEMITONE[k] === root && !k.includes('b') && k.length <= 2);
                    return `${rootNote} ${chordName}`;
                }
            }
            return 'Unknown Chord';
        }

        function getNoteNameFromMIDI(midiNote) {
            const octave = Math.floor(midiNote / OCTAVE_SEMITONES) - 1;
            const noteName = NOTE_NAMES[midiNote % OCTAVE_SEMITONES];
            return `${noteName}${octave}`;
        }

        // Database constants - match index.html
        const DB_NAME = 'ChordDB';
        const DB_VERSION = 2;
        const STORE_NAME_SONGS = 'songs';
        const STORE_NAME_PORTS = 'ports';
        let db;
        let currentSong = null;
        let currentPad = null;
        let selectedNotes = [];

        // Piano key range (matching index.html)
        const PIANO_START_MIDI = 21; // A0
        const PIANO_END_MIDI = 108;  // C8

        const WHITE_KEY_WIDTH = 24;
        const WHITE_KEY_HEIGHT = 100;
        const BLACK_KEY_WIDTH = 16;
        const BLACK_KEY_HEIGHT = 50;

        // Semitone positions for black keys relative to C (0-11)
        const BLACK_KEY_SEMITONES = [1, 3, 6, 8, 10]; // C#, D#, F#, G#, A#

        // Add SVG constants
        const SVG_KEY_STROKE_WIDTH = 1;
        const SVG_KEY_TEXT_FONT_SIZE = "8px";
        const KEY_TEXT_Y_OFFSET = 5;

        function getSongNameFromHash() {
            const hash = window.location.hash.substring(1);
            return hash ? decodeURIComponent(hash.startsWith('song=') ? hash.split('=')[1] : hash) : 'default';
        }

        async function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (event) => {
                    console.error('Error opening database', event.target.error);
                    reject('Error opening database: ' + event.target.error.message);
                };
                request.onsuccess = () => {
                    db = request.result;
                    resolve();
                };
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME_SONGS)) {
                        db.createObjectStore(STORE_NAME_SONGS);
                    }
                    if (!db.objectStoreNames.contains(STORE_NAME_PORTS)) {
                        db.createObjectStore(STORE_NAME_PORTS);
                    }
                };
            });
        }

        async function getAllSongNamesFromDB() {
            if (!db) await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME_SONGS, 'readonly');
                const store = tx.objectStore(STORE_NAME_SONGS);
                const req = store.getAllKeys();
                req.onsuccess = () => {
                    resolve(req.result);
                };
                req.onerror = (event) => {
                    console.error('Error getting song names:', event.target.error);
                    reject(event.target.error);
                };
            });
        }

        async function listSongs() {
            try {
                const songNames = await getAllSongNamesFromDB();
                const songSelector = $('#songSelector');
                songSelector.empty();
                
                if (songNames.length === 0) {
                    songSelector.append($('<option>', {
                        value: '',
                        text: 'No songs available',
                        disabled: true,
                        selected: true
                    }));
                    return [];
                }

                songNames.forEach(name => {
                    songSelector.append($('<option>', {
                        value: name,
                        text: name
                    }));
                });
                
                return songNames;
            } catch (error) {
                console.error('Error listing songs:', error);
                throw error;
            }
        }

        async function loadSong(songName) {
            if (!songName) {
                console.warn('loadSong called with no song name. Clearing editor.');
                currentSong = null;
                $('#songNotes').val('');
                $('#padList').empty();
                $('#chordNameDisplay').text('');
                return Promise.resolve();
            }

            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME_SONGS, 'readonly');
                const store = tx.objectStore(STORE_NAME_SONGS);
                const req = store.get(songName);
                
                req.onsuccess = () => {
                    const songData = req.result;
                    if (songData) {
                        currentSong = {
                            name: songName,
                            notes: songData.notes || '',
                            pads: songData.chords || {},
                            sequence: songData.sequence || []
                        };
                        
                        $('#songNotes').val(currentSong.notes || '');
                        renderPadList();
                        $('#chordNameDisplay').text('');
                        resolve();
                    } else {
                        console.warn(`Song "${songName}" not found.`);
                        currentSong = null;
                        $('#songNotes').val('');
                        $('#padList').empty();
                        $('#chordNameDisplay').text('');
                        $('#songSelector').val('');
                        reject(`Song "${songName}" not found.`);
                    }
                };
                
                req.onerror = (event) => {
                    console.error('Error loading song:', event.target.error);
                    reject(event.target.error);
                };
            });
        }

        // Add notification system
        const DEFAULT_NOTIFICATION_DURATION = 3000;
        const NOTIFICATION_FADEOUT_DURATION = 500;

        function showNotification(message, type = 'info', duration = DEFAULT_NOTIFICATION_DURATION) {
            const notificationArea = document.getElementById('notification-area');
            if (!notificationArea) return;
            
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            notificationArea.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), NOTIFICATION_FADEOUT_DURATION);
            }, duration);
        }

        async function createNewSong() {
            const songName = $('#newSongName').val().trim();
            if (!songName) {
                showNotification('Please enter a song name', 'warning');
                return Promise.reject('No song name provided');
            }

            try {
                const existingSongs = await getAllSongNamesFromDB();
                if (existingSongs.includes(songName)) {
                    showNotification('A song with this name already exists', 'warning');
                    return Promise.reject('Song already exists');
                }
                
                const newSongData = {
                    notes: '',
                    pads: {},
                    sequence: []
                };
                
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME_SONGS, 'readwrite');
                    const store = tx.objectStore(STORE_NAME_SONGS);
                    
                    tx.onerror = (event) => {
                        console.error('Transaction error:', event.target.error);
                        reject(event.target.error);
                    };
                    
                    const addReq = store.add(newSongData, songName);
                    
                    addReq.onsuccess = async () => {
                        try {
                            await listSongs();
                            updateSongHash(songName);
                            $('#chordNameDisplay').text('');
                            $('#songNotes').val('');
                            $('#newSongName').val('');
                            showNotification(`Created new song: ${songName}`, 'success');
                            resolve();
                        } catch (error) {
                            console.error('Error in success handler:', error);
                            reject(error);
                        }
                    };
                    
                    addReq.onerror = (event) => {
                        console.error('Error adding song:', event.target.error);
                        showNotification('Failed to create new song', 'error');
                        reject(event.target.error);
                    };
                });
            } catch (error) {
                console.error('Error in createNewSong:', error);
                return Promise.reject(error);
            }
        }

        function renderPadList() {
            const padList = $('#padList');
            padList.empty();
            
            if (!currentSong || !currentSong.pads) {
                return;
            }

            // Iterate over all possible pad IDs (36 to 43) to maintain grid structure
            // even for empty pads.
            for (let i = 36; i <= 43; i++) {
                const padId = String(i); // Ensure padId is a string
                const pad = currentSong.pads[padId];
                let chordName = 'Empty';
                if (pad && pad.chord && pad.chord.length > 0) {
                    chordName = detectChord(pad.chord) || 'Unknown Chord';
                }

                const padDiv = $(`<div class="pad-chord" data-pad-id="${padId}">
                                    <div class="pad-name">Pad ${padId}</div>
                                    <div class="chord-name">${chordName}</div>
                                </div>`);
                
                if (currentPad === padId) {
                    padDiv.addClass('active');
                }

                padDiv.on('click', function() {
                    // Remove active class from all pads
                    padList.find('.pad-chord').removeClass('active');
                    // Add active class to clicked pad
                    $(this).addClass('active');
                    
                    // Set current pad and load its notes
                    currentPad = padId;
                    selectedNotes = (pad && pad.chord) ? [...pad.chord] : [];
                    renderPiano();
                });
                
                padList.append(padDiv);
            }
        }

        function renderPiano() {
            const pianoContainer = document.getElementById('pianoContainer');
            pianoContainer.innerHTML = '';
            
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            const totalWhiteKeys = countWhiteKeysInPianoRange(PIANO_START_MIDI, PIANO_END_MIDI);
            svg.setAttribute('width', totalWhiteKeys * WHITE_KEY_WIDTH + (2 * SVG_KEY_STROKE_WIDTH));
            svg.setAttribute('height', WHITE_KEY_HEIGHT + (2 * SVG_KEY_STROKE_WIDTH));
            
            const whiteKeysGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const blackKeysGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            let whiteKeyIndex = 0;

            for (let note = PIANO_START_MIDI; note <= PIANO_END_MIDI; note++) {
                const noteName = getNoteNameFromMIDI(note);
                const isBlackKey = noteName.includes('#');
                
                const keyRect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                keyRect.dataset.note = note;
                
                const keyText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                keyText.setAttribute('class', 'key-text');
                keyText.textContent = noteName;
                keyText.style.fontSize = SVG_KEY_TEXT_FONT_SIZE;

                if (!isBlackKey) {
                    keyRect.setAttribute('x', whiteKeyIndex * WHITE_KEY_WIDTH + SVG_KEY_STROKE_WIDTH);
                    keyRect.setAttribute('y', SVG_KEY_STROKE_WIDTH);
                    keyRect.setAttribute('width', WHITE_KEY_WIDTH - SVG_KEY_STROKE_WIDTH);
                    keyRect.setAttribute('height', WHITE_KEY_HEIGHT);
                    keyRect.setAttribute('class', 'piano-key white');
                    
                    keyText.setAttribute('x', whiteKeyIndex * WHITE_KEY_WIDTH + WHITE_KEY_WIDTH/2 + SVG_KEY_STROKE_WIDTH);
                    keyText.setAttribute('y', WHITE_KEY_HEIGHT - KEY_TEXT_Y_OFFSET + SVG_KEY_STROKE_WIDTH);
                    keyText.setAttribute('text-anchor', 'middle');
                    
                    whiteKeysGroup.appendChild(keyRect);
                    whiteKeysGroup.appendChild(keyText);
                    whiteKeyIndex++;
                } else {
                    const prevWhiteKeyX = (whiteKeyIndex - 1) * WHITE_KEY_WIDTH;
                    keyRect.setAttribute('x', prevWhiteKeyX + WHITE_KEY_WIDTH - BLACK_KEY_WIDTH/2 + SVG_KEY_STROKE_WIDTH);
                    keyRect.setAttribute('y', SVG_KEY_STROKE_WIDTH);
                    keyRect.setAttribute('width', BLACK_KEY_WIDTH);
                    keyRect.setAttribute('height', BLACK_KEY_HEIGHT);
                    keyRect.setAttribute('class', 'piano-key black');

                    keyText.setAttribute('x', prevWhiteKeyX + WHITE_KEY_WIDTH + SVG_KEY_STROKE_WIDTH);
                    keyText.setAttribute('y', BLACK_KEY_HEIGHT - KEY_TEXT_Y_OFFSET + SVG_KEY_STROKE_WIDTH);
                    keyText.setAttribute('text-anchor', 'middle');
                    keyText.setAttribute('fill', '#fff');
                    
                    blackKeysGroup.appendChild(keyRect);
                    blackKeysGroup.appendChild(keyText);
                }

                // Add click handler
                keyRect.addEventListener('click', () => toggleNote(note, keyRect));
            }

            svg.appendChild(whiteKeysGroup);
            svg.appendChild(blackKeysGroup);
            pianoContainer.appendChild(svg);

            // Apply active class based on selectedNotes
            svg.querySelectorAll('.piano-key').forEach(key => {
                const midiNote = parseInt(key.dataset.note);
                if (selectedNotes.includes(midiNote)) {
                    key.classList.add('active');
                }
            });

            updateChordNameDisplay();
        }

        function countWhiteKeysInPianoRange(startNote, endNote) {
            let count = 0;
            for (let note = startNote; note <= endNote; note++) {
                if (!getNoteNameFromMIDI(note).includes('#')) count++;
            }
            return count;
        }

        // Add debounce constants
        const SAVE_DELAY = 500;                 // ms for debouncing save operations
        const SAVE_INDICATOR_DURATION = 1500;   // ms for save indicator display

        let saveTimeout = null; // For debouncing save operations

        function debounceSave() {
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                savePad();
            }, SAVE_DELAY);
        }

        function toggleNote(note, keyEl) {
            const index = selectedNotes.indexOf(note);
            if (index > -1) {
                selectedNotes.splice(index, 1);
                keyEl.classList.remove('active');
            } else {
                selectedNotes.push(note);
                selectedNotes.sort((a, b) => a - b); // Keep notes sorted
                keyEl.classList.add('active');
            }
            updateChordNameDisplay();
            debounceSave();
        }

        function clearPiano() {
            selectedNotes = [];
            const pianoContainer = document.getElementById('pianoContainer');
            pianoContainer.querySelectorAll('.piano-key').forEach(key => key.classList.remove('active'));
            document.getElementById('chordNameDisplay').textContent = '';
        }

        function updateChordNameDisplay() {
            const chordNameDisplay = document.getElementById('chordNameDisplay');
            if (selectedNotes.length > 0) {
                const chordName = detectChord(selectedNotes);
                chordNameDisplay.textContent = `: ${chordName}`;
            } else {
                chordNameDisplay.textContent = '';
            }
        }

        function savePad() {
            if (!currentSong) {
                showNotification('No song selected. Please choose or create a song first.', 'warning');
                return;
            }
            if (!currentPad) {
                showNotification('Please select a pad from the grid first.', 'warning');
                return;
            }

            if (!currentSong.pads) currentSong.pads = {};
            currentSong.pads[currentPad] = { 
                chord: [...selectedNotes],
                bass: []
            };
            currentSong.notes = $('#songNotes').val();

            const tx = db.transaction(STORE_NAME_SONGS, 'readwrite');
            const store = tx.objectStore(STORE_NAME_SONGS);
            const req = store.put({
                chords: currentSong.pads,
                notes: currentSong.notes,
                sequence: currentSong.sequence
            }, currentSong.name);

            req.onsuccess = () => {
                // Show save indicator instead of notification
                const saveIndicator = document.createElement('div');
                saveIndicator.className = 'save-indicator';
                saveIndicator.textContent = '✓ Saved';
                document.body.appendChild(saveIndicator);
                requestAnimationFrame(() => { saveIndicator.style.opacity = '1'; });
                setTimeout(() => {
                    saveIndicator.style.opacity = '0';
                    setTimeout(() => saveIndicator.remove(), 300);
                }, SAVE_INDICATOR_DURATION);
                renderPadList();
            };
            req.onerror = () => {
                console.error('Error saving pad:', req.error);
                showNotification('Failed to save pad.', 'error');
            };
        }

        function exportJSON() {
            if (!currentSong) {
                showNotification('No song selected to export.', 'warning');
                return;
            }
            const json = JSON.stringify(currentSong, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${currentSong.name || currentSong.id}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
            showNotification('Song exported successfully', 'success');
        }

        function importJSONFile(file) {
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (!data || !data.name) {
                        throw new Error("Invalid JSON structure. Missing 'name'.");
                    }
                    if (!data.pads) data.pads = {};

                    const tx = db.transaction(STORE_NAME_SONGS, 'readwrite');
                    const store = tx.objectStore(STORE_NAME_SONGS);
                    const req = store.put(data, data.name);

                    req.onsuccess = () => {
                        showNotification(`Song "${data.name}" imported successfully!`, 'success');
                        listSongs();
                    };
                    req.onerror = () => {
                        console.error('Error importing song into DB:', req.error);
                        showNotification(`Failed to import song "${data.name}".`, 'error');
                    };
                } catch (error) {
                    console.error('Error parsing or importing JSON:', error);
                    showNotification(`Error importing file: ${error.message}. Please ensure it's a valid song JSON.`, 'error');
                }
            };
            reader.readAsText(file);
        }

        function updateSongHash(songName) {
            if (songName && songName !== 'default') {
                window.location.hash = 'song=' + encodeURIComponent(songName);
            } else {
                window.location.hash = '';
            }
        }

        function handleHashChange() {
            const songName = getSongNameFromHash();
            if (songName) {
                $('#songSelector').val(songName);
                loadSong(songName).catch(console.error);
            }
        }

        $(async () => {
            try {
                await openDB();
                const songs = await listSongs();
                const songSelector = $('#songSelector');
                
                $(window).on('hashchange', handleHashChange);
                
                if (songs && songs.length > 0) {
                    let currentSongName = getSongNameFromHash();
                    if (!currentSongName || !songs.includes(currentSongName)) {
                        currentSongName = songs[0];
                        updateSongHash(currentSongName);
                    }
                    
                    await loadSong(currentSongName);
                    songSelector.val(currentSongName);
                } else {
                    console.log('No songs found in database');
                    currentSong = null;
                    $('#songNotes').val('');
                    $('#padList').empty();
                    $('#chordNameDisplay').text('');
                }

                // Initialize piano on page load
                renderPiano();

                songSelector.on('change', function() {
                    const songName = $(this).val();
                    if (songName) {
                        updateSongHash(songName);
                    }
                });

                $('#createNewSong').on('click', createNewSong);
                $('#importJSON').on('change', function(e) {
                    const file = e.target.files[0];
                    if (file) importJSONFile(file);
                });

                // Add auto-save for song notes
                $('#songNotes').on('input', debounceSave);
            } catch (error) {
                console.error('Initialization error:', error);
                alert('Error initializing the application. Please check the console for details.');
            }
        });
    </script>
</body>
</html>
