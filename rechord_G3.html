<script>
// chord-name-detector.js
const NOTE_TO_SEMITONE = {
    'C': 0,  'C#': 1, 'Db': 1, 'D': 2,  'D#': 3, 'Eb': 3, 'E': 4,  'Fb': 4, 'E#': 5,
    'F': 5,  'F#': 6, 'Gb': 6, 'G': 7,  'G#': 8, 'Ab': 8, 'A': 9,  'A#': 10, 'Bb': 10,
    'B': 11, 'Cb': 11, 'B#': 0
};
const CHORD_PATTERNS = {
    'Major': [0, 4, 7], 'Minor': [0, 3, 7], 'Diminished': [0, 3, 6], 'Augmented': [0, 4, 8],
    'Sus2': [0, 2, 7], 'Sus4': [0, 5, 7], 'Major 7th': [0, 4, 7, 11], 'Minor 7th': [0, 3, 7, 10],
    'Dominant 7th': [0, 4, 7, 10], 'Half-Diminished': [0, 3, 6, 10], 'Diminished 7th': [0, 3, 6, 9],
    'Minor-Major 7th': [0, 3, 7, 11], 'Aug-Major 7th': [0, 4, 8, 11]
};
function normalizeNotes(notes) {
    const getPitchClass = note => note.replace(/[0-9]/g, '').toUpperCase();
    const semitones = notes.map(n => NOTE_TO_SEMITONE[getPitchClass(n)]);
    return [...new Set(semitones)];
}
function getIntervals(root, semitones) {
    return semitones.map(p => (p - root + 12) % 12).sort((a, b) => a - b);
}
function matchChord(intervals) {
    for (const [name, pattern] of Object.entries(CHORD_PATTERNS)) {
    if (pattern.length !== intervals.length) continue;
    if (pattern.every((val, i) => val === intervals[i])) return name;
    }
    return null;
}
function detectChord(notes) {
    const uniqueSemitones = normalizeNotes(notes);
    if (uniqueSemitones.length < 2) return null;
    for (let root of uniqueSemitones) {
    const intervals = getIntervals(root, uniqueSemitones);
    const chordName = matchChord(intervals);
    if (chordName) {
        const rootNote = Object.keys(NOTE_TO_SEMITONE).find(k => NOTE_TO_SEMITONE[k] === root && !k.includes('b') && k.length <= 2);
        return `${rootNote} ${chordName}`;
    }
    }
    return 'Unknown Chord';
}
if (typeof window !== 'undefined') { window.detectChord = detectChord; } else { module.exports = { detectChord }; }
</script>

<script>
"use strict";

// === Constants ===
const MODE_STOP = 0;
const MODE_RECORD = 1;
const MODE_PLAY = 2;

const MIDI_CHANNEL_MAIN = 1;    
const MIDI_CHANNEL_DRUMS = 10;  
const MIDI_NOTE_ON = 0x90;
const MIDI_NOTE_OFF = 0x80;
const MIDI_CONTROL_CHANGE = 0xB0;
const MIDI_PITCH_BEND = 0xE0;

const VELOCITY_THRESHOLD = 64;  
const VELOCITY_MAX = 127;       

const SIMULTANEOUS_PRESS_WINDOW = 150;  
const RECORD_HOLD_THRESHOLD = 500;      
const PORT_CHANGE_DELAY = 1000;         
const SAVE_DELAY = 500;                 

const MAX_SEQUENCE_LENGTH = 16;
const MAX_CHORD_NOTES = 10;

const STORAGE_BIT_KEYS = [50, 52, 53, 55, 49, 51, 54, 56]; 

/* ————— Grouped State ————— */
const Chords = {
    record: [],
    string: [],
    pads: {}, 
    triggers: {},
    sequence: [],
    sequenceIndex: 0,
    sequenceReady: false
};

let isRecordingSequence = false;
let isSequenceMode = false;
const sequenceStartCC = 115;    
const sequenceNextCC = 116;     

let isPadTriggerMode = false;
let isMainOutputMuted = false;

const INVERSION_CC = 74;  
let currentInversion = 0;
const INVERSION_THRESHOLD = 20;  
let inversionCounter = 0;  

let activeStoragePadBits = 0; 
let activeStoragePadBitsPlayMode = 0; 
let recordButtonPressedWhileInRecordMode = false; 
let armedStorageKey = 0; 

function invertChord(notes, inversion) {
    if (!notes || notes.length === 0) return notes;
    const maxInversion = Math.max(0, notes.length - 1);
    inversion = ((inversion % (maxInversion + 1)) + (maxInversion + 1)) % (maxInversion + 1);
    const result = [...notes];
    for (let i = 0; i < inversion; i++) {
        const firstNote = result.shift();
        result.push(firstNote + 12); 
    }
    return result;
}

function updateInversionDisplay() {
    const chordPianoSection = document.querySelector('#chord-piano')?.parentElement;
    if (!chordPianoSection) return;
    let inversionDisplay = chordPianoSection.querySelector('.inversion-display');
    if (!inversionDisplay) {
        inversionDisplay = document.createElement('div');
        inversionDisplay.className = 'inversion-display';
        inversionDisplay.style.cssText = `margin-top: 10px; padding: 5px; background: var(--header-bg); border-radius: var(--radius); font-size: 1.1em;`;
        chordPianoSection.appendChild(inversionDisplay);
    }
    const maxInversion = getMaxInversion();
    const inversionText = currentInversion === 0 ? 'Root Position' : `${currentInversion}${currentInversion === 1 ? 'st' : currentInversion === 2 ? 'nd' : currentInversion === 3 ? 'rd' : 'th'} Inversion`;
    const maxText = maxInversion > 0 ? ` (max: ${maxInversion})` : '';
    inversionDisplay.innerHTML = `<div>Chord Position: ${inversionText}${maxText}</div>
        <div class="tilt-display" style="margin-top: 5px; font-size: 0.9em;">Velocity Tilt: <span id="tilt-amount">${tiltAmount.toFixed(2)}</span><br>Pivot: <span id="tilt-pivot">${tiltPivot.toFixed(2)}</span></div>`;
}

function updateTiltDisplay() {
    const tiltAmountEl = document.getElementById('tilt-amount');
    const tiltPivotEl = document.getElementById('tilt-pivot');
    if (tiltAmountEl) tiltAmountEl.textContent = tiltAmount.toFixed(2);
    if (tiltPivotEl) tiltPivotEl.textContent = tiltPivot.toFixed(2);
}

let midiAccess;
let currentInput = null;
let currentOutputs = { main: null, bass: null, chord: null, string: null };
let mode = MODE_STOP;
const recordCC = 119, playCC = 118, stopCC = 117;
let transposeOffset = 0;

const BASS_TRIGGERS = [75, 78, 80, 82];
const STRING_TRIGGERS = [76, 77, 79, 81, 83, 84];
const FULL_CHORD = 58;
const FULL_STRING = 73;
const CHORD_TRIGGER_TOGGLE = 48;
const VELOCITY_TILT_CC = 75; 

const CHORD_OCTAVE_UP = 59;
const CHORD_OCTAVE_DOWN = 57;
const STRING_OCTAVE_UP = 74; 
const STRING_OCTAVE_DOWN = 72;

const DEFAULT_INPUT_NAME = "MPK mini Plus Port 1";
const DEFAULT_OUTPUT_NAMES = { main: "IAC Driver miDiai00", bass: "IAC Driver miDiai01", chord: "IAC Driver miDiai02", string: "IAC Driver miDiai03" };
const lastPortStates = new Map();
let portChangeTimeout = null;
function trackPortState(port) { lastPortStates.set(port.id, port.state); }

let db;
const DB_NAME = 'ChordDB';
const STORE_NAME = 'songs';
const PORTS_STORE_NAME = 'ports';
let fullChordOctaveOffset = 0;
let stringOctaveOffset = 0;
const keyPressTimes = new Map();
let currentPlayingChordNotes = []; 
let tiltAmount = 0.0;
let tiltPivot = 0.0;
const TILT_MIN = -1.0, TILT_MAX = 1.0, TILT_STEP = 0.01, TILT_PIVOT_SHIFT = 0.5, TILT_VELOCITY_MULT = 60;
const TILT_CC_MIN = 10, TILT_CC_MAX = 126, TILT_CC_CENTER = 64;

function applyVelocityTilt(chordNotes, cc75value) {
    if (!chordNotes || chordNotes.length === 0) return chordNotes;
    if (cc75value !== 0) { 
        if (cc75value === TILT_CC_MAX) tiltAmount = Math.max(TILT_MIN, tiltAmount - TILT_STEP);
        else if (cc75value === TILT_CC_MIN) tiltAmount = Math.min(TILT_MAX, tiltAmount + TILT_STEP);
        else if (cc75value === TILT_CC_CENTER) tiltAmount = 0.0;
    }
    const sortedNotes = [...chordNotes].sort((a, b) => a.pitch - b.pitch);
    const pivotShift = tiltAmount * TILT_PIVOT_SHIFT;
    const centerPivot = (sortedNotes.length - 1) / 2;
    const currentPivot = Math.max(0, Math.min(sortedNotes.length - 1, centerPivot + pivotShift));
    tiltPivot = currentPivot; 
    updateTiltDisplay(); 
    return sortedNotes.map((note, index) => {
        const velocityDelta = (index - currentPivot) * tiltAmount * TILT_VELOCITY_MULT;
        const newVelocity = Math.max(1, Math.min(127, note.velocity + velocityDelta));
        return { ...note, velocity: Math.round(newVelocity) };
    });
}

const modeDisplay = document.getElementById("mode");

function showNotification(message, type = 'info', duration = 3000) {
    const area = document.getElementById('notification-area');
    if (!area) return;
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.textContent = message;
    area.appendChild(notification);
    setTimeout(() => {
        notification.style.opacity = '0';
        setTimeout(() => notification.remove(), 500);
    }, duration);
}

function flashActivity(type) {
    const el = document.getElementById(`${type}-activity`);
    if (!el) return;
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 100);
}

function getNoteNameFromMIDI(midiNote) {
    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const octave = Math.floor(midiNote / 12) - 1;
    return `${notes[midiNote % 12]}${octave}`;
}

let saveTimeout = null;
function debounceSave() {
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => { saveChordsToDB().catch(console.error); }, SAVE_DELAY);
}

function updateStatus() {
    const modeDisplayEl = document.getElementById("mode"); 
    if (modeDisplayEl) modeDisplayEl.textContent = mode === MODE_STOP ? "STOP" : mode === MODE_RECORD ? "RECORD" : "PLAY";
    if (mode === MODE_STOP) clearAllChordNotes(); 
    
    const currentChordForDisplay = mode === MODE_RECORD ? Chords.record : Chords.string;
    const chordNotesText = currentChordForDisplay.length > 0 ? currentChordForDisplay.map(note => getNoteNameFromMIDI(note)).join(' ') : 'No Chord';
    const chordDisplayEl = document.getElementById('currentChord'); 
    if (chordDisplayEl) chordDisplayEl.textContent = chordNotesText;
    const chordNameElement = document.getElementById('chordName'); 
    if (chordNameElement) {
        if (currentChordForDisplay.length > 0) chordNameElement.textContent = detectChord(currentChordForDisplay.map(note => getNoteNameFromMIDI(note))) || 'Unknown Chord';
        else chordNameElement.textContent = '-';
    }
    const currentPianoContainer = document.getElementById('current-piano');
    if (currentPianoContainer) {
        const pianoKeys = currentPianoContainer.querySelectorAll('.piano-key');
        pianoKeys.forEach(key => key.classList.remove('active'));
        currentChordForDisplay.forEach(note => {
            const key = currentPianoContainer.querySelector(`.piano-key[data-note="${note}"]`);
            if (key) key.classList.add('active');
        });
    }
    debounceSave();
}

function updateMIDIStatus() { 
    const inputStatus = currentInput ? 'connected' : 'disconnected';
    const mainPianoSection = document.querySelector('#main-piano')?.parentElement;
    if (mainPianoSection) {
        const inputStatusEl = mainPianoSection.querySelector('.port-status');
        if (inputStatusEl) inputStatusEl.className = `port-status ${inputStatus}`;
        const outputStatusEl = mainPianoSection.querySelectorAll('.port-status')[1]; 
        if (outputStatusEl) outputStatusEl.className = `port-status ${currentOutputs.main ? 'connected' : 'disconnected'}`;
    }
    ['bass', 'chord', 'string'].forEach(type => {
        const section = document.querySelector(`#${type}-piano`)?.parentElement;
        if (section) {
            const statusEl = section.querySelector('.port-status');
            if (statusEl) statusEl.className = `port-status ${currentOutputs[type] ? 'connected' : 'disconnected'}`;
        }
    });
}
function initDB() { 
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 3);
        request.onerror = () => { showNotification('Failed to initialize storage: ' + request.error.message, 'warning'); reject(request.error); };
        request.onsuccess = () => { db = request.result; resolve(); };
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (db.objectStoreNames.contains(STORE_NAME)) {
    db.deleteObjectStore(STORE_NAME);
}
db.createObjectStore(STORE_NAME, { keyPath: 'songName' });
            if (!db.objectStoreNames.contains(PORTS_STORE_NAME)) db.createObjectStore(PORTS_STORE_NAME);
        };
    });
}
async function savePortSelections() { 
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(PORTS_STORE_NAME, 'readwrite');
        const store = tx.objectStore(PORTS_STORE_NAME);
        const portSelections = {
            input: currentInput ? currentInput.id : null,
            outputs: {
                main: currentOutputs.main ? currentOutputs.main.id : null,
                bass: currentOutputs.bass ? currentOutputs.bass.id : null,
                chord: currentOutputs.chord ? currentOutputs.chord.id : null,
                string: currentOutputs.string ? currentOutputs.string.id : null
            }
        };
        const request = store.put(portSelections, 'current');
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
}
async function loadPortSelections() { 
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(PORTS_STORE_NAME, 'readonly');
        const store = tx.objectStore(PORTS_STORE_NAME);
        const request = store.get('current');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}
async function refreshPortLists() { 
    const inputsSel = document.getElementById('inputs');
    const outputsSel = document.getElementById('outputs'); 
    if (!inputsSel || !outputsSel ) { showNotification('Core MIDI selectors not found in DOM', 'warning'); return; }
    inputsSel.innerHTML = '<option value="">Select MIDI Input</option>';
    outputsSel.innerHTML = '<option value="">Select Main MIDI Output</option>';
    ['bass', 'chord', 'string'].forEach(type => {
        const selector = document.getElementById(`${type}-outputs`);
        if (selector) selector.innerHTML = '<option value="">Select ' + type.charAt(0).toUpperCase() + type.slice(1) + ' Output</option>';
    });
    let hasInputs = false, hasOutputs = false;
    if (!midiAccess) { showNotification('MIDI Access not available for refreshing ports.', 'warning'); return; }
    console.log('Populating MIDI input selector...');
    for (let inp of midiAccess.inputs.values()) {
        console.log('Found MIDI input:', inp.id, inp.name);
        const opt = document.createElement('option');
        opt.value = inp.id;
        opt.textContent = inp.name;
        inputsSel.appendChild(opt);
        hasInputs = true;
    }
    console.log('Populating MIDI output selectors...');
    for (let outp of midiAccess.outputs.values()) {
        console.log('Found MIDI output:', outp.id, outp.name);
        const opt = document.createElement('option');
        opt.value = outp.id;
        opt.textContent = outp.name;
        outputsSel.appendChild(opt);
        hasOutputs = true;
        ['bass', 'chord', 'string'].forEach(type => {
            const selector = document.getElementById(`${type}-outputs`);
            if (selector) {
                const optClone = opt.cloneNode(true);
                selector.appendChild(optClone);
            }
        });
    }
    inputsSel.disabled = !hasInputs; outputsSel.disabled = !hasOutputs;
    ['bass', 'chord', 'string'].forEach(type => { const selector = document.getElementById(`${type}-outputs`); if (selector) selector.disabled = !hasOutputs; });
    updateMIDIStatus(); 
    try {
        const savedPorts = await loadPortSelections();
        if (savedPorts) {
            if (savedPorts.input && midiAccess.inputs.has(savedPorts.input)) { 
                console.log('Selecting saved MIDI input:', savedPorts.input);
                selectInput(savedPorts.input); 
                inputsSel.value = savedPorts.input; 
            }
            if (savedPorts.outputs) {
                Object.entries(savedPorts.outputs).forEach(([type, id]) => {
                    if (id && midiAccess.outputs.has(id)) {
                        selectOutput(type, id);
                        const selector = document.getElementById(type === 'main' ? 'outputs' : `${type}-outputs`);
                        if (selector) selector.value = id;
                    }
                });
            }
        } else { 
            if (hasInputs) { for (let inp of midiAccess.inputs.values()) if (inp.name === DEFAULT_INPUT_NAME) { selectInput(inp.id); inputsSel.value = inp.id; break; } }
            if (hasOutputs) { Object.entries(DEFAULT_OUTPUT_NAMES).forEach(([type, name]) => {

function handleMIDIMessage(ev) {
    try {
        if (!ev.data || ev.data.length < 2) { showNotification('Invalid MIDI message', 'warning'); return; }
        flashActivity('input');
        const [status, data1, data2] = ev.data;
        const type = status & 0xF0; 
        const channel = (status & 0x0F) + 1;
        const pitch = data1; 
        const value = data2;

        const storageBitKeyIndex = STORAGE_BIT_KEYS.indexOf(pitch);
        if (storageBitKeyIndex !== -1) {
            const oldPlayModeBits = activeStoragePadBitsPlayMode;
            let bitMaskChangedInCurrentMode = false; 

            if (type === MIDI_NOTE_ON && value > 0) {
                if (mode === MODE_RECORD) {
                    if (!recordButtonPressedWhileInRecordMode) { 
                        activeStoragePadBits |= (1 << storageBitKeyIndex);
                        bitMaskChangedInCurrentMode = true;
                    } else {
                         showNotification('Record armed. Bits locked. Release Record.', 'warning', 1000);
                    }
                } else if (mode === MODE_PLAY) {
                    activeStoragePadBitsPlayMode |= (1 << storageBitKeyIndex);
                    bitMaskChangedInCurrentMode = true;
                }
            } else if (type === MIDI_NOTE_OFF || (type === MIDI_NOTE_ON && value === 0)) {
                if (mode === MODE_RECORD) {
                     if (!recordButtonPressedWhileInRecordMode) { 
                        activeStoragePadBits &= ~(1 << storageBitKeyIndex);
                        bitMaskChangedInCurrentMode = true;
                     }
                } else if (mode === MODE_PLAY) {
                    activeStoragePadBitsPlayMode &= ~(1 << storageBitKeyIndex);
                    bitMaskChangedInCurrentMode = true;
                }
            }

            if (bitMaskChangedInCurrentMode) {
                if (mode === MODE_PLAY) { 
                    if(activeStoragePadBitsPlayMode !== oldPlayModeBits) { 
                        handlePlayModeCombinationChange();
                    }
                } else if (mode === MODE_RECORD && !recordButtonPressedWhileInRecordMode) { 
                    showNotification(`Storage key: ${activeStoragePadBits} (Binary: ${activeStoragePadBits.toString(2).padStart(8, '0')})`, 'info', 1000);
                }
            }
            updateKeyboard(pitch, type === MIDI_NOTE_ON && value > 0, 'main'); 
            return; 
        }

        buttonManager.handleMessage(status, data1, data2);

        if (mode === MODE_STOP) { send(ev.data, 'main'); return; }
        
        if (type === MIDI_CONTROL_CHANGE && channel === MIDI_CHANNEL_MAIN && pitch === INVERSION_CC) { /* ... (no change) ... */ }
        if (type === MIDI_CONTROL_CHANGE && channel === MIDI_CHANNEL_MAIN && pitch === VELOCITY_TILT_CC) { /* ... (no change) ... */ }
        if (type === MIDI_PITCH_BEND || (type === MIDI_CONTROL_CHANGE && data1 === 1)) { ['main', 'bass', 'chord', 'string'].forEach(port => send(ev.data, port)); return; }
        if (type === MIDI_NOTE_ON || type === MIDI_NOTE_OFF) { updateKeyboard(pitch, type === MIDI_NOTE_ON && value > 0); }
        if (channel === MIDI_CHANNEL_DRUMS) { send(ev.data, 'main'); return; } 

        if (isRecordingSequence && type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && value > 0) {
            const padNumber = PAD_MAP_1[pitch] || pitch; 
            if (Chords.pads[padNumber] && Chords.sequence.length < MAX_SEQUENCE_LENGTH) { 
                Chords.sequence.push(padNumber); showNotification(`Seq (old system): ${padNumber}`, 'warning');
            }
            return;
        }

        if (mode === MODE_RECORD) {
            if (recordButtonPressedWhileInRecordMode) return; 
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN) {
                send(ev.data, 'main'); 
                const noteIndex = Chords.record.indexOf(pitch);
                if (noteIndex === -1) {
                    if (Chords.record.length < MAX_CHORD_NOTES) { Chords.record.push(pitch); Chords.record.sort((a,b)=>a-b); }
                } else { Chords.record.splice(noteIndex, 1); }
                updateStatus(); showNotification(`${noteIndex === -1 ? 'Added' : 'Removed'} ${getNoteNameFromMIDI(pitch)}`, 'info');
                return;
            }
            if (type === MIDI_NOTE_OFF && channel === MIDI_CHANNEL_MAIN) { send(ev.data, 'main'); return; }
            if (!recordButtonPressedWhileInRecordMode) send(ev.data, 'main');
            return;
        }

        if (mode === MODE_PLAY) {
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && value > 0) {
                const now = Date.now();
                if ([CHORD_OCTAVE_UP, CHORD_OCTAVE_DOWN, STRING_OCTAVE_UP, STRING_OCTAVE_DOWN].includes(pitch)) {
                    keyPressTimes.set(pitch, now);
                    const chUp = keyPressTimes.get(CHORD_OCTAVE_UP), chDown = keyPressTimes.get(CHORD_OCTAVE_DOWN);
                    const strUp = keyPressTimes.get(STRING_OCTAVE_UP), strDown = keyPressTimes.get(STRING_OCTAVE_DOWN);
                    if (chUp && chDown && Math.abs(chUp - chDown) < SIMULTANEOUS_PRESS_WINDOW) { fullChordOctaveOffset = 0; showNotification('Chord octave reset', 'info'); keyPressTimes.delete(CHORD_OCTAVE_UP); keyPressTimes.delete(CHORD_OCTAVE_DOWN); return; }
                    if (strUp && strDown && Math.abs(strUp - strDown) < SIMULTANEOUS_PRESS_WINDOW) { stringOctaveOffset = 0; showNotification('String octave reset', 'info'); keyPressTimes.delete(STRING_OCTAVE_UP); keyPressTimes.delete(STRING_OCTAVE_DOWN); return; }
                    if (pitch === CHORD_OCTAVE_UP) { fullChordOctaveOffset++; showNotification(`Chord Oct: ${fullChordOctaveOffset > 0 ? '+' : ''}${fullChordOctaveOffset}`, 'info'); return; }
                    if (pitch === CHORD_OCTAVE_DOWN) { fullChordOctaveOffset--; showNotification(`Chord Oct: ${fullChordOctaveOffset > 0 ? '+' : ''}${fullChordOctaveOffset}`, 'info'); return; }
                    if (pitch === STRING_OCTAVE_UP) { stringOctaveOffset++; showNotification(`String Oct: ${stringOctaveOffset > 0 ? '+' : ''}${stringOctaveOffset}`, 'info'); return; }
                    if (pitch === STRING_OCTAVE_DOWN) { stringOctaveOffset--; showNotification(`String Oct: ${stringOctaveOffset > 0 ? '+' : ''}${stringOctaveOffset}`, 'info'); return; }
                }
            }
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && pitch === CHORD_TRIGGER_TOGGLE && value > 0) { 
                isPadTriggerMode = !isPadTriggerMode; 
                showNotification(`Chord trigger ${isPadTriggerMode ? 'ON' : 'OFF'}`, 'info'); 
                if (isPadTriggerMode && activeStoragePadBitsPlayMode > 0 && Chords.pads[activeStoragePadBitsPlayMode]) {
                    handlePlayModeCombinationChange(); 
                } else if (!isPadTriggerMode && Chords.triggers['combo_chord']) { 
                     sendNoteOffs(Chords.triggers['combo_chord'], MIDI_CHANNEL_MAIN, 'chord');
                     delete Chords.triggers['combo_chord'];
                }
                return;
            }
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && pitch >= 60 && pitch <= 71 && value > 0) { 
                transposeOffset = pitch - 60; showNotification(`Transpose: ${transposeOffset}`, 'info');
                if (isPadTriggerMode && activeStoragePadBitsPlayMode > 0 && Chords.pads[activeStoragePadBitsPlayMode]) {
                    handlePlayModeCombinationChange();
                }
                return;
            }
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && value > 0) {
                let targetOutput = null, notesToPlay = [], triggerKey = pitch;
                if (STRING_TRIGGERS.includes(pitch) && Chords.string.length) {
                    let idx = STRING_TRIGGERS.indexOf(pitch); if (idx >= Chords.string.length) idx = Chords.string.length - 1;
                    notesToPlay = [Chords.string[idx] + transposeOffset + (stringOctaveOffset * 12)]; targetOutput = 'string';
                } else if (BASS_TRIGGERS.includes(pitch) && Chords.string.length) {
                    let idx = BASS_TRIGGERS.indexOf(pitch); if (idx < Chords.string.length) { notesToPlay = [Chords.string[idx] + transposeOffset + (stringOctaveOffset * 12) - 12]; targetOutput = 'bass';}
                } else if (pitch === FULL_CHORD && Chords.string.length) {
                    notesToPlay = Chords.string.map(n => n + transposeOffset + (fullChordOctaveOffset * 12)); targetOutput = 'chord';
                } else if (pitch === FULL_STRING && Chords.string.length) {
                    notesToPlay = Chords.string.map(n => n + transposeOffset + (stringOctaveOffset * 12)); targetOutput = 'string';
                }

                if (targetOutput && notesToPlay.length > 0) {
                    Chords.triggers[triggerKey] = notesToPlay; 
                    if (targetOutput === 'chord') { 
                        sendChord(notesToPlay, value, MIDI_CHANNEL_MAIN, targetOutput);
                        Chords.triggers[triggerKey] = [...currentPlayingChordNotes]; 
                    } else { 
                        send(notesToPlay.map(p => [MIDI_NOTE_ON | ((MIDI_CHANNEL_MAIN - 1) & 0x0F), p, value]), targetOutput);
                    }
                    return;
                }
            }
            if (type === MIDI_NOTE_OFF && channel === MIDI_CHANNEL_MAIN) {
                 let targetOutput = null;
                 if (STRING_TRIGGERS.includes(pitch)) targetOutput = 'string';
                 else if (BASS_TRIGGERS.includes(pitch)) targetOutput = 'bass';
                 else if (pitch === FULL_CHORD) targetOutput = 'chord';
                 else if (pitch === FULL_STRING) targetOutput = 'string';

                if (targetOutput && Chords.triggers[pitch]) {
                    sendNoteOffs(Chords.triggers[pitch], MIDI_CHANNEL_MAIN, targetOutput);
                    delete Chords.triggers[pitch];
                    return;
                }
            }
        }
    } catch (error) { showNotification('MIDI processing error: ' + error.message, 'error'); console.error("MIDI Processing Error: ", error); }
}
const PAD_MAP_1 = { 50: 36, 52: 37, 53: 38, 55: 39, 49: 40, 51: 41, 54: 42, 56: 43 };


function send(data, outputType = 'main') {
    const messages = Array.isArray(data[0]) ? data : [data];
    const output = currentOutputs[outputType];
    if (!output) return;
    if (outputType === 'main' && mode === MODE_PLAY && isMainOutputMuted) return; 
    try {
        messages.forEach(msg => {
            const LMsg = [...msg]; 
            if ((LMsg[0] & 0xF0) === MIDI_NOTE_OFF) LMsg[2] = 0; 
            output.send(LMsg);
            flashActivity(`${outputType}-output`);
            const [status, pitch, velocity] = LMsg;
            const type = status & 0xF0;
            if (type === MIDI_NOTE_ON || type === MIDI_NOTE_OFF) {
                updateKeyboard(pitch, type === MIDI_NOTE_ON && velocity > 0, outputType);
            }
        });
    } catch (error) {
        showNotification(`MIDI ${outputType} out err: ${error.message.substring(0,30)}`, 'warning');
    }
}

function sendChord(notes, vel, ch, outputType = 'chord') {
    const notesArray = Array.isArray(notes) ? notes : [notes]; 
    if (notesArray.length === 0) return;

    if (outputType === 'chord') {
        clearAllChordNotes(); 
        const notesWithVelocity = notesArray.map(notePitch => ({ pitch: notePitch, velocity: vel }));
        let processedNotes = notesWithVelocity;
        if (currentInversion > 0) {
            const basePitches = notesWithVelocity.map(n => n.pitch); 
            const invertedPitches = invertChord(basePitches, currentInversion);
            processedNotes = invertedPitches.map((p, index) => ({ pitch: p, velocity: notesWithVelocity[index]?.velocity || vel }));
        }
        const tiltedNotes = applyVelocityTilt(processedNotes, 0); 
        tiltedNotes.forEach(note => {
            send([MIDI_NOTE_ON | ((ch - 1) & 0x0F), note.pitch, note.velocity], outputType);
        });
        currentPlayingChordNotes = tiltedNotes.map(n => n.pitch); 
    } else { 
        notesArray.forEach(n => {
            const pitch = (typeof n === 'object' && 'pitch' in n) ? n.pitch : n;
            const velocity = (typeof n === 'object' && 'velocity' in n) ? n.velocity : vel;
            send([MIDI_NOTE_ON | ((ch - 1) & 0x0F), pitch, velocity], outputType);
        });
    }
}

function sendNoteOffs(notes, ch, outputType = 'chord') {
    const notesArray = Array.isArray(notes) ? notes : [notes];
    if (outputType === 'chord') { 
        clearAllChordNotes(); 
    } else { 
        notesArray.forEach(n => {
            const pitch = (typeof n === 'object' && 'pitch' in n) ? n.pitch : n;
            send([MIDI_NOTE_OFF | ((ch - 1) & 0x0F), pitch, 0], outputType);
        });
    }
}

            const saveIndicator = document.createElement('div');
            saveIndicator.className = 'save-indicator';
            saveIndicator.style.cssText = `position: fixed; bottom: 20px; left: 20px; background: rgba(76, 175, 80, 0.1); color: #4CAF50; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; opacity: 0; transition: opacity 0.3s;`;
            saveIndicator.textContent = '✓ Saved'; document.body.appendChild(saveIndicator);
            requestAnimationFrame(() => { saveIndicator.style.opacity = '1'; });
            setTimeout(() => { saveIndicator.style.opacity = '0'; setTimeout(() => saveIndicator.remove(), 300); }, 1500);
            resolve();
        };
        request.onerror = () => { showNotification('Error saving data', 'warning'); reject(request.error); };
    });
}
async function loadChordsFromDB() { 
    if (!db) await initDB(); 
    return new Promise((resolve, reject) => {
        let songName = getSongNameFromHash();
        if (!songName) {
            songName = 'DefaultSong';
            showNotification('No song selected, loading default.', 'info');
        }
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(songName); // songName is the keyPath now, so this remains correct
        request.onsuccess = () => {
            Chords.pads = {}; Chords.sequence = []; 
            const notesTextarea = document.getElementById('song-notes');
            if (request.result) {
                if (request.result.chords) Object.assign(Chords.pads, request.result.chords);
                if (request.result.sequence) Chords.sequence = request.result.sequence;
                if (notesTextarea) notesTextarea.value = request.result.notes || '';
                showNotification(`Loaded: ${songName}`, 'success');
            } else {
                showNotification(`No saved data for: ${songName}`, 'info');
                if (notesTextarea) notesTextarea.value = '';
            }
            updateStatus(); 
            resolve(request.result);
        };
        request.onerror = () => { showNotification('Error loading data', 'warning'); reject(request.error); };
    });
}

function loadChordFromSequence(index) { 
    const padNumberOrKey = Chords.sequence[index]; 
    const padData = Chords.pads[padNumberOrKey]; 
    if (padData) {
        Chords.string = padData.chord ? [...(padData.bass || []), ...padData.chord] : (Array.isArray(padData) ? [...padData] : []);
        updateStatus();
        showNotification(`Seq Load (Key: ${padNumberOrKey})`, 'info');
    } else {
        showNotification(`Seq Load Fail: No chord at key ${padNumberOrKey}`, 'warning');
    }
}

function clearAllChordNotes() {
    if (currentOutputs.chord) {
        currentPlayingChordNotes.forEach(note => { send([MIDI_NOTE_OFF | ((MIDI_CHANNEL_MAIN - 1) & 0x0F), note, 0], 'chord'); });
        for (let note = 0; note < 128; note++) { send([MIDI_NOTE_OFF | ((MIDI_CHANNEL_MAIN - 1) & 0x0F), note, 0], 'chord');} 
        currentPlayingChordNotes = [];
    }
}
function getMaxInversion() { 
    const currentChordBase = Chords.string.length > 0 ? Chords.string : Chords.record;
    return Math.max(0, currentChordBase.length - 1);
}

createPianoSections(); createPianoKeyboard(); addSongControls();
updateStatus(); 

// 3. Initialize MIDI System (FIX APPLIED HERE)
if (navigator.requestMIDIAccess) {
    try {
        const midiPromise = navigator.requestMIDIAccess();
        // Check if midiPromise is defined and has a .then method (is promise-like)
        if (midiPromise && typeof midiPromise.then === 'function') {
            midiPromise.then(onMIDISuccess, () => {
                // This is the promise rejection handler
                showNotification('Failed to get MIDI access (promise rejected or permission denied). Ensure HTTPS and grant permission.', 'error', 7000);
                alert("Failed to get MIDI access. MIDI features will be unavailable. Ensure you are on HTTPS and grant permission. Use Chrome or Edge.");
            });
        } else {
            // Handle cases where navigator.requestMIDIAccess() doesn't return a promise (non-standard behavior)
            showNotification('MIDI API (requestMIDIAccess) did not return a usable Promise. MIDI unavailable.', 'error', 7000);
            alert("Web MIDI API is in an unexpected state (requestMIDIAccess did not return a Promise). MIDI features will be unavailable. Try a different browser or check for extensions.");
        }
    } catch (error) {
        // This catch block handles synchronous errors if navigator.requestMIDIAccess() itself throws an error
        console.error("Synchronous error calling navigator.requestMIDIAccess:", error);
        showNotification('Error trying to access MIDI system (synchronous exception). MIDI unavailable.', 'error', 7000);
        alert("An error occurred while trying to initialize MIDI. MIDI features will be unavailable.");
    }
} else {
    showNotification('Web MIDI API not supported in this browser. Use Chrome or Edge.', 'error', 5000);
    alert("Web MIDI API not supported in this browser. MIDI features will be unavailable. Use Chrome or Edge.");
}

// 4. Initialize Database and Load Data
initDB().then(() => { 
    setupAutoLoadOnSongChange(); 
    loadChordsFromDB(); 
}).catch(error => { 
    console.error('Failed to initialize IndexedDB:', error);
    showNotification('Failed to initialize storage system.', 'error');
});
