// chord-name-detector.js

const NOTE_TO_SEMITONE = {
    'C': 0,  'C#': 1, 'Db': 1,
    'D': 2,  'D#': 3, 'Eb': 3,
    'E': 4,  'Fb': 4, 'E#': 5,
    'F': 5,  'F#': 6, 'Gb': 6,
    'G': 7,  'G#': 8, 'Ab': 8,
    'A': 9,  'A#': 10, 'Bb': 10,
    'B': 11, 'Cb': 11, 'B#': 0
};

const CHORD_PATTERNS = {
    'Major':            [0, 4, 7],
    'Minor':            [0, 3, 7],
    'Diminished':       [0, 3, 6],
    'Augmented':        [0, 4, 8],
    'Sus2':             [0, 2, 7],
    'Sus4':             [0, 5, 7],
    'Major 7th':        [0, 4, 7, 11],
    'Minor 7th':        [0, 3, 7, 10],
    'Dominant 7th':     [0, 4, 7, 10],
    'Half-Diminished':  [0, 3, 6, 10],
    'Diminished 7th':   [0, 3, 6, 9],
    'Minor-Major 7th':  [0, 3, 7, 11],
    'Aug-Major 7th':    [0, 4, 8, 11]
};

function normalizeNotes(notes) {
    const getPitchClass = note => note.replace(/[0-9]/g, '').toUpperCase();
    const semitones = notes.map(n => NOTE_TO_SEMITONE[getPitchClass(n)]);
    return [...new Set(semitones)];
}

function getIntervals(root, semitones) {
    return semitones.map(p => (p - root + 12) % 12).sort((a, b) => a - b);
}

function matchChord(intervals) {
    for (const [name, pattern] of Object.entries(CHORD_PATTERNS)) {
    if (pattern.length !== intervals.length) continue;
    if (pattern.every((val, i) => val === intervals[i])) return name;
    }
    return null;
}

function detectChord(notes) {
    const uniqueSemitones = normalizeNotes(notes);
    if (uniqueSemitones.length < 2) return null;

    for (let root of uniqueSemitones) {
    const intervals = getIntervals(root, uniqueSemitones);
    const chordName = matchChord(intervals);
    if (chordName) {
        const rootNote = Object.keys(NOTE_TO_SEMITONE)
        .find(k => NOTE_TO_SEMITONE[k] === root && !k.includes('b') && k.length <= 2);
        return `${rootNote} ${chordName}`;
    }
    }
    return 'Unknown Chord';
}

// Example usage:
if (typeof window !== 'undefined') {
    window.detectChord = detectChord;
} else {
    module.exports = { detectChord };
}

function applyVelocityTilt(chordNotes, cc75value) {
    if (!chordNotes || chordNotes.length === 0) return chordNotes;
    
    if (cc75value !== 0) { // Only update tilt amount if CC value is explicitly provided
        if (cc75value === TILT_CC_MAX) tiltCounter++;
        else if (cc75value === TILT_CC_MIN) tiltCounter--;
        else { tiltCounter = 0; }

        if (Math.abs(tiltCounter) >= TILT_THRESHOLD) {
            if (tiltCounter > 0) {
                tiltAmount = Math.max(TILT_MIN, tiltAmount - TILT_STEP);
            } else {
                tiltAmount = Math.min(TILT_MAX, tiltAmount + TILT_STEP);
            }
            tiltCounter = 0;
        }
        if (cc75value === TILT_CC_CENTER) {
            tiltAmount = 0.0;
            tiltCounter = 0;
        }
    }
    
    const sortedNotes = [...chordNotes].sort((a, b) => a.pitch - b.pitch);
    const pivotShift = tiltAmount * TILT_PIVOT_SHIFT;
    const centerPivot = (sortedNotes.length - 1) / 2;
    const currentPivot = Math.max(0, Math.min(sortedNotes.length - 1, centerPivot + pivotShift));
    
    tiltPivot = currentPivot; // Update global state for display
    updateTiltDisplay(); // Now update display after pivot is calculated or tiltAmount changed
    
    return sortedNotes.map((note, index) => {
        const velocityDelta = (index - currentPivot) * tiltAmount * TILT_VELOCITY_MULT;
        const newVelocity = Math.max(1, Math.min(127, note.velocity + velocityDelta));
        return { ...note, velocity: Math.round(newVelocity) };
    });
}

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 2);
        request.onerror = () => {
            showNotification('Failed to initialize storage: ' + request.error.message, 'warning');
            reject(request.error);
        };
        request.onsuccess = () => {
            db = request.result;
            resolve();
        };
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
            if (!db.objectStoreNames.contains(PORTS_STORE_NAME)) {
                db.createObjectStore(PORTS_STORE_NAME);
            }
        };
    });
}

async function savePortSelections() {
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(PORTS_STORE_NAME, 'readwrite');
        const store = tx.objectStore(PORTS_STORE_NAME);
        const portSelections = {
            input: currentInput ? currentInput.id : null,
            outputs: {
                main: currentOutputs.main ? currentOutputs.main.id : null,
                bass: currentOutputs.bass ? currentOutputs.bass.id : null,
                chord: currentOutputs.chord ? currentOutputs.chord.id : null,
                string: currentOutputs.string ? currentOutputs.string.id : null
            }
        };
        const request = store.put(portSelections, 'current');
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
    });
}

async function loadPortSelections() {
    if (!db) await initDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(PORTS_STORE_NAME, 'readonly');
        const store = tx.objectStore(PORTS_STORE_NAME);
        const request = store.get('current');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
}

async function refreshPortLists() {
    const inputsSel = document.getElementById('inputs');
    const outputsSel = document.getElementById('outputs'); // For main output
    
    if (!inputsSel || !outputsSel ) { // Check only essential selectors for now
        showNotification('Core MIDI selectors not found in DOM', 'warning');
        return;
    }

    inputsSel.innerHTML = '<option value="">Select MIDI Input</option>';
    outputsSel.innerHTML = '<option value="">Select Main MIDI Output</option>';
    // Clear other output selectors
    ['bass', 'chord', 'string'].forEach(type => {
        const selector = document.getElementById(`${type}-outputs`);
        if (selector) selector.innerHTML = '<option value="">Select ' + type.charAt(0).toUpperCase() + type.slice(1) + ' Output</option>';
    });
    
    let hasInputs = false;
    let hasOutputs = false;

    if (!midiAccess) {
        showNotification('MIDI Access not available for refreshing ports.', 'warning');
        return;
    }

    for (let inp of midiAccess.inputs.values()) {
        hasInputs = true;
        const opt = new Option(inp.name, inp.id);
        if (currentInput && inp.id === currentInput.id) opt.selected = true;
        inputsSel.add(opt);
    }

    for (let outp of midiAccess.outputs.values()) {
        hasOutputs = true;
        const optBase = new Option(outp.name, outp.id);
        outputsSel.add(optBase.cloneNode(true)); // Main output
        ['bass', 'chord', 'string'].forEach(type => {
            const selector = document.getElementById(`${type}-outputs`);
            if (selector) selector.add(optBase.cloneNode(true));
        });
    }

    inputsSel.disabled = !hasInputs;
    outputsSel.disabled = !hasOutputs;
    ['bass', 'chord', 'string'].forEach(type => {
        const selector = document.getElementById(`${type}-outputs`);
        if (selector) selector.disabled = !hasOutputs;
    });

    updateMIDIStatus(); // Update visual status indicators

    try {
        const savedPorts = await loadPortSelections();
        if (savedPorts) {
            if (savedPorts.input && midiAccess.inputs.has(savedPorts.input)) {
                selectInput(savedPorts.input);
                inputsSel.value = savedPorts.input;
            }
            if (savedPorts.outputs) {
                Object.entries(savedPorts.outputs).forEach(([type, id]) => {
                    if (id && midiAccess.outputs.has(id)) {
                        selectOutput(type, id);
                        const selector = document.getElementById(type === 'main' ? 'outputs' : `${type}-outputs`);
                        if (selector) selector.value = id;
                    }
                });
            }
        } else { // First run - use defaults
            if (hasInputs) {
                for (let inp of midiAccess.inputs.values()) {
                    if (inp.name === DEFAULT_INPUT_NAME) {
                        selectInput(inp.id); inputsSel.value = inp.id; break;
                    }
                }
            }
            if (hasOutputs) {
                 Object.entries(DEFAULT_OUTPUT_NAMES).forEach(([type, name]) => {
                    for (let outp of midiAccess.outputs.values()) {
                        if (outp.name === name) {
                            selectOutput(type, outp.id);
                            const selector = document.getElementById(type === 'main' ? 'outputs' : `${type}-outputs`);
                            if (selector) selector.value = outp.id;
                            break; 
                        }
                    }
                });
            }
        }
    } catch (error) {
        console.error('Error loading port selections:', error);
        showNotification('Error loading saved port selections', 'warning');
    }

    inputsSel.onchange = () => {
        selectInput(inputsSel.value);
        savePortSelections();
        showNotification(`Input: ${inputsSel.value ? inputsSel.options[inputsSel.selectedIndex].text : 'None'}`, 'info');
        updateMIDIStatus();
    };
    outputsSel.onchange = () => { // Main output
        selectOutput('main', outputsSel.value);
        savePortSelections();
        showNotification(`Main Out: ${outputsSel.value ? outputsSel.options[outputsSel.selectedIndex].text : 'None'}`, 'info');
        updateMIDIStatus();
    };
    ['bass', 'chord', 'string'].forEach(type => {
        const selector = document.getElementById(`${type}-outputs`);
        if (selector) {
            selector.onchange = () => {
                selectOutput(type, selector.value);
                savePortSelections();
                showNotification(`${type.charAt(0).toUpperCase() + type.slice(1)} Out: ${selector.value ? selector.options[selector.selectedIndex].text : 'None'}`, 'info');
                updateMIDIStatus();
            };
        }
    });
}

function selectInput(id) {
    if (currentInput && currentInput.id === id) return;
    if (currentInput) currentInput.onmidimessage = null;
    
    currentInput = id ? midiAccess.inputs.get(id) : null;
    if (currentInput) {
        currentInput.onmidimessage = handleMIDIMessage;
        trackPortState(currentInput);
        const mainPianoSection = document.querySelector('#main-piano')?.parentElement;
        if (mainPianoSection) {
            const titleEl = mainPianoSection.querySelector('h3');
            if (titleEl) titleEl.textContent = 'Controller: ' + currentInput.name;
        }
    } else {
         const mainPianoSection = document.querySelector('#main-piano')?.parentElement;
        if (mainPianoSection) {
            const titleEl = mainPianoSection.querySelector('h3');
            if (titleEl) titleEl.textContent = 'Controller: MIDI Input';
        }
    }
    updateMIDIStatus();
}

function selectOutput(type, id) {
    if (currentOutputs[type] && currentOutputs[type].id === id) return;
    currentOutputs[type] = id ? midiAccess.outputs.get(id) : null;
    if (currentOutputs[type]) trackPortState(currentOutputs[type]);
    updateMIDIStatus();
}

function onMIDISuccess(access) {
    midiAccess = access;
    for (let port of midiAccess.inputs.values()) trackPortState(port);
    for (let port of midiAccess.outputs.values()) trackPortState(port);
    
    refreshPortLists(); // Now safe to call as elements will be found or handled
    showNotification('MIDI system initialized', 'success');

    midiAccess.onstatechange = (e) => {
        const port = e.port;
        const portType = port.type.charAt(0).toUpperCase() + port.type.slice(1);
        if (portChangeTimeout) clearTimeout(portChangeTimeout);
        portChangeTimeout = setTimeout(() => {
            showNotification(`${portType} port '${port.name}' ${port.state}`, port.state === 'connected' ? 'info' : 'warning');
            if (port.state !== lastPortStates.get(port.id)) {
                trackPortState(port);
                refreshPortLists();
            }
        }, PORT_CHANGE_DELAY);
    };
}

const PAD_MAP_1 = { 50: 36, 52: 37, 53: 38, 55: 39, 49: 40, 51: 41, 54: 42, 56: 43 };

class ButtonManager {
    constructor() {
        this.buttons = new Map(); this.pressTimes = new Map(); this.holdIntervals = new Map();
        this.simultaneousGroups = new Map();
        this.HOLD_THRESHOLD = RECORD_HOLD_THRESHOLD; this.SIMULTANEOUS_WINDOW = SIMULTANEOUS_PRESS_WINDOW;
        this.PRESS_THRESHOLD = VELOCITY_THRESHOLD;
    }
    registerButton(cc, config) {
        this.buttons.set(cc, {
            onPress: config.onPress || (() => {}), onRelease: config.onRelease || (() => {}),
            onHold: config.onHold || (() => {}), holdThreshold: config.holdThreshold || this.HOLD_THRESHOLD,
            simultaneousGroup: config.simultaneousGroup || null
        });
    }
    registerSimultaneousGroup(groupId, buttons, handler) {
        this.simultaneousGroups.set(groupId, { buttons: new Set(buttons), handler: handler });
    }
    handleMessage(status, data1, data2) {
        const type = status & 0xF0; const channel = (status & 0x0F) + 1;
        const pitch = data1; const value = data2;
        if (type !== 0xB0 || channel !== 1) return; // Only CCs on Ch1 for buttons
        const button = this.buttons.get(pitch); if (!button) return;
        if (value >= this.PRESS_THRESHOLD) this.handlePress(pitch, button);
        else this.handleRelease(pitch, button);
    }
    handlePress(pitch, button) {
        const now = Date.now(); this.pressTimes.set(pitch, now);
        if (button.simultaneousGroup) this.checkSimultaneousPress(button.simultaneousGroup);
        if (button.onHold) {
            if (this.holdIntervals.has(pitch)) clearInterval(this.holdIntervals.get(pitch));
            const interval = setInterval(() => {
                const pressDuration = Date.now() - (this.pressTimes.get(pitch) || now);
                if (pressDuration >= button.holdThreshold) {
                    button.onHold(); clearInterval(interval); this.holdIntervals.delete(pitch);
                }
            }, 100);
            this.holdIntervals.set(pitch, interval);
        }
        button.onPress();
    }
    handleRelease(pitch, button) {
        if (this.holdIntervals.has(pitch)) {
            clearInterval(this.holdIntervals.get(pitch)); this.holdIntervals.delete(pitch);
        }
        const pressTime = this.pressTimes.get(pitch);
        const pressDuration = pressTime ? Date.now() - pressTime : 0;
        this.pressTimes.delete(pitch);
        button.onRelease(pressDuration);
    }
    checkSimultaneousPress(groupId) {
        const group = this.simultaneousGroups.get(groupId); if (!group) return;
        const now = Date.now();
        const pressedButtons = Array.from(group.buttons)
            .filter(cc => this.pressTimes.has(cc) && (now - this.pressTimes.get(cc) < this.SIMULTANEOUS_WINDOW));
        if (pressedButtons.length === group.buttons.size) group.handler();
    }
}

        }
    },
    onRelease: (duration) => {
        if (isRecordingSequence) {

                Chords.sequence.push([...pendingSequenceChord]);

            //     Chords.sequence.push([...pendingSequenceChord]);

        updateStatus(); // Update status to reflect cleared Chords.record or mode changes

        // else if (mode === MODE_RECORD) {
        //   isArmingSave = false; // If hold doesn't do anything else, disarm.

    }
});

function handleMIDIMessage(ev) {
    try {
        if (!ev.data || ev.data.length < 2) { showNotification('Invalid MIDI message', 'warning'); return; }
        logMIDIMessage(ev); flashActivity('input');
        const [status, data1, data2] = ev.data;

        // Handle button CCs first, regardless of mode
        buttonManager.handleMessage(status, data1, data2);

        // Explicit STOP mode handling: passthrough all MIDI and return
        if (mode === MODE_STOP) {
            send(ev.data, 'main');
            return;
        }
        
        const type = status & 0xF0; const channel = (status & 0x0F) + 1;
        const pitch = data1; const value = data2;

        if (type === MIDI_CONTROL_CHANGE && channel === MIDI_CHANNEL_MAIN && pitch === INVERSION_CC) {
            const maxInversion = getMaxInversion();
            if (value === 127) inversionCounter++; else if (value === 1) inversionCounter--; else inversionCounter = 0;

            if (Math.abs(inversionCounter) >= INVERSION_THRESHOLD) {
                currentInversion = (currentInversion + (inversionCounter > 0 ? 1 : -1) + maxInversion + 1) % (maxInversion + 1);
                inversionCounter = 0; clearAllChordNotes(); updateInversionDisplay();
                if (isPadTriggerMode && Chords.string.length > 0) {
                    const chordNotes = Chords.string.map(n => ({ pitch: n + transposeOffset + (fullChordOctaveOffset * 12), velocity: 100 }));
                    const tiltedNotes = applyVelocityTilt(chordNotes, 0); // Apply current tilt, don't change it with 0
                    Chords.triggers[FULL_CHORD] = tiltedNotes.map(n => n.pitch);
                    sendChord(tiltedNotes.map(n => n.pitch), tiltedNotes[0]?.velocity || 100, MIDI_CHANNEL_MAIN, 'chord');
                }
            }
            return;
        }

        if (type === MIDI_CONTROL_CHANGE && channel === MIDI_CHANNEL_MAIN && pitch === VELOCITY_TILT_CC) {
            if (Chords.string.length > 0) {
                // applyVelocityTilt will update tiltAmount if value is not 0
                // and will always update display
                const testChord = Chords.string.map(n => ({ pitch: n + transposeOffset + (fullChordOctaveOffset * 12), velocity: 100 }));
                applyVelocityTilt(testChord, value); // Pass CC value to potentially update tiltAmount
            }
            return;
        }
        
        if (type === MIDI_PITCH_BEND || (type === MIDI_CONTROL_CHANGE && data1 === 1)) { // Mod wheel CC 1
            ['main', 'bass', 'chord', 'string'].forEach(port => send(ev.data, port));
            return;
        }

        if (type === MIDI_NOTE_ON || type === MIDI_NOTE_OFF) {
            updateKeyboard(pitch, type === MIDI_NOTE_ON && value > 0); // Update main keyboard input
        }

        if (channel === MIDI_CHANNEL_DRUMS) { send(ev.data, 'main'); return; } // Drum channel passthrough

        if (isRecordingSequence && type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && value > 0) {
            const padNumber = PAD_MAP_1[pitch] || pitch;
            if (Chords.pads[padNumber] && Chords.sequence.length < MAX_SEQUENCE_LENGTH) {
                Chords.sequence.push(padNumber); showNotification(`Seq: ${padNumber} (${Chords.sequence.length}/${MAX_SEQUENCE_LENGTH})`, 'info');
            }
            return;
        }

        if (mode === MODE_RECORD) {
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN) {
                // Check if save is armed AND if the incoming note is a pad press
                const potentialPadKey = PAD_MAP_1[pitch] || pitch; // Check if it's a pad key
                // A simple check to see if potentialPadKey is in the values of PAD_MAP_1 or similar range if not mapped.
                // This is a heuristic. A more robust check might involve a dedicated list of pad notes.
                // For now, we assume any note can be a pad if PAD_MAP_1 doesn't map it.
                // Consider if a note is more likely a musical note or a pad key.
                // Let's assume for now that if isArmingSave is true, any NOTE_ON on channel 1 could be a pad.
                // A better approach would be to have a distinct list of notes that are pads.
                // For this iteration, we'll use the original PAD_MAP_1 or the pitch itself.

                if (isArmingSave === true) {
                    // If arming save, interpret NOTE_ON as pad selection
                    selectedStoragePad = potentialPadKey;
                    showNotification(`Pad ${selectedStoragePad} selected for save. Release Record to confirm.`, 'info');
                    // Do not send this note to main output or record it as a musical note
                    flashActivity('input'); // Still flash input activity
                    updateKeyboard(pitch, true); // Show the pad press on the main keyboard UI if desired
                    return; // Consume the event
                } else {
                    // Not arming save, so treat as musical note input for Chords.record
                    send(ev.data, 'main'); // Passthrough to main output
                    const noteIndex = Chords.record.indexOf(pitch);
                    if (noteIndex === -1) {
                        if (Chords.record.length < MAX_CHORD_NOTES) {
                            Chords.record.push(pitch);
                            Chords.record.sort((a, b) => a - b);
                        }
                    } else {
                        Chords.record.splice(noteIndex, 1);
                    }
                    updateStatus();
                    showNotification(`${noteIndex === -1 ? 'Added' : 'Removed'} ${getNoteNameFromMIDI(pitch)} to current chord.`, 'info');

                    if (isRecordingSequence) {
                        pendingSequenceChord = [...Chords.record]; // Copy notes to pendingSequenceChord
                        isWaitingForSequenceStepConfirmation = true;
                        // Update UI/notify about the pending chord
                        let chordNotesText = pendingSequenceChord.length > 0 
                            ? pendingSequenceChord.map(note => getNoteNameFromMIDI(note)).join(' ') 
                            : 'No Chord';
                        let chordName = pendingSequenceChord.length > 0 
                            ? (detectChord(pendingSequenceChord.map(note => getNoteNameFromMIDI(note))) || 'Unknown Chord') 
                            : '-';
                        const nextStepNumber = Chords.sequence.length + 1;
                        showNotification(`Step ${nextStepNumber} pending: ${chordName} (${chordNotesText}). Press DATA1+DATA2 to record.`, 'info', 4000);
                    }
                    return;
                }
            } else if (type === MIDI_NOTE_OFF && channel === MIDI_CHANNEL_MAIN) {
                // Note OFF messages
                if (isArmingSave === true) {
                    // If arming save, NOTE_OFF for pads are generally ignored, or could potentially deselect a pad.
                    // For now, ignore.
                    flashActivity('input');
                    updateKeyboard(pitch, false);
                    return;
                } else {
                    // Pass through NOTE_OFF if not arming save (for musical notes)
                    send(ev.data, 'main');
                    // No direct change to Chords.record on NOTE_OFF in this design
                    return;
                }
            } else if (channel === MIDI_CHANNEL_MAIN) { // Other CCs or message types on main channel
                // The following block has been removed as it's redundant with ButtonManager's 'sequenceStepAdvance' group:
                // if (isRecordingSequence && type === MIDI_CONTROL_CHANGE && channel === MIDI_CHANNEL_MAIN && pitch === sequenceNextCC && value === 127) {
                //     if (pendingSequenceChord && pendingSequenceChord.length > 0) {
                //         Chords.sequence.push([...pendingSequenceChord]);
                //         pendingSequenceChord = null;
                //         showNotification(`Step recorded (${Chords.sequence.length})`, 'success');
                //     } else {
                //         showNotification('No chord selected for this step', 'warning');
                //     }
                //     return;
                // }

                // General passthrough for other messages on the main channel if not arming save
                if (!isArmingSave) {
                     send(ev.data, 'main');
                }
                return;
            }
            // Messages on other channels or unhandled types on main channel in MODE_RECORD are implicitly dropped.
            return; // Ensure other messages don't leak if not explicitly handled.
        }

        if (mode === MODE_PLAY) {
            // Octave controls (Note ON only)
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && value > 0) {
                const now = Date.now();
                if ([CHORD_OCTAVE_UP, CHORD_OCTAVE_DOWN, STRING_OCTAVE_UP, STRING_OCTAVE_DOWN].includes(pitch)) {
                    keyPressTimes.set(pitch, now);
                    const chUp = keyPressTimes.get(CHORD_OCTAVE_UP), chDown = keyPressTimes.get(CHORD_OCTAVE_DOWN);
                    const strUp = keyPressTimes.get(STRING_OCTAVE_UP), strDown = keyPressTimes.get(STRING_OCTAVE_DOWN);
                    if (chUp && chDown && Math.abs(chUp - chDown) < SIMULTANEOUS_PRESS_WINDOW) {
                        fullChordOctaveOffset = 0; showNotification('Chord octave reset', 'info');
                        keyPressTimes.delete(CHORD_OCTAVE_UP); keyPressTimes.delete(CHORD_OCTAVE_DOWN); return;
                    }
                    if (strUp && strDown && Math.abs(strUp - strDown) < SIMULTANEOUS_PRESS_WINDOW) {
                        stringOctaveOffset = 0; showNotification('String octave reset', 'info');
                        keyPressTimes.delete(STRING_OCTAVE_UP); keyPressTimes.delete(STRING_OCTAVE_DOWN); return;
                    }
                    if (pitch === CHORD_OCTAVE_UP) { fullChordOctaveOffset++; showNotification(`Chord Oct: ${fullChordOctaveOffset > 0 ? '+' : ''}${fullChordOctaveOffset}`, 'info'); return; }
                    if (pitch === CHORD_OCTAVE_DOWN) { fullChordOctaveOffset--; showNotification(`Chord Oct: ${fullChordOctaveOffset > 0 ? '+' : ''}${fullChordOctaveOffset}`, 'info'); return; }
                    if (pitch === STRING_OCTAVE_UP) { stringOctaveOffset++; showNotification(`String Oct: ${stringOctaveOffset > 0 ? '+' : ''}${stringOctaveOffset}`, 'info'); return; }
                    if (pitch === STRING_OCTAVE_DOWN) { stringOctaveOffset--; showNotification(`String Oct: ${stringOctaveOffset > 0 ? '+' : ''}${stringOctaveOffset}`, 'info'); return; }
                }
            }
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && pitch === CHORD_TRIGGER_TOGGLE) {
                isPadTriggerMode = !isPadTriggerMode; showNotification(`Chord trigger ${isPadTriggerMode ? 'ON' : 'OFF'}`, 'info'); return;
            }

            // Pad handling (load/trigger)
            if ((type === MIDI_NOTE_ON || type === MIDI_NOTE_OFF) && (channel === MIDI_CHANNEL_DRUMS || (channel === MIDI_CHANNEL_MAIN && PAD_MAP_1[pitch]))) {
                const padNumber = channel === MIDI_CHANNEL_DRUMS ? pitch : PAD_MAP_1[pitch];
                const padData = Chords.pads[padNumber];
                if (!padData || !padData.chord || padData.chord.length === 0) {
                    if (type === MIDI_NOTE_ON && value > 0) showNotification(`Pad ${padNumber} empty`, 'warning');
                    return; // Block message for empty pads
                }

                if (type === MIDI_NOTE_ON) { // Note ON for pad
                    Chords.string = [...(padData.bass || []), ...padData.chord]; // Load chord
                    if (isRecordingSequence) {
                        // In sequence record mode, set pending chord to current selection
                        pendingSequenceChord = [...Chords.string];
                    }
                    if (isPadTriggerMode) {
                        const transposedChord = Chords.string.map(n => n + transposeOffset + (fullChordOctaveOffset * 12));
                        const notesToPlay = transposedChord.map(p => ({ pitch: p, velocity: value }));
                        // Inversion and tilt are handled by sendChord
                        Chords.triggers[padNumber] = notesToPlay.map(n => n.pitch); // Store raw pitches for note-off
                        sendChord(notesToPlay.map(n => n.pitch), value, MIDI_CHANNEL_MAIN, 'chord');
                    }
                    updateStatus(); showNotification(`Loaded pad ${padNumber}${isPadTriggerMode ? ' (triggered)' : ''}`, 'info');
                    return;
                } else { // Note OFF for pad
                    if (isPadTriggerMode && Chords.triggers[padNumber]) {
                        sendNoteOffs(Chords.triggers[padNumber], MIDI_CHANNEL_MAIN, 'chord');
                        delete Chords.triggers[padNumber];
                    }
                    return;
                }
            }

            // Transpose keys (60-71)
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN && pitch >= 60 && pitch <= 71) {
                transposeOffset = pitch - 60; showNotification(`Transpose: ${transposeOffset}`, 'info');
                if (isPadTriggerMode && Chords.string.length > 0) {
                    const baseNotes = Chords.string.map(n => n + transposeOffset + (fullChordOctaveOffset * 12));
                    const notesToPlay = baseNotes.map(p => ({ pitch: p, velocity: value }));
                    Chords.triggers[pitch] = notesToPlay.map(n => n.pitch); // Store raw pitches for note-off
                    sendChord(notesToPlay.map(n => n.pitch), value, MIDI_CHANNEL_MAIN, 'chord');
                }
                return;
            }
            if (type === MIDI_NOTE_OFF && channel === MIDI_CHANNEL_MAIN && pitch >= 60 && pitch <= 71) {
                if (isPadTriggerMode && Chords.triggers[pitch]) {
                    sendNoteOffs(Chords.triggers[pitch], MIDI_CHANNEL_MAIN, 'chord');
                    delete Chords.triggers[pitch];
                }
                return;
            }

            // String/Bass/Full Chord Triggers
            if (type === MIDI_NOTE_ON && channel === MIDI_CHANNEL_MAIN) {
                let targetOutput = null, notesToPlay = [], triggerKey = pitch;
                if (STRING_TRIGGERS.includes(pitch) && Chords.string.length) {
                    let idx = STRING_TRIGGERS.indexOf(pitch);
                    if (idx >= Chords.string.length) idx = Chords.string.length - 1;
                    notesToPlay = [Chords.string[idx] + transposeOffset + (stringOctaveOffset * 12)];
                    targetOutput = 'string';
                } else if (BASS_TRIGGERS.includes(pitch) && Chords.string.length) {
                    let idx = BASS_TRIGGERS.indexOf(pitch);
                    if (idx < Chords.string.length) { // Ensure index is valid
                         notesToPlay = [Chords.string[idx] + transposeOffset + (stringOctaveOffset * 12) - 12]; // Bass is octave down
                         targetOutput = 'bass';
                    }
                } else if (pitch === FULL_CHORD && Chords.string.length) {
                    notesToPlay = Chords.string.map(n => n + transposeOffset + (fullChordOctaveOffset * 12));
                    targetOutput = 'chord';
                } else if (pitch === FULL_STRING && Chords.string.length) {
                    notesToPlay = Chords.string.map(n => n + transposeOffset + (stringOctaveOffset * 12));
                    targetOutput = 'string';
                }

                if (targetOutput && notesToPlay.length > 0) {
                    Chords.triggers[triggerKey] = notesToPlay; // Store raw pitches for note-off
                    sendChord(notesToPlay, value, MIDI_CHANNEL_MAIN, targetOutput);
                    return;
                }
            }
            if (type === MIDI_NOTE_OFF && channel === MIDI_CHANNEL_MAIN) {
                 let targetOutput = null;
                 if (STRING_TRIGGERS.includes(pitch)) targetOutput = 'string';
                 else if (BASS_TRIGGERS.includes(pitch)) targetOutput = 'bass';
                 else if (pitch === FULL_CHORD) targetOutput = 'chord';
                 else if (pitch === FULL_STRING) targetOutput = 'string';

                if (targetOutput && Chords.triggers[pitch]) {
                    sendNoteOffs(Chords.triggers[pitch], MIDI_CHANNEL_MAIN, targetOutput);
                    delete Chords.triggers[pitch];
                    return;
                }
            }
            // If no specific PLAY mode action taken, MIDI message is currently dropped
            // as there is no final passthrough in PLAY mode. This is by design of previous structure.
            // If general passthrough is desired in PLAY mode for unmapped keys, it needs to be added here.
        }
        // Messages not handled by STOP, RECORD, or PLAY logic (e.g. other CCs not managed by ButtonManager)
        // will be dropped unless a specific passthrough is added here or at the end.
        // For now, this seems fine as ButtonManager handles its CCs, and other logic handles notes/specific CCs.

    } catch (error) {
        showNotification('MIDI processing error: ' + error.message, 'error'); // Changed type to error
        console.error("MIDI Processing Error: ", error);
    }
}
// Removed final send(ev.data, 'main') as passthrough is handled per mode.

function send(data, outputType = 'main') {
    const output = currentOutputs[outputType];
    if (!output) return;
    if (outputType === 'main' && mode === MODE_PLAY && isMainOutputMuted) return; // Mute main output in play mode if muted
    
    try {
        if ((data[0] & 0xF0) === MIDI_NOTE_OFF) data[2] = 0;
        output.send(data);
        flashActivity(`${outputType}-output`);
        const [status, pitch, velocity] = data;
        const type = status & 0xF0;
        if (type === MIDI_NOTE_ON || type === MIDI_NOTE_OFF) {
            updateKeyboard(pitch, type === MIDI_NOTE_ON && velocity > 0, outputType);
        }
    } catch (error) {
        showNotification(`MIDI ${outputType} out err: ${error.message.substring(0,30)}`, 'warning');
    }
}

function sendChord(notes, vel, ch, outputType = 'chord') {
    const notesArray = Array.isArray(notes) ? notes : [notes]; // Ensure notes is an array
    if (notesArray.length === 0) return;

    if (outputType === 'chord') {
        // const now = Date.now();
        // STUCK_NOTE_TIMEOUT logic commented out as it was potentially problematic
        // if (now - lastChordChangeTime > STUCK_NOTE_TIMEOUT) {
        //     clearAllChordNotes();
        // }
        // lastChordChangeTime = now;

        clearAllChordNotes(); // Clear previous chord notes from 'chord' output

        const notesWithVelocity = notesArray.map(note => (typeof note === 'object' && 'velocity' in note) ? note : { pitch: note, velocity: vel });
        
        let processedNotes = notesWithVelocity;
        if (currentInversion > 0) {
            const invertedPitches = invertChord(notesWithVelocity.map(n => n.pitch), currentInversion);
            processedNotes = invertedPitches.map((pitch, index) => ({ pitch: pitch, velocity: notesWithVelocity[index]?.velocity || vel }));
        }
        
        const tiltedNotes = applyVelocityTilt(processedNotes, 0); // Apply current tilt, 0 means don't change tilt amount

        tiltedNotes.forEach(note => {
            send([MIDI_NOTE_ON | ((ch - 1) & 0x0F), note.pitch, note.velocity], outputType);
            // updateKeyboard handled by send()
        });
        currentPlayingChordNotes = tiltedNotes.map(n => n.pitch);
    } else { // For 'string', 'bass' outputs
        notesArray.forEach(n => {
            const pitch = (typeof n === 'object' && 'pitch' in n) ? n.pitch : n;
            const velocity = (typeof n === 'object' && 'velocity' in n) ? n.velocity : vel;
            send([MIDI_NOTE_ON | ((ch - 1) & 0x0F), pitch, velocity], outputType);
             // updateKeyboard handled by send()
        });
    }
}

function sendNoteOffs(notes, ch, outputType = 'chord') {
    const notesArray = Array.isArray(notes) ? notes : [notes];
    if (outputType === 'chord') {
        clearAllChordNotes(); // More robust for chord output
    } else {
        notesArray.forEach(n => {
            const pitch = (typeof n === 'object' && 'pitch' in n) ? n.pitch : n;
            send([MIDI_NOTE_OFF | ((ch - 1) & 0x0F), pitch, 0], outputType);
            // updateKeyboard handled by send()
        });
    }
}

const pianoKeyElements = {};
function createPianoKeyboard() {
    const startNote = 21, endNote = 108;
    const whiteKeyWidth = 24, whiteKeyHeight = 120;
    const blackKeyWidth = 16, blackKeyHeight = 80;
    
    ['current-piano', 'main-piano', 'bass-piano', 'chord-piano', 'string-piano'].forEach(pianoId => {
        const pianoContainer = document.getElementById(pianoId);
        if (!pianoContainer) { console.warn(`Piano container ${pianoId} not found`); return; }

        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const totalWhiteKeys = countWhiteKeys(startNote, endNote);
        svg.setAttribute('width', totalWhiteKeys * whiteKeyWidth + 2);
        svg.setAttribute('height', whiteKeyHeight + 2);
        pianoKeyElements[pianoId] = {};
        const whiteKeysGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const blackKeysGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        let whiteKeyIndex = 0;
        for (let note = startNote; note <= endNote; note++) {
            const noteName = getNoteNameFromMIDI(note); const isBlack = noteName.includes('#');
            const keyGroup = isBlack ? blackKeysGroup : whiteKeysGroup;
            const key = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            key.dataset.note = note; pianoKeyElements[pianoId][note] = key;
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute('class', 'key-text'); text.textContent = noteName;
            if (!isBlack) {
                key.setAttribute('x', whiteKeyIndex * whiteKeyWidth + 1); key.setAttribute('y', 1);
                key.setAttribute('width', whiteKeyWidth - 1); key.setAttribute('height', whiteKeyHeight);
                key.setAttribute('class', 'piano-key white');
                text.setAttribute('x', whiteKeyIndex * whiteKeyWidth + whiteKeyWidth/2);
                text.setAttribute('y', whiteKeyHeight - 5); text.setAttribute('text-anchor', 'middle');
                whiteKeyIndex++;
            } else {
                const prevWhiteKeyX = (whiteKeyIndex - 1) * whiteKeyWidth;
                key.setAttribute('x', prevWhiteKeyX + whiteKeyWidth - blackKeyWidth/2); key.setAttribute('y', 1);
                key.setAttribute('width', blackKeyWidth); key.setAttribute('height', blackKeyHeight);
                key.setAttribute('class', 'piano-key black');
                text.setAttribute('x', prevWhiteKeyX + whiteKeyWidth);
                text.setAttribute('y', blackKeyHeight - 5); text.setAttribute('text-anchor', 'middle');
                text.setAttribute('fill', '#fff');
            }
            keyGroup.appendChild(key); keyGroup.appendChild(text);
        }
        svg.appendChild(whiteKeysGroup); svg.appendChild(blackKeysGroup);
        pianoContainer.appendChild(svg);
    });
}
function countWhiteKeys(startNote, endNote) {
    let count = 0; for (let note = startNote; note <= endNote; note++) if (!getNoteNameFromMIDI(note).includes('#')) count++; return count;
}

function getSongNameFromHash() {

async function saveChordsToDB() {
    if (!db) await initDB(); // Should not happen if initDB is called first
    return new Promise((resolve, reject) => {
        const songName = getSongNameFromHash();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const notesArea = document.getElementById('song-notes');
        const notes = notesArea ? notesArea.value : '';
        const data = { chords: Chords.pads, notes, sequence: Chords.sequence };
        const request = store.put(data, songName);
        request.onsuccess = () => {
            const saveIndicator = document.createElement('div');
            saveIndicator.className = 'save-indicator';
            saveIndicator.style.cssText = `position: fixed; bottom: 20px; left: 20px; background: rgba(76, 175, 80, 0.1); color: #4CAF50; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; opacity: 0; transition: opacity 0.3s;`;
            saveIndicator.textContent = '✓ Saved'; document.body.appendChild(saveIndicator);
            requestAnimationFrame(() => { saveIndicator.style.opacity = '1'; });
            setTimeout(() => { saveIndicator.style.opacity = '0'; setTimeout(() => saveIndicator.remove(), 300); }, 1500);
            resolve();
        };
        request.onerror = () => { showNotification('Error saving data', 'warning'); reject(request.error); };
    });
}
async function loadChordsFromDB() {
    if (!db) await initDB(); // Should not happen
    return new Promise((resolve, reject) => {
        const songName = getSongNameFromHash();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(songName);
        request.onsuccess = () => {
            Chords.pads = {}; Chords.sequence = []; // Clear existing
            const notesTextarea = document.getElementById('song-notes');
            if (request.result) {
                if (request.result.chords) Object.assign(Chords.pads, request.result.chords);
                if (request.result.sequence) Chords.sequence = request.result.sequence;
                if (notesTextarea) notesTextarea.value = request.result.notes || '';
                showNotification(`Loaded: ${songName}`, 'success');
            } else {
                showNotification(`No saved data for: ${songName}`, 'info');
                if (notesTextarea) notesTextarea.value = '';
            }
            updateStatus(); // Crucial: update UI after loading
            resolve(request.result);
        };
        request.onerror = () => { showNotification('Error loading data', 'warning'); reject(request.error); };
    });
}

function loadChordFromSequence(index) {
    const padNumber = Chords.sequence[index];
    if (Chords.pads[padNumber]) {
        const pad = Chords.pads[padNumber];
        Chords.string = pad.chord ? [...(pad.bass || []), ...pad.chord] : (Array.isArray(pad) ? [...pad] : []);
        updateStatus();
        showNotification(`Seq Load: ${index + 1}/${Chords.sequence.length}`, 'info');
    }
}

let lastChordChangeTime = 0; // Used by commented-out STUCK_NOTE_TIMEOUT logic
const STUCK_NOTE_TIMEOUT = 1000;

function clearAllChordNotes() {
    if (currentOutputs.chord) {
        currentPlayingChordNotes.forEach(note => {
            send([MIDI_NOTE_OFF | ((MIDI_CHANNEL_MAIN - 1) & 0x0F), note, 0], 'chord');
            // updateKeyboard(note, false, 'chord'); // Handled by send()
        });
        for (let note = 0; note < 128; note++) { // Panic all notes on chord channel
            send([MIDI_NOTE_OFF | ((MIDI_CHANNEL_MAIN - 1) & 0x0F), note, 0], 'chord');
            // updateKeyboard(note, false, 'chord'); // Handled by send()
        }
        currentPlayingChordNotes = [];
    }
}
function getMaxInversion() {
    const currentChordBase = Chords.string.length > 0 ? Chords.string : Chords.record;
    return Math.max(0, currentChordBase.length - 1);
}
