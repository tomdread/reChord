<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI Routing Matrix</title>
    <style>
        :root {
            --cell-padding: 8px;
            --header-bg: #f2f2f2;
            --row-hover: #f5f5f5;
            --highlight: #d1ffd1;
            --border: #ddd;
            --radius: 4px;
        }
        body {
            background: #f9f9f9;
            font-family: sans-serif;
            color: #222;
        }
        #main {
            padding: 20px;
        }
        .port-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .port-list {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px;
            box-shadow: 1px 1px 2px rgba(0,0,0,0.08);
        }
        .port-list h3 {
            margin: 0 0 10px 0;
            font-size: 1rem;
        }
        ul {
            list-style-type: none;
            padding-left: 0;
            max-height: 150px;
            overflow-y: auto;
            width: 320px;
            border: 1px solid var(--border);
            margin-top: 0;
        }
        ul li {
            margin-bottom: 4px;
            padding: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        ul li:hover {
            background-color: var(--row-hover);
        }
        .midi-activity {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #666;
            border-radius: 50%;
            transition: background-color 0.1s;
        }
        .midi-activity.active {
            background: #4CAF50;
            box-shadow: 0 0 4px rgba(76,175,80,0.8);
        }
        button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        button:focus {
            outline: 2px solid #4CAF50;
            outline-offset: 2px;
        }
        .routing-table {
            border-collapse: collapse;
            width: 100%;
            background: white;
            border-radius: var(--radius);
            box-shadow: 1px 1px 2px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .routing-table th, .routing-table td {
            border: 1px solid var(--border);
            padding: var(--cell-padding);
            text-align: center;
        }
        .routing-table th {
            background: var(--header-bg);
            font-weight: bold;
        }
        .routing-table tr:hover td {
            background: var(--row-hover);
        }
        .routing-table td.highlight {
            background: var(--highlight) !important;
        }
        .connection-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #4CAF50;
        }
        #notification-area {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }
        .notification {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            margin: 8px;
            border-radius: 4px;
            opacity: 1;
            transition: opacity 0.5s;
        }
        .notification.success { border-left: 4px solid #4CAF50; }
        .notification.info { border-left: 4px solid #2196F3; }
        .notification.warning { border-left: 4px solid #FFC107; }
        .notification.error { border-left: 4px solid #f44336; }
    </style>
</head>

<body>
    <div id="main">
        <h1>MIDI Routing Matrix</h1>
        <section class="port-selection">
            <div class="port-list">
                <h3>MIDI Inputs</h3>
                <ul id="midiInputsList" role="listbox" aria-label="MIDI Input Devices"></ul>
            </div>
            <div class="port-list">
                <h3>MIDI Outputs</h3>
                <ul id="midiOutputsList" role="listbox" aria-label="MIDI Output Devices"></ul>
            </div>
            <button id="refreshMatrixButton" aria-label="Refresh MIDI Matrix">Refresh Matrix</button>
        </section>
        <table id="midiMatrix" class="routing-table">
            <thead></thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Add notification area -->
    <div id="notification-area"></div>

    <script>
        // --- CONFIGURATION ---
        const CONFIG = {
            DEBOUNCE_DELAY: 200,
            ACTIVITY_TIMEOUT: 100,
            STORAGE_KEYS: {
                MIDI_INPUT_IDS: 'selectedMidiInputIds',
                MIDI_OUTPUT_IDS: 'selectedMidiOutputIds',
                MIDI_CONNECTIONS: 'midiConnections'
            },
            ELEMENTS: {
                MIDI_INPUTS_LIST: 'midiInputsList',
                MIDI_OUTPUTS_LIST: 'midiOutputsList',
                MIDI_MATRIX: 'midiMatrix',
                REFRESH_BUTTON: 'refreshMatrixButton',
                NOTIFICATION_AREA: 'notification-area'
            },
            CLASSES: {
                HIGHLIGHT: 'highlight',
                STATUS_MESSAGE: 'status-message',
                STATUS_SUCCESS: 'success',
                STATUS_ERROR: 'error'
            }
        };

        // --- STATE ---
        let midiInputs = {};
        let midiOutputs = {};
        let allMidiInputs = [];
        let allMidiOutputs = [];
        let midiAccessGlobal = null;
        let debounceTimer = null;
        let activityTimers = new Map();

        // --- MIDI INITIALIZATION ---
        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess()
                .then(initializeMidi)
                .catch(error => {
                    console.error("Failed to initialize MIDI:", error);
                    showNotification("Failed to initialize MIDI. Please check your browser settings and try again.", "error");
                });
        } else {
            showNotification("Your browser does not natively support the Web MIDI API. Please consider using a different browser or installing a polyfill.", "error");
        }

        function initializeMidi(midiAccess) {
            midiAccessGlobal = midiAccess;
            allMidiInputs = Array.from(midiAccess.inputs.values());
            allMidiOutputs = Array.from(midiAccess.outputs.values());
            populatePortSelection();
            restoreSelections();
            populateMidiMatrix();
            setupMidiRouting();
            loadConnections();
            document.getElementById(CONFIG.ELEMENTS.REFRESH_BUTTON).addEventListener("click", handleRefreshMatrix);
        }

        // --- UI POPULATION ---
        function populatePortSelection() {
            const inputsList = document.getElementById(CONFIG.ELEMENTS.MIDI_INPUTS_LIST);
            const outputsList = document.getElementById(CONFIG.ELEMENTS.MIDI_OUTPUTS_LIST);
            inputsList.innerHTML = "";
            outputsList.innerHTML = "";
            
            allMidiInputs.forEach(input => {
                const li = document.createElement("li");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.id = `input_${input.id || input.name}`;
                checkbox.value = input.id || input.name;
                
                const activityIndicator = document.createElement("span");
                activityIndicator.className = "midi-activity";
                activityIndicator.id = `input_activity_${input.id || input.name}`;
                
                const label = document.createElement("label");
                label.htmlFor = checkbox.id;
                label.textContent = input.name;
                
                li.appendChild(checkbox);
                li.appendChild(activityIndicator);
                li.appendChild(label);
                inputsList.appendChild(li);
            });
            
            allMidiOutputs.forEach(output => {
                const li = document.createElement("li");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.id = `output_${output.id || output.name}`;
                checkbox.value = output.id || output.name;
                
                const activityIndicator = document.createElement("span");
                activityIndicator.className = "midi-activity";
                activityIndicator.id = `output_activity_${output.id || output.name}`;
                
                const label = document.createElement("label");
                label.htmlFor = checkbox.id;
                label.textContent = output.name;
                
                li.appendChild(checkbox);
                li.appendChild(activityIndicator);
                li.appendChild(label);
                outputsList.appendChild(li);
            });
        }

        // --- SELECTIONS ---
        function restoreSelections() {
            const savedInputIds = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.MIDI_INPUT_IDS) || 'null');
            const savedOutputIds = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.MIDI_OUTPUT_IDS) || 'null');
            const inputsList = document.getElementById(CONFIG.ELEMENTS.MIDI_INPUTS_LIST);
            const outputsList = document.getElementById(CONFIG.ELEMENTS.MIDI_OUTPUTS_LIST);
            if (savedInputIds && Array.isArray(savedInputIds)) {
                for (const checkbox of inputsList.querySelectorAll("input[type=checkbox]")) {
                    checkbox.checked = savedInputIds.includes(checkbox.value);
                }
            } else {
                selectAllCheckboxes(inputsList);
            }
            if (savedOutputIds && Array.isArray(savedOutputIds)) {
                for (const checkbox of outputsList.querySelectorAll("input[type=checkbox]")) {
                    checkbox.checked = savedOutputIds.includes(checkbox.value);
                }
            } else {
                selectAllCheckboxes(outputsList);
            }
        }
        function selectAllCheckboxes(container) {
            for (const checkbox of container.querySelectorAll("input[type=checkbox]")) {
                checkbox.checked = true;
            }
        }

        // --- MATRIX RENDERING ---
        function populateMidiMatrix() {
            const inputsList = document.getElementById(CONFIG.ELEMENTS.MIDI_INPUTS_LIST);
            const outputsList = document.getElementById(CONFIG.ELEMENTS.MIDI_OUTPUTS_LIST);
            const table = document.getElementById(CONFIG.ELEMENTS.MIDI_MATRIX);
            const thead = table.querySelector("thead");
            const tbody = table.querySelector("tbody");
            
            // Get selected inputs and outputs
            const selectedInputValues = Array.from(inputsList.querySelectorAll("input[type=checkbox]:checked")).map(cb => cb.value);
            const selectedOutputValues = Array.from(outputsList.querySelectorAll("input[type=checkbox]:checked")).map(cb => cb.value);
            const selectedInputs = allMidiInputs.filter(input => selectedInputValues.includes(input.id || input.name));
            const selectedOutputs = allMidiOutputs.filter(output => selectedOutputValues.includes(output.id || output.name));
            
            // Clear previous table header and body content
            thead.innerHTML = "";
            tbody.innerHTML = "";
            
            // Populate header row (inputs)
            const headerRow = document.createElement("tr");
            headerRow.appendChild(document.createElement("th")); // Empty top-left cell
            selectedInputs.forEach(input => {
                const th = document.createElement("th");
                th.textContent = input.name;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            
            // Populate body rows (outputs)
            selectedOutputs.forEach(output => {
                const row = document.createElement("tr");
                const th = document.createElement("th");
                th.textContent = output.name;
                row.appendChild(th);
                
                selectedInputs.forEach(input => {
                    const td = document.createElement("td");
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.className = "connection-checkbox";
                    checkbox.checked = isConnectionActive(input.name, output.name);
                    checkbox.addEventListener('change', () => {
                        td.classList.toggle(CONFIG.CLASSES.HIGHLIGHT, checkbox.checked);
                        updateMidiRouting(input.name, output.name, checkbox.checked);
                        debounceSaveConnections();
                    });
                    td.appendChild(checkbox);
                    row.appendChild(td);
                });
                tbody.appendChild(row);
            });
            
            // Update midiInputs and midiOutputs to only selected ones
            midiInputs = selectedInputs.reduce((acc, input) => {
                acc[input.name] = input;
                return acc;
            }, {});
            midiOutputs = selectedOutputs.reduce((acc, output) => {
                acc[output.name] = output;
                return acc;
            }, {});
        }

        // --- MIDI ROUTING ---
        function setupMidiRouting() {
            // Remove previous listeners
            for (const input of Object.values(midiInputs)) {
                input.onmidimessage = null;
            }
            // Set up listeners for each input
            for (const input of Object.values(midiInputs)) {
                input.onmidimessage = (function(inputName) {
                    return function(event) {
                        handleMidiMessage(event, inputName);
                    };
                })(input.name);
            }
        }

        // Add new function to handle immediate routing updates
        function updateMidiRouting(inputName, outputName, isConnected) {
            // Get the actual MIDI input and output objects
            const input = midiInputs[inputName];
            const output = midiOutputs[outputName];
            
            if (!input || !output) {
                console.error('Invalid MIDI port configuration:', { inputName, outputName });
                return;
            }

            // If this is the first connection for this input, set up the message handler
            if (isConnected && !input.onmidimessage) {
                input.onmidimessage = (function(inputName) {
                    return function(event) {
                        handleMidiMessage(event, inputName);
                    };
                })(inputName);
            }

            // If this is the last connection for this input, remove the message handler
            if (!isConnected) {
                const table = document.getElementById(CONFIG.ELEMENTS.MIDI_MATRIX);
                const row = Array.from(table.querySelectorAll("tbody tr"))
                    .find(r => r.querySelector("th").textContent === inputName);
                
                if (row) {
                    const hasAnyConnections = Array.from(row.querySelectorAll("td input[type=checkbox]"))
                        .some(cb => cb.checked);
                    
                    if (!hasAnyConnections) {
                        input.onmidimessage = null;
                    }
                }
            }

            showNotification(
                `${isConnected ? 'Connected' : 'Disconnected'} ${inputName} to ${outputName}`,
                isConnected ? 'success' : 'info'
            );
        }

        function handleMidiMessage(event, inputName) {
            const message = event.data;
            const table = document.getElementById(CONFIG.ELEMENTS.MIDI_MATRIX);
            const rows = Array.from(table.querySelectorAll("tbody tr"));
            
            // Flash input activity
            const inputId = Object.entries(midiInputs).find(([name]) => name === inputName)?.[1]?.id;
            if (inputId) {
                flashActivity(inputId, 'input');
            }
            
            for (const row of rows) {
                const outputName = row.querySelector("th").textContent;
                const cells = Array.from(row.querySelectorAll("td"));
                const inputIndex = Object.keys(midiInputs).indexOf(inputName);
                
                // If the checkbox for this input-output pair is checked, route the message
                if (inputIndex >= 0 && cells[inputIndex].querySelector("input").checked) {
                    try {
                        midiOutputs[outputName].send(message);
                        // Flash output activity
                        const outputId = midiOutputs[outputName].id;
                        if (outputId) {
                            flashActivity(outputId, 'output');
                        }
                        cells[inputIndex].classList.add(CONFIG.CLASSES.HIGHLIGHT);
                        setTimeout(() => {
                            cells[inputIndex].classList.remove(CONFIG.CLASSES.HIGHLIGHT);
                        }, 200);
                    } catch (error) {
                        console.error(`Failed to send MIDI message to ${outputName}:`, error);
                        showNotification(`Failed to send MIDI message to ${outputName}`, 'error');
                    }
                }
            }
        }

        // --- CONNECTIONS ---
        function isConnectionActive(inputName, outputName) {
            const savedConnections = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.MIDI_CONNECTIONS) || '[]');
            return savedConnections.some(conn => conn.input === inputName && conn.output === outputName);
        }
        function saveConnections() {
            try {
                const table = document.getElementById(CONFIG.ELEMENTS.MIDI_MATRIX);
                const rows = Array.from(table.querySelectorAll("tbody tr"));
                let connections = [];
                const outputNames = Array.from(table.querySelector("thead tr").children)
                    .slice(1)
                    .map(th => th.textContent);

                rows.forEach((row) => {
                    const inputName = row.querySelector("th").textContent;
                    const cells = Array.from(row.querySelectorAll("td"));
                    cells.forEach((cell, colIndex) => {
                        const checkbox = cell.querySelector('input[type="checkbox"]');
                        if (checkbox && checkbox.checked) {
                            const outputName = outputNames[colIndex];
                            connections.push({ input: inputName, output: outputName });
                        }
                    });
                });

                localStorage.setItem(CONFIG.STORAGE_KEYS.MIDI_CONNECTIONS, JSON.stringify(connections));
                showNotification('MIDI connections saved successfully', 'success');
            } catch (error) {
                console.error('Failed to save MIDI connections:', error);
                showNotification('Failed to save MIDI connections', 'error');
            }
        }
        // Debounced version of saveConnections
        const debounceSaveConnections = debounce(saveConnections, CONFIG.DEBOUNCE_DELAY);
        function debounce(fn, delay) {
            return function(...args) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => fn(...args), delay);
            };
        }
        function loadConnections() {
            try {
                const table = document.getElementById(CONFIG.ELEMENTS.MIDI_MATRIX);
                if (!table) return;
                
                const rows = Array.from(table.querySelectorAll("tbody tr"));
                if (!rows.length) return;

                const outputNames = Array.from(table.querySelector("thead tr").children)
                    .slice(1)
                    .map(th => th.textContent);
                
                const savedConnections = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEYS.MIDI_CONNECTIONS) || '[]');
                
                rows.forEach((row) => {
                    const inputName = row.querySelector("th").textContent;
                    const cells = Array.from(row.querySelectorAll("td"));
                    cells.forEach((cell, colIndex) => {
                        const checkbox = cell.querySelector('input[type="checkbox"]');
                        if (checkbox) {
                            const outputName = outputNames[colIndex];
                            const isActive = savedConnections.some(conn => 
                                conn.input === inputName && conn.output === outputName
                            );
                            checkbox.checked = isActive;
                            cell.classList.toggle(CONFIG.CLASSES.HIGHLIGHT, isActive);
                        }
                    });
                });
                showNotification('MIDI connections loaded successfully', 'success');
            } catch (error) {
                console.error('Failed to load MIDI connections:', error);
                showNotification('Failed to load MIDI connections', 'error');
            }
        }

        // --- UI EVENTS ---
        function handleRefreshMatrix() {
            const inputsList = document.getElementById(CONFIG.ELEMENTS.MIDI_INPUTS_LIST);
            const outputsList = document.getElementById(CONFIG.ELEMENTS.MIDI_OUTPUTS_LIST);
            // Save current selections to localStorage
            const selectedInputValues = Array.from(inputsList.querySelectorAll("input[type=checkbox]:checked")).map(cb => cb.value);
            const selectedOutputValues = Array.from(outputsList.querySelectorAll("input[type=checkbox]:checked")).map(cb => cb.value);
            localStorage.setItem(CONFIG.STORAGE_KEYS.MIDI_INPUT_IDS, JSON.stringify(selectedInputValues));
            localStorage.setItem(CONFIG.STORAGE_KEYS.MIDI_OUTPUT_IDS, JSON.stringify(selectedOutputValues));
            populateMidiMatrix();
            setupMidiRouting();
            loadConnections();
        }

        // --- STATUS MESSAGE ---
        function showNotification(message, type = 'info', duration = 3000) {
            const notificationArea = document.getElementById(CONFIG.ELEMENTS.NOTIFICATION_AREA);
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            notificationArea.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 500);
            }, duration);
        }

        // --- ACTIVITY INDICATORS ---
        function flashActivity(portId, type = 'input') {
            const indicatorId = `${type}_activity_${portId}`;
            const indicator = document.getElementById(indicatorId);
            if (!indicator) return;

            // Clear any existing timeout
            if (activityTimers.has(indicatorId)) {
                clearTimeout(activityTimers.get(indicatorId));
            }

            // Show activity
            indicator.classList.add('active');

            // Set timeout to hide activity
            const timer = setTimeout(() => {
                indicator.classList.remove('active');
                activityTimers.delete(indicatorId);
            }, CONFIG.ACTIVITY_TIMEOUT);

            activityTimers.set(indicatorId, timer);
        }
    </script>

</body>

</html>
